function startReview(gid, replace) {
  const q = dueQueue();
  const g = gid ? q.find(x => x.gid === gid) : q[0];
  if (!g) { toast('今天没有到期的复习'); return; }
  const order = q.findIndex(x => x.gid === g.gid);
  S.reviewSession = { gid: g.gid, ids: g.ids.slice(0, 20), i: 0, fb: null, ratings: {}, groupNo: order + 1, groupTotal: q.length, more: g.ids.length > 20 };
  save();
  (replace ? replaceRoute : go)({ v: 'review' });
}
function vReview() {
  const rs = S.reviewSession;
  if (!rs) return ui.lastReview ? vReviewDone() : { redirect: { v: 'today' } };
  const G = GROUPS.get(rs.gid);
  let id = rs.ids[rs.i], it = ITEMS.get(id);
  while (rs.i < rs.ids.length && !it) { rs.i++; id = rs.ids[rs.i]; it = ITEMS.get(id); }
  if (!it || !G) { finishReview(); return vReviewDone(); }
  const fb = rs.fb;
  const d = fb ? diff(fb.input, answerOf(it)) : null;
  let rates = '';
  if (fb) {
    const sug = fb.revealed ? 'fgt' : d.ok ? 'rem' : d.score >= 0.6 ? 'vag' : 'fgt';
    rates = `<div class="rates">${[['rem', '记得', 'r-rem'], ['vag', '模糊', 'r-vag'], ['fgt', '忘记', 'r-fgt']].map(([k, t, c], i) => `<button class="rate ${c} ${sug === k ? 'suggest' : ''}" type="button" data-a="rate" data-r="${k}" ${sug === k ? 'data-enter' : ''}><b>${t}</b><span>${nextIntervalLabel(id, k)}</span></button>`).join('')}</div>
      <p class="note-line">评分只记录这一次的表现，不会直接把内容改成永久掌握。</p>`;
  }
  const s = S.items[id] || {};
  return {
    title: G.name, crumb: ['今日复习', `第 ${rs.groupNo} / ${rs.groupTotal} 组`, ...groupCrumb(G)], focus: true,
    body: `<div class="session">
      <div class="session-head"><div class="progress" style="flex:1"><span>${rs.i + 1} / ${rs.ids.length}${rs.more ? ' · 本组分轮' : ''}</span><div class="pbar"><i style="width:${rs.i / rs.ids.length * 100}%"></i></div></div><button class="btn btn-outline btn-sm" type="button" data-a="exit">退出并保存</button></div>
      <div class="qcard">
        <div class="qtype">${typeTag(it.type)}<span>${PROMPT_LABEL[it.type]}</span>${s.wrong ? `<span class="tag" style="background:var(--wrong-soft);color:var(--wrong)">曾写错 ${s.wrong} 次</span>` : ''}</div>
        ${promptHTML(it, 'review')}
        ${answerForm(fb, it.type === 'core' || it.type === 'grammar')}
        ${fb ? fbHTML(d, it, fb.revealed) + rates : ''}
      </div></div>`,
  };
}
function finishReview() {
  const rs = S.reviewSession;
  const ratings = rs.ratings;
  const ids = Object.keys(ratings);
  const fgt = ids.filter(id => ratings[id] === 'fgt').length;
  let pulled = false;
  if (ids.length >= 4 && fgt / ids.length >= 0.5) {
    const cap = addDays(Date.now(), 3);
    ids.filter(id => ratings[id] === 'rem').forEach(id => { const s = st(id); if (s.next > cap) { s.next = cap; pulled = true; } });
  }
  ui.lastReview = { gid: rs.gid, ratings, ids, pulled, practiced: false };
  S.reviewSession = null;
  save();
}
function vReviewDone() {
  const r = ui.lastReview, G = GROUPS.get(r.gid);
  const c = { rem: 0, vag: 0, fgt: 0 };
  r.ids.forEach(id => c[r.ratings[id]]++);
  const wrongIds = r.ids.filter(id => r.ratings[id] !== 'rem' && ITEMS.has(id));
  const q = dueQueue();
  const ck = canCheckin();
  const l = todayLog();
  let main;
  if (q.length) main = `<button class="btn btn-primary" type="button" data-a="startreview-replace">继续下一组（还剩 ${q.length} 组）</button>`;
  else if (ck) main = `<button class="btn btn-primary" type="button" data-a="checkin-back">完成复习并打卡</button>`;
  else if (l.checked) main = `<span class="tag core">今天已打卡</span>`;
  else main = '';
  return {
    title: '本组复习完成', crumb: ['今日复习', G ? G.name : ''], focus: true,
    body: `<div class="session">

      <div class="qcard"><p class="warm">${q.length ? '今天还有其他到期的表达组。每组单独完成，保持各自的语境。' : ck ? '今天到期的复习已经全部完成。确认后写入学习记录和月度日历。' : '今天到期的复习已经全部完成。'}</p>
        <div class="btn-row">${main}${wrongIds.length && !r.practiced ? '<button class="btn btn-soft" type="button" data-a="practice">再练一次错题</button>' : ''}<button class="btn btn-ghost" type="button" data-a="donereview">返回</button></div></div>
    </div>`,
  };

function groupHero(G, s, cls, desc) {

    body = groupHero(G, s, '', G.scene) +

      (G.related && G.related.length ? `<section class="section"><div class="section-head"><h3>相关表达</h3></div><div class="chips">${G.related.map(x => GROUPS.get(x)).filter(Boolean).map(X => `<button class="chip" type="button" data-go="group:${esc(X.id)}">${esc(X.topic)} · ${esc(X.name)}</button>`).join('')}</div></section>` : '');

    }).join('');

      <section class="section"><div class="section-head"><h3>示例句与常见错误</h3></div><div class="rows">${ids.map(id => { const it = ITEMS.get(id); return `<div class="row white"><div class="body"><span class="en" style="font-size:17px">${highlightIn(it.ex || '', [fixedPart(it.en)])}</span>${it.err ? `<span class="meta">常见错误：${esc(it.err)}</span>` : ''}</div>${favBtn(id)}</div>`; }).join('')}</div></section>`;

    if (it.type === 'expr') {

      add('常用搭配', it.col, esc(it.col), false);

      add('常见错误', it.err, esc(it.err), true);

      ${hist.length ? `<div class="chips">${hist.map(h => `<span class="tag ${h.r === 'rem' ? 'core' : h.r === 'fgt' ? 'know' : ''}">${agoDay(h.t)} · ${h.p === 'new' ? '新学' : RL[h.r]}</span>`).join('')}</div>` : ''}

      ${it.lib === 'notes' ? `<button class="btn btn-soft" type="button" data-go="edit:${esc(it.id)}">编辑卡片</button>` : ''}
      ${it.custom || it.lib === 'notes' ? `<button class="btn btn-ghost btn-danger" type="button" data-a="delitem" data-id="${esc(it.id)}" data-confirm="确认删除">删除</button>` : ''}</div>`;
  return { title: G.lib === 'notes' && G.ids.length < 2 ? '独立卡片' : G.name, crumb: groupCrumb(G), body: `<div class="detail"><div class="detail-main ${it.lib === 'notes' ? 'tight' : ''}">${main}</div><aside class="detail-side">${side}</aside></div>` };

/* ============================================================

const T = { topics: [], topic: new Map(), arg: new Map(), item: new Map(), term: new Map() };
function t3assemble() {
  for (const tp of TOPICS3) {
    const top = Object.assign({}, tp, { args: [], terms: [] });
    let n = 0;
    tp.stances.forEach((s, si) => s.args.forEach(a => {
      n++;
      const id = `a:${tp.id}:${n}`;
      const A = Object.assign({}, a, { id, n, topic: tp.id, side: si, stance: s.name, items: [] });
      const sent = { id: id + ':s', kind: 'sent', arg: id, role: '论点句', en: a.en, zh: a.zh, para: a.en };
      T.item.set(sent.id, sent); A.items.push(sent.id);
      a.exps.forEach((e, k) => {
        const it = Object.assign({}, e, { id: `${id}:e${k + 1}`, kind: 'exp', arg: id, para: e.para || e.en });
        T.item.set(it.id, it); A.items.push(it.id);
      });
      T.arg.set(id, A); top.args.push(id);
    }));
    for (const t of tp.terms) {
      const id = `tt:${tp.id}:${slug(t.en)}`;
      T.term.set(id, Object.assign({}, t, { id, kind: 'term', topic: tp.id }));

const tget = id => T.item.get(id) || T.term.get(id);
const RL3 = { rem: '记得', vag: '模糊', fgt: '忘记' };
const STAGE_LABEL = ['次日档', '3 天档', '7 天档', '14 天档', '30 天档', '60 天档'];
const TIER_LABEL = ['逐条默写', '默写论点句 → 范文填空', '只给中文论点，回忆全部', '范文填空（只给中文）'];

/* ---------- 存档 ---------- */
function t3init() {
  const d = { arg: {}, it: {}, term: {}, fav: {}, combos: [], learn: null, rev: null, revDone: null, set: {} };
  S.t3 = Object.assign(d, S.t3 || {});
  S.t3.set = Object.assign({ exam: '', shrink: false, extend: false, weakN: 3, weakM: 2, weakLast: true }, S.t3.set || {});
  if (S.t3.revDone && S.t3.revDone.day !== dayKey()) S.t3.revDone = null;
}
const AR = id => S.t3.arg[id] || (S.t3.arg[id] = { hist: [] });
const IR = id => S.t3.it[id] || (S.t3.it[id] = { hist: [], wrongs: [] });
const TR = id => S.t3.term[id] || (S.t3.term[id] = { hist: [], wrongs: [] });
const RR = id => id.startsWith('tt:') ? TR(id) : IR(id);
const argRec = id => S.t3.arg[id] || {};
const learnedArg = id => argRec(id).stage != null;
const argMem = id => argRec(id).mode === 'memory';
const termMem = id => (S.t3.term[id] || {}).mode === 'memory';

/* ---------- 间隔：次日 → 3 → 7 → 14 → 30（可选 60），可按考试日期缩短 ---------- */
const ladder = () => S.t3.set.extend ? [1, 3, 7, 14, 30, 60] : [1, 3, 7, 14, 30];
function examTs() { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(S.t3.set.exam || ''); return m ? new Date(+m[1], +m[2] - 1, +m[3]).getTime() : null; }
function capDays(d) {
  const ex = examTs();
  if (ex && S.t3.set.shrink) { const left = diffDays(ex); if (left >= 1) return Math.max(1, Math.min(d, Math.floor(left / 3))); }
  return d;
}
function stepStage(stage, r) {
  const max = ladder().length - 1; let s = Math.min(stage == null ? 0 : stage, max);
  if (r === 'rem') s = Math.min(s + 1, max); else if (r === 'vag') s = Math.max(s - 1, 0); else s = 0;
  return s;
}
function sched(rec, r) { rec.stage = stepStage(rec.stage, r); rec.next = addDays(Date.now(), capDays(ladder()[rec.stage])); rec.last = Date.now(); }
/* 题型：0 逐条默写 · 1 默写论点句 + 有原形的填空 · 3 只给中文的填空（7 天）· 2 只给中文论点、回忆全部（14 / 30 天） */
const tierOf = stage => !stage ? 0 : stage === 1 ? 1 : stage === 2 ? 3 : 2;
function argDue(id) { const r = S.t3.arg[id]; return !!(r && r.mode === 'memory' && r.stage != null && r.next <= dayStart()); }
function termDue(id) { const r = S.t3.term[id]; return !!(r && r.mode === 'memory' && r.stage != null && r.next <= dayStart()); }
function mkDue(id) { const r = S.t3.it[id]; return !!(r && r.makeup != null && r.makeup <= dayStart() && !argDue(T.item.get(id).arg)); }
const comboOf = id => S.t3.combos.find(c => c.args.includes(id));
const worse = (a, b) => { const o = { rem: 0, vag: 1, fgt: 2 }; return (o[a] || 0) >= (o[b] || 0) ? a : b; };
function argResult(rates) {
  const v = Object.values(rates);
  if (v.every(x => x === 'rem')) return 'rem';
  return v.filter(x => x === 'fgt').length * 2 > v.length ? 'fgt' : 'vag';
}
function t3plan() {
  const mk = [...T.item.keys()].filter(mkDue);
  const due = [...T.arg.keys()].filter(argDue);
  const bad = id => ({ fgt: 2, vag: 1 }[argRec(id).lastR] || 0);
  due.sort((a, b) => argRec(a).next - argRec(b).next || bad(b) - bad(a));
  const groups = [];
  for (const id of due) {
    const c = comboOf(id), key = c ? c.id : 'x:' + T.arg.get(id).topic;
    let g = groups.find(x => x.key === key);
    if (!g) groups.push(g = { key, combo: c, topic: T.arg.get(id).topic, ids: [] });
    g.ids.push(id);
  }
  const terms = [...T.term.keys()].filter(termDue).sort((a, b) => S.t3.term[a].next - S.t3.term[b].next);
  const args = groups.flatMap(g => g.ids);
  return { mk, groups, args, terms, n: mk.length + args.reduce((s, id) => s + T.arg.get(id).items.length, 0) + terms.length };
}
const t3DueCount = () => t3plan().n;
const t3Pend = () => [...T.arg.keys()].filter(id => argRec(id).pend);
function t3dueOn(t) {
  let n = 0;
  for (const [id, A] of T.arg) { const r = S.t3.arg[id]; if (r && r.mode === 'memory' && r.next === t) n += A.items.length; }
  for (const id of T.term.keys()) { const r = S.t3.term[id]; if (r && r.mode === 'memory' && r.next === t) n++; }
  for (const id of T.item.keys()) { const r = S.t3.it[id]; if (r && r.makeup === t) n++; }
  return n;
}

/* ---------- 判定：正确 / 形式不对 / 只错一点 / 错得较多 ---------- */
const IRR = { is: 'be', am: 'be', are: 'be', was: 'be', were: 'be', been: 'be', being: 'be', has: 'have', had: 'have', does: 'do', did: 'do', done: 'do', went: 'go', gone: 'go', underwent: 'undergo', undergone: 'undergo', fell: 'fall', fallen: 'fall', gave: 'give', given: 'give', took: 'take', taken: 'take', made: 'make', led: 'lead', felt: 'feel', kept: 'keep', brought: 'bring', sold: 'sell', paid: 'pay', spent: 'spend', grew: 'grow', grown: 'grow', rose: 'rise', risen: 'rise', children: 'child', people: 'person', men: 'man', women: 'woman' };
function stem(w) {
  if (IRR[w]) return IRR[w];
  let s = w;
  if (s.length > 4 && /ies$/.test(s)) s = s.slice(0, -3) + 'y';
  else if (s.length > 4 && /ied$/.test(s)) s = s.slice(0, -3) + 'y';
  else if (s.length > 5 && /ing$/.test(s)) s = s.slice(0, -3);
  else if (s.length > 4 && /ed$/.test(s)) s = s.slice(0, -2);
  else if (s.length > 4 && /es$/.test(s)) s = s.slice(0, -2);
  else if (s.length > 3 && /s$/.test(s) && !/(ss|us|is)$/.test(s)) s = s.slice(0, -1);
  s = s.replace(/e$/, '');
  if (/([b-df-hj-np-tv-z])\1$/.test(s)) s = s.slice(0, -1);
  return s;
}
const ARTS = new Set(['a', 'an', 'the']);
function formOnly(user, correct) {
  const norm = s => tok(s).map(t => t.n).filter(n => n && !ARTS.has(n)).map(stem);
  const a = norm(user), b = norm(correct);
  return a.length > 0 && a.length === b.length && a.every((x, i) => x === b[i]);
}
function grade(input, answer, revealed) {
  if (revealed) return { g: 'fgt', tier: 'reveal' };
  const d = diff(input, answer);
  if (d.empty) return { g: 'fgt', tier: 'empty' };
  if (d.ok) return { g: 'rem', tier: 'ok' };
  if (formOnly(input, answer)) return { g: 'rem', tier: 'form' };
  const n = tok(answer).filter(t => t.n).length, m = tok(input).filter(t => t.n).length;
  const eq = Math.round(d.score * n), err = Math.max(n - eq, m - eq);
  if (!n || err / n > 0.5) return { g: 'fgt', tier: 'bad' };
  return { g: 'vag', tier: err === 1 ? 'one' : 'some' };
}
const firstLetters = s => String(s).split(/\s+/).map(w => w.replace(/[A-Za-z]/g, (c, i) => i === w.search(/[A-Za-z]/) ? c : '_')).join(' ');
const blankAnswer = id => id.startsWith('tt:') ? T.term.get(id).en : T.item.get(id).para;

/* ---------- 范文里的标记 ---------- */
function findRanges(text, specs) {
  const low = text.toLowerCase(), out = [];
  const isW = c => /[a-z0-9]/i.test(c || '');
  for (const sp of specs) {
    if (!sp.p) continue;
    const p = sp.p.toLowerCase();
    let i = low.indexOf(p);
    while (i >= 0 && (out.some(r => i < r.e && i + p.length > r.s) || isW(text[i - 1]) || isW(text[i + p.length]) && isW(p[p.length - 1]))) i = low.indexOf(p, i + 1);
    if (i >= 0) out.push(Object.assign({ s: i, e: i + p.length }, sp));
  }
  return out.sort((a, b) => a.s - b.s);
}
function weave(text, ranges, fn) {
  let out = '', pos = 0;
  for (const r of ranges) { out += esc(text.slice(pos, r.s)) + fn(r, text.slice(r.s, r.e)); pos = r.e; }
  return out + esc(text.slice(pos));
}
function paraSpecs(A) {
  const tp = T.topic.get(A.topic);
  return [{ p: A.en, key: A.id + ':s', cls: 'sent' }]
    .concat(A.items.slice(1).map(id => ({ p: T.item.get(id).para, key: id, cls: 'exp' })))
    .concat(tp.terms.map(id => ({ p: T.term.get(id).en, key: id, cls: 'term' })))
    .concat((A.links || []).map(p => ({ p, cls: 'link' })));
}
function sentenceWith(text, phrase) {
  const parts = text.match(/[^.!?]+[.!?]+/g) || [text];
  return (parts.find(s => s.toLowerCase().includes(phrase.toLowerCase())) || '').trim();
}
const termsInPara = A => findRanges(A.para, paraSpecs(A)).filter(r => r.cls === 'term').map(r => r.key);
const termArgs = id => { const t = T.term.get(id); return T.topic.get(t.topic).args.filter(a => T.arg.get(a).para.toLowerCase().includes(t.en.toLowerCase())); };

function rseg(act, id, val) {

function stepsBar(names, idx) {

}
function topicStats(tp) {
  const r = { learned: 0, due: 0, next: Infinity, last: 0, fresh: 0 };
  for (const id of tp.args) {
    const a = argRec(id);
    if (a.stage == null) { r.fresh++; continue; }
    if (a.mode !== 'memory') continue;
    r.learned++; r.next = Math.min(r.next, a.next); r.last = Math.max(r.last, a.last || 0);
    if (argDue(id)) r.due++;
  }
  return r;
}

function t3Pick(r) {

    for (const id of fresh) if (sel.length < need && !sel.includes(id)) sel.push(id);
    ui.t3pick = { topic: tp.id, args: sel, terms: [] };

  if (!fresh.length) return { title: tp.name, crumb: ['今日新学', tp.theme], body: `<div class="empty"><h3>这个话题的论点都学过了</h3><p>到期的论点会出现在今日复习里。</p><button class="btn btn-outline" type="button" data-go="ttopic:${tp.id}">查看话题</button></div>` };

        const A = T.arg.get(id), done = learnedArg(id), on = P.args.includes(id);
        return `<button class="t-pick ${on ? 'on' : ''}" type="button" data-a="t3pickarg" data-id="${id}" ${done ? 'disabled' : ''} aria-pressed="${on}">
          <span class="check" aria-checked="${on || done}">${svg('check', 2.6)}</span>
          <span class="txt"><span class="meta">论点 ${A.n} · ${esc(A.short)} · ${A.items.length} 条${done ? ' · 已学过' : on ? '' : ' · 不选则作为资料'}</span><span class="en">${esc(A.en)}</span><span class="zh">${esc(A.zh)}</span><span class="t-link-btn" role="link" data-go="targ:${id}">查看详情 ›</span></span></button>`;
      }).join('')}</div>`;
  }).join('')}</div>`;

function wrongList(id) {
  const ans = tget(id).en, rec = id.startsWith('tt:') ? S.t3.term[id] : S.t3.it[id];

  const m = new Map();
  ws.forEach(w => { const k = w.input.trim().toLowerCase(); const x = m.get(k); if (x) { x.n++; if (w.t > x.t) Object.assign(x, { t: w.t, r: w.r }); } else m.set(k, Object.assign({ n: 1 }, w)); });
  const list = [...m.values()].sort((a, b) => b.t - a.t).slice(0, 5);
  if (!list.length) return '<span class="note-line">还没有写错过。复习和新学时写错的答案会自动收在这里。</span>';
  return list.map(w => { const d = diff(w.input, ans); return `<div class="t-wrong"><small>${fmtMD(w.t)} · ${RL3[w.r] || '写错'}${w.n > 1 ? ` · ${w.n} 次` : ''}</small><span class="en">${d.userHTML}</span><span class="en ok">→ ${esc(ans)}</span></div>`; }).join('');
}

/* ---------- 交互 ---------- */
function t3ctx() {
  const v = cur().v;
  if (v === 'tlearn') {
    const L = S.t3.learn;
    if (L.step === 'write') { const id = L.q[0]; return { h: L, id, ans: T.item.get(id).en, learn: true }; }
    if (L.step === 'fill') { const id = feKey(L.fill); return { h: L, id, ans: blankAnswer(id), learn: true, fill: true }; }
    if (L.step === 'terms') { const x = L.tq[0]; return { h: L, id: x.id, part: x.part, ans: T.term.get(x.id).en, learn: true }; }
  }
  if (v === 'trev') {
    const R = S.t3.rev, q = R.queue[R.i], u = R.u;
    if (q.k === 'arg') { const id = u.step === 'fill' ? (u.fb ? u.cur : feKey(u)) : u.list[u.j]; return { h: u, id, ans: u.step === 'fill' ? blankAnswer(id) : T.item.get(id).en, arg: true }; }
    return { h: u, id: q.id, ans: tget(q.id).en };
  }
  if (v === 'tpara' && ui.t3pp) { const P = ui.t3pp, id = feKey(P); return id ? { h: P, id, ans: blankAnswer(id), prac: true, pp: true } : null; }
  if (v === 'iprac') { const p = ui.iprac; return { h: p, id: p.id, ans: pracAns(ITEMS.get(p.id)), prac: true }; }
  if (v === 'tprac') { const p = ui.t3prac; return { h: p, id: p.ids[p.i], ans: anyItem(p.ids[p.i]).en, prac: true }; }
  return null;
}
function t3answer(input, revealed) {
  const c = t3ctx();
  if (!c) return;
  const g = grade(input, c.ans, revealed);
  const fb = { input: revealed ? '' : input, g: g.g, tier: g.tier, hinted: !!c.h.hinted };
  c.h.fb = fb;

      ${card('未来 7 天要复习', '<button class="t-link-btn" type="button" data-a="t3rectab" data-v="sched">看复习日程 ›</button>',

    </div>
    <div class="r-grid2">
      ${card('各档位有多少条', '<small class="muted">浅红 = 其中薄弱的</small>', `<div class="r-dist">${dist.map(([k, c, w]) => `<div><span>${k}</span><span class="track"><i style="width:${(c - w) / dmax * 100}%"></i><i class="w" style="width:${w / dmax * 100}%"></i></span><span class="num"><b>${c}</b>${w ? ` <small>薄弱 ${w}</small>` : ''}</span></div>`).join('')}</div>`)}
      ${card('最近的学习', '', recent.length ? `<div class="r-recent">${recent.map(k => { const g = S.log[k]; return `<div><span>${+k.slice(5, 7)} 月 ${+k.slice(8)} 日${g.checked ? ' <small>· 已打卡</small>' : ''}</span><span class="muted">新学 ${g.learned || 0} · 复习 ${(g.rem || 0) + (g.vag || 0) + (g.fgt || 0)}</span></div>`; }).join('')}</div>` : '<p class="warm">还没有学习记录。</p>')}

/* ---------- 词条清单 ---------- */
function recList(all) {
  const f = ui.recSrc || 'all', q = (ui.recQ || '').trim().toLowerCase(), weakOnly = !!ui.recWeak;
  const sort = S.t3.set.recSort || 'stage', flip = !!S.t3.set.recFlip, hi = weakHi();
  let xs = all.filter(x => (f === 'all' || x.src === f) && (!weakOnly || x.weak) && (!q || (x.en + ' ' + x.zh).toLowerCase().includes(q)));
  const nextKey = x => x.pend ? -1 : x.next;
  /* 每种排序的“默认方向”：档位从长到短、下次复习从近到远、学习时间从新到旧、写错从多到少 */
  const cmp = {
    stage: (a, b) => b.stage - a.stage || nextKey(a) - nextKey(b),
    next: (a, b) => nextKey(a) - nextKey(b) || b.stage - a.stage,
    first: (a, b) => b.first - a.first || nextKey(a) - nextKey(b),
    wrong: (a, b) => b.wrongN - a.wrongN || nextKey(a) - nextKey(b),
  }[sort] || ((a, b) => 0);
  xs.sort(flip ? (a, b) => -cmp(a, b) : cmp);
  const srcs = ['topic', 'term', 'notes', 'fn', 'old'].filter(k => all.some(x => x.src === k));
  const weakN = all.filter(x => x.weak).length;
  const n = ladder().length;
  const head = `<div class="r-row head"><span>表达</span><span>来源</span><span class="r-ladhead">${STAGE_LABEL.slice(0, n).map(s => `<small>${s.replace('档', '')}</small>`).join('')}</span><span style="text-align:right">下次复习</span></div>`;
  const rows = xs.map(x => `<button class="r-row ${x.weak && hi ? 'weak' : ''}" type="button" data-go="${esc(x.route)}">
      <span class="txt"><span class="en">${esc(x.en)}</span><small>${esc(x.zh)}</small>${x.weak ? `<span class="r-weak"><em>薄弱</em>${esc(x.weak)}</span>` : ''}</span>
      <span class="rsrc">${srcTag(x.src)}</span>${recLadder(x)}${recNext(x)}</button>`).join('');
  return `<div class="r-filters">
      ${[['all', '全部', all.length]].concat(srcs.map(k => [k, SRC3[k][0], all.filter(x => x.src === k).length])).map(([k, t, c]) => `<button class="r-chip ${f === k ? 'on' : ''}" type="button" data-a="t3recsrc" data-v="${k}">${t} ${c}</button>`).join('')}
      <button class="r-chip weakchip ${weakOnly ? 'on' : ''}" type="button" data-a="t3recweak">只看薄弱 ${weakN}</button>
      <button class="r-chip hichip ${hi ? 'on' : ''}" type="button" data-a="t3rechi" aria-pressed="${hi}">${hi ? '✓ ' : ''}薄弱标浅红</button>
      <input class="r-search" type="search" data-recq value="${esc(ui.recQ || '')}" placeholder="搜索英文或中文" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="搜索词条">
    </div>
    <div class="r-meta"><span>${recLadder({ stage: 2, weak: false }, true)} 走到第几格 = 记得多牢</span><span class="r-weakkey ${hi ? '' : 'plain'}"><i></i>${hi ? '浅红 = 薄弱' : '“薄弱”小标签 = 薄弱'}</span>
      <span class="r-sort">排序 ${[['stage', '档位'], ['next', '下次复习'], ['first', '学习时间'], ['wrong', '写错次数']].map(([k, t]) => `<button type="button" class="${sort === k ? 'on' : ''}" data-a="t3recsort" data-v="${k}">${t}</button>`).join('')}
        <button type="button" class="dir" data-a="t3recdir" aria-label="切换排序方向">⇅ ${{ stage: ['进度长 → 短', '进度短 → 长'], next: ['近 → 远', '远 → 近'], first: ['最新学的在前', '最早学的在前'], wrong: ['写错多 → 少', '写错少 → 多'] }[sort][flip ? 1 : 0]}</button></span></div>
    ${xs.length ? `<div class="r-table">${head}${rows}</div>` : `<div class="empty"><h3>${all.length ? '没有符合条件的条目' : '还没有学过的内容'}</h3><p>${all.length ? '换一个筛选试试。' : '完成第一组新学后，这里会列出每一条的档位和下次复习日期。'}</p></div>`}
    <p class="note-line">点一行进入详情页，返回回到这里。主题表达的论点句和展开表达跟着论点一起复习，所以同一个论点的几条日期相同。</p>`;
}

/* ---------- 复习日程 ---------- */
function dayEntries(t, all) {
  const today = dayStart(), rows = [];
  if (t <= today) {
    const P = t3plan();
    P.mk.forEach(id => rows.push({ kind: '补练', en: T.item.get(id).en, zh: T.item.get(id).zh, route: t3route(id), x: all.find(x => x.id === id) }));
    P.args.forEach(id => { const A = T.arg.get(id); rows.push({ kind: '论点', en: A.en, zh: `论点 ${A.n} · ${A.short} · 跟论点一起，共 ${A.items.length} 条`, route: 'targ:' + id, x: { stage: argRec(id).stage, weak: false } }); });
    P.terms.forEach(id => rows.push({ kind: '话题词汇', en: T.term.get(id).en, zh: T.term.get(id).zh, route: 'tterm:' + id, x: all.find(x => x.id === id) }));
    dueQueue().forEach(g => g.ids.forEach(id => { const x = all.find(y => y.id === id); if (x) rows.push({ kind: SRC3[x.src][0], en: x.en, zh: x.zh, route: x.route, x }); }));
    return rows;
  }
  for (const [id, A] of T.arg) { const r = S.t3.arg[id]; if (r && r.mode === 'memory' && r.next === t && !r.pend) rows.push({ kind: '论点', en: A.en, zh: `论点 ${A.n} · ${A.short} · 跟论点一起，共 ${A.items.length} 条`, route: 'targ:' + id, x: { stage: r.stage, weak: A.items.some(i => (all.find(x => x.id === i) || {}).weak) } }); }
  all.filter(x => x.makeup === t).forEach(x => rows.push({ kind: '补练', en: x.en, zh: x.zh, route: x.route, x }));
  all.filter(x => x.src !== 'topic' && x.next === t).forEach(x => rows.push({ kind: SRC3[x.src][0], en: x.en, zh: x.zh, route: x.route, x }));
  return rows;
}
function recSched(all) {
  const now = new Date();
  if (!ui.calMonth) ui.calMonth = [now.getFullYear(), now.getMonth()];
  const [y, m] = ui.calMonth, first = new Date(y, m, 1), days = new Date(y, m + 1, 0).getDate();
  const today = dayStart(), sel = ui.recDay || addDays(Date.now(), 1);
  const counts = {};
  for (let d = 1; d <= days; d++) { const t = new Date(y, m, d).getTime(); counts[d] = t < today ? null : dueOnDay(t); }
  const cmax = Math.max(1, ...Object.values(counts).filter(v => v));
  let cells = '日一二三四五六'.split('').map(d => `<span class="dow">${d}</span>`).join('');
  for (let i = 0; i < first.getDay(); i++) cells += '<span></span>';
  for (let d = 1; d <= days; d++) {
    const t = new Date(y, m, d).getTime(), c = counts[d];
    const a = c ? 0.15 + c / cmax * 0.6 : 0;
    cells += c == null ? `<span class="r-sday past">${d}</span>`
      : `<button class="r-sday ${t === sel ? 'sel' : ''} ${a > 0.55 ? 'dark' : ''}" type="button" data-a="t3recday" data-v="${t}" style="${c ? `background:rgba(114,128,109,${a.toFixed(2)})` : ''}"><span>${d}</span>${c ? `<b>${c}</b>` : ''}</button>`;
  }
  const rows = dayEntries(sel, all);
  const kinds = {};
  rows.forEach(r => { kinds[r.kind] = (kinds[r.kind] || 0) + (r.kind === '论点' ? 1 : 1); });
  const items = rows.reduce((s, r) => s + (r.kind === '论点' ? T.arg.get(r.route.slice(5)).items.length : 1), 0);
  const dd = new Date(sel), label = `${dd.getMonth() + 1} 月 ${dd.getDate()} 日 · ${relDay(sel)}`;
  return `<div class="r-sched">
    <section class="r-card"><div class="r-card-head"><b>${y} 年 ${m + 1} 月</b><span class="btn-row"><button class="icon-btn sm" type="button" data-a="calprev" aria-label="上个月">${svg('back', 2)}</button><button class="icon-btn sm" type="button" data-a="calnext" aria-label="下个月"><span style="transform:rotate(180deg);display:grid">${svg('back', 2)}</span></button></span></div>
      <div class="r-scal">${cells}</div><span class="note-line">格子里的数字 = 那天到期的条数，颜色越深越多；今天包含逾期的内容。点某一天看具体内容。</span></section>
    <section class="r-card line"><div class="r-card-head"><b class="r-dtitle">${label}</b><span class="muted">${items} 条 · 约 ${Math.max(1, Math.round(items * 1.3))} 分钟</span></div>
      <span class="note-line">${Object.entries(kinds).map(([k, v]) => `${k} ${v}${k === '论点' ? ' 个' : ''}`).join(' · ') || '这一天没有到期的内容'}</span>
      <div class="r-daylist">${rows.map(r => `<button class="r-dayrow ${r.x && r.x.weak && weakHi() ? 'weak' : ''}" type="button" data-go="${esc(r.route)}"><span class="txt"><span class="en">${esc(r.en)}</span><small>${esc(r.zh)}</small><span class="r-kind">${r.kind}${r.x && r.x.weak ? ' · <em>薄弱</em>' : ''}</span></span>${r.x && r.x.stage != null ? recLadder(r.x, true) : ''}</button>`).join('')}</div></section>
  </div>`;
}

/* ---------- 薄弱项 ---------- */
function recWeak(all) {
  const ws = all.filter(x => x.weak).sort((a, b) => (b.hist[b.hist.length - 1] === 'fgt') - (a.hist[a.hist.length - 1] === 'fgt') || b.wrongN - a.wrongN);

      <span class="mid">${srcTag(x.src)}<span class="why">${esc(x.weak)}</span>${rdots3(x.hist)}</span>
      <span class="wr">${wrongTxt(x)}</span>

    ${top.length ? `<section class="r-card line"><div class="r-card-head"><b>写错最多的</b></div><div class="r-recent">${top.map(x => `<button class="t-plain r-toprow" type="button" data-go="${esc(x.route)}"><span class="en">${esc(x.en)}</span><span class="muted">${x.wrongN} 次</span></button>`).join('')}</div></section>` : ''}`;
}

/* ============================================================
   详情页：功能表达 · 表达卡 · 句型卡 · 语法卡（左边词典式 BA–BD，右边 AT）
   练一遍（AR）：单独的练习页，不记录、不改复习安排
   ============================================================ */
const DETAIL_FIELDS = {
  expr: [['col', '搭配'], ['ex', '例句'], ['usage', '使用场景'], ['err', '常见错误']],
  pattern: [['slots', '可替换位置'], ['ex', '例句'], ['scene', '适用场景'], ['err', '常见错误']],
  grammar: [['rule', '规则'], ['ex', '更多正确例句'], ['limit', '使用限制 / 例外']],
};
const PRAC_HOW = { fn: '看中文写出这条表达', expr: '看中文写出英文', pattern: '看中文功能写出句型', grammar: '看错误句子改成正确的' };
const PRAC_TAG = { fn: 'expr', expr: 'expr', pattern: 'expr', grammar: 'expr' };

// 句型里 … 前后的固定部分；练一遍和结构拆解都用它
const patParts = en => en.split(/\s*(?:\.\.\.|…)\s*/).map(x => x.trim());
function pracAns(it) { return it.type === 'fn' || it.type === 'pattern' ? fixedPart(it.en) : it.en; }

function patHTML(en) {
  const ps = patParts(en);
  if (ps.length < 2) return esc(en);
  return ps.map((p, i) => (p ? esc(p) : '') + (i < ps.length - 1 ? `<span class="d-slot">${ps.length === 2 ? '自己填' : '…'}</span>` : '')).join(' ');
}
// 例句里要标出的部分：整条找不到时，去掉开头的 have / be 等动词再找（has had a profound impact on）
function exHL(v, it) {
  if (it.type === 'pattern') return [fixedPart(it.en)];
  const low = v.toLowerCase(), en = it.en.replace(/\s*(?:\.\.\.|…)\s*/g, ' ').trim();
  if (low.includes(en.toLowerCase())) return [en];
  const rest = en.split(' ').slice(1).join(' ');
  return rest && low.includes(rest.toLowerCase()) ? [rest] : [en];
}
// 搭配里用 / 隔开的几个词可以互换，标出来
function colHTML(t) {
  return esc(t).replace(/[A-Za-z'-]+(?:\s*\/\s*[A-Za-z'-]+)+/g, m => `<span class="d-hl">${m}</span>`);
}
// 常见错误写成“错 → 对”时，错的部分划掉
function errHTML(t) {
  const m = String(t).split(/\s*(?:→|->)\s*/);
  return m.length === 2 ? `<span class="en"><s class="d-x">${esc(m[0])}</s> → ${esc(m[1])}</span>` : esc(t);
}

/* ---------- 左边：词典式（设计稿 BA–BD） ---------- */
const dHead = (kind, sub, enHTML, zh) => `<header class="d-head"><span class="d-kind">${kind}</span><div class="en d-word">${enHTML}</div>${zh ? `<div class="d-zh">${esc(zh)}</div>` : ''}</header>`;
const dSec = (t, body, note = '') => !body ? '' : `<section class="d-sec"><div class="d-lab"><b>${t}</b><i></i>${note ? `<small>${note}</small>` : ''}</div>${body}</section>`;
const dQuote = (enHTML, zh, src, small) => `<div class="d-quote${small ? ' sm' : ''}">${src || ''}<span class="en">${enHTML}</span>${zh ? `<small>${esc(zh)}</small>` : ''}</div>`;
const dDl = rows => { const r = rows.filter(x => x[1]); return r.length ? `<div class="d-dl">${r.map(([a, b]) => `<span>${a}</span><div>${b}</div>`).join('')}</div>` : ''; };
const dFold = (k, title, sub, inner) => { const on = ui.dOpen === k; return `<div class="d-foldwrap"><button class="d-fold" type="button" data-a="dfold" data-k="${k}" aria-expanded="${on}"><span><b>${title}</b> <small>${sub}</small></span><span class="muted">${on ? '收起 ▴' : '展开 ▾'}</span></button>${on ? `<div class="d-foldin">${inner}</div>` : ''}</div>`; };

function fnMain(it, G) {
  const others = G.ids.map(x => ITEMS.get(x));
  const fp = fixedPart(it.en), low = fp.toLowerCase();
  const used = [...T.arg.values()].filter(A => A.para.toLowerCase().includes(low)).slice(0, 2).map(A => {
    const tp = T.topic.get(A.topic);
    return dQuote(markText(sentenceWith(A.para, fp), [{ p: fp }]), '', `<button class="d-src" type="button" data-go="tpara:${A.id}">主题表达范文里用到 · ${esc(tp.name)} · 论点 ${A.n} ${esc(A.short)} ›</button>`, true);
  }).join('');
  const cmp = `<div class="d-cmp"><div class="d-cmprow head"><span>表达</span><span>后面接</span><span>语气</span><span>区别</span></div>${others.map(o => {

  }).join('')}</div>`;
  const names = others.filter(o => o.id !== it.id).map(o => fixedPart(o.en)).slice(0, 3).join(' / ');
  return dHead('功能表达', G.fn, esc(it.en), it.zh) +
    (it.ex || used ? dSec('例句', (it.ex ? dQuote(highlightIn(it.ex, [fp])) : '') + used) : '') +

    (others.length > 1 ? dFold('cmp', '近义比较', `和 ${esc(names)} 怎么选`, cmp) : '');
}

function noteMain(it, G) {
  const fieldsFor = DETAIL_FIELDS[it.type] || [];
  const missing = fieldsFor.filter(([k]) => !it[k]).map(([, l]) => l);
  const sub = G.ids.length > 1 ? G.name : '独立卡片';
  let html;
  if (it.type === 'grammar') {
    const d = diff(it.wrong || '', it.en);
    html = dHead('语法卡', sub, esc(it.en), it.zh) +
      (it.wrong ? dSec('错误和正确', `<div class="d-pair"><b class="x">✕</b><span class="en">${d.userHTML}</span><b class="ok">✓</b><span class="en">${d.correctHTML}</span></div>`) : '') +
      (it.rule ? dSec('规则', `<p class="d-rule">${esc(it.rule)}</p>`) : '') +
      (it.ex ? dSec('更多正确例句', dQuote(esc(it.ex), '', '', true)) : '') +
      (it.limit ? dSec('注意', dDl([['使用限制', esc(it.limit)]])) : '');
  } else if (it.type === 'pattern') {
    const ps = patParts(it.en);
    html = dHead('句型卡', sub, patHTML(it.en), it.zh) +
      (ps.length > 1 ? dSec('结构', `<div class="d-struct">${ps.flatMap((p, i) => (p ? [`<span class="d-fixed en">${esc(p)}</span>`] : []).concat(i < ps.length - 1 ? ['<span class="d-slot">完整的内容（自己填）</span>'] : [])).join('<i>+</i>')}</div><small class="muted">下划线是固定部分，要一字不差；虚线框里自己填</small>`) : '') +
      (it.ex ? dSec('例句', dQuote(highlightIn(it.ex, exHL(it.ex, it)))) : '') +
      dSec('用法', dDl([['可替换', esc(it.slots || '')], ['适用场景', esc(it.scene || '')], ['常见错误', it.err ? errHTML(it.err) : '']]));
  } else {
    const sib = G.ids.filter(x => x !== it.id).map(x => ITEMS.get(x));
    html = dHead('表达卡', sub, esc(it.en), it.zh) +
      (it.ex ? dSec('例句', dQuote(highlightIn(it.ex, exHL(it.ex, it)))) : '') +
      (it.col ? dSec('搭配', `<div class="en d-col">${colHTML(it.col)}</div>`, /\//.test(it.col) ? '标绿的词可以换着用' : '') : '') +
      dSec('用法', dDl([['使用场景', esc(it.usage || '')], ['常见错误', it.err ? errHTML(it.err) : '']])) +
      (sib.length ? dSec('同组的其他表达', `<div class="d-sibs">${sib.map(o => `<button class="en" type="button" data-go="item:${esc(o.id)}">${esc(o.en)}</button>`).join('<i>·</i>')}</div>`) : '');
  }
  if (missing.length) html += `<div class="fill-hint"><span>还可以补充：${missing.join('、')}</span><button class="btn btn-soft btn-sm" type="button" data-go="edit:${esc(it.id)}">补充内容</button></div>`;
  return html;
}

/* ---------- 右边一栏（设计稿 AT） ---------- */
function itemWrongs(it) {
  const s = S.items[it.id] || {}, ans = it.en;
  const list = (s.wrongs || []).slice(-5).reverse().map(w => ({ label: `${fmtMD(w.t)} · ${RL3[w.r] || '写错'}`, input: w.input }));
  if (it.type === 'grammar' && it.wrong) list.push({ label: '原始笔记 · 导入时的错误写法', input: it.wrong });
  if (!list.length) return `<span class="note-line">${s.wrong ? `之前写错过 ${s.wrong} 次，没有留下原文。` : '还没有写错过。'}复习时写错的答案会自动收在这里。</span>`;
  return list.map(w => { const d = diff(w.input, ans); return `<div class="t-wrong"><small>${esc(w.label)}</small><span class="en">${d.userHTML}</span><span class="en ok">→ ${esc(ans)}</span></div>`; }).join('');
}
function nextOf(it, G) {
  if (G.ids.length > 1) return G.ids[(G.ids.indexOf(it.id) + 1) % G.ids.length];
  if (it.lib !== 'notes') return null;
  const ids = S.notes.items.filter(x => x.setId === it.setId).map(x => x.id);
  return ids.length > 1 ? ids[(ids.indexOf(it.id) + 1) % ids.length] : null;
}
const MODE_OPTS = [['memory', '记忆', '进入新学和复习'], ['reference', '资料', '只查阅，不复习'], ['paused', '暂缓', '先放一边，之后再决定']];
function itemSide(it, G) {

  let big, sub;
  if (!confirmedItem(it)) { big = '待整理'; sub = '这份笔记确认后才进入学习'; }
  else if (m === 'reference') { big = '资料'; sub = '不复习 · 切到“记忆”后才进入新学和复习'; }
  else if (m === 'paused') { big = '暂缓'; sub = '先放一边，不出现在新学和复习里'; }

  else { big = s.next <= dayStart() ? '今天要复习' : STAGE_LABEL[Math.min(s.stage, LADDER.length - 1)]; sub = `下次 ${fmtMD(s.next)} ${histDots(s.hist).replace('t-dots', 't-dots d-dots')}`; }
  const ml = MODE_OPTS.find(x => x[0] === m)[1];
  const menu = ui.dMode === it.id ? `<div class="d-menu" role="menu">${MODE_OPTS.map(([k, t, d]) => `<button type="button" role="menuitemradio" aria-checked="${k === m}" data-a="dmodeset" data-id="${esc(it.id)}" data-m="${k}" class="${k === m ? 'on' : ''}"><b>${k === m ? '✓ ' : ''}${t}</b><small>${d}</small></button>`).join('')}</div>` : '';
  const nid = nextOf(it, G), nx = nid && ITEMS.get(nid);
  const wN = Math.max(s.wrong || 0, (s.wrongs || []).length) + (it.type === 'grammar' && it.wrong ? 1 : 0);
  const row = (k, t, r) => `<button class="d-row" type="button" data-a="dfold" data-k="${k}" aria-expanded="${ui.dOpen === k}"><span>${t}</span><span class="muted">${r} ${ui.dOpen === k ? '▴' : '›'}</span></button>`;
  const noteEdit = ui.noteOpen === it.id;
  return `<aside class="d-side">

      ${noteEdit ? `<div class="d-rowin"><span class="muted" style="font-size:12px">个人备注</span><textarea class="note" data-note="${esc(it.id)}" placeholder="记录自己的用法、易错点或出处">${esc(s.note || '')}</textarea><button class="t-link-btn" type="button" data-a="dnote" data-id="">保存并收起</button></div>`
        : `<button class="d-row" type="button" data-a="dnote" data-id="${esc(it.id)}"><span>个人备注</span><span class="muted">${s.note ? '修改' : '＋ 写备注'} ›</span></button>${s.note ? `<div class="d-notefull">${esc(s.note)}</div>` : ''}`}
      ${notes && it.raw ? row('raw', '原始笔记', it.line ? `第 ${it.line} 行` : '查看') + (ui.dOpen === 'raw' ? `<div class="d-rowin"><span class="d-raw">${esc(it.raw)}</span></div>` : '') : ''}

  </aside>
  ${nx ? `<button class="d-next d-nextfix" type="button" data-a="nextitem" data-id="${esc(nid)}"><span><small>下一条</small><b class="en">${esc(nx.en)}</b></span>${svg('chev')}</button>` : ''}`;
}

function detailClick(a, el) {
  const id = el.dataset.id;

   交互

function setSessionFb(input, revealed) {
  const r = cur();
  if (r.v === 'learn') {
    const ns = S.newSession;
    const id = ns.step === 'apply' ? ns.apply[ns.ai] : ns.queue[0];
    const it = ITEMS.get(id);
    ns.fb = { input, revealed };
    if (ns.step === 'write' && ns.first[id] === undefined) ns.first[id] = !revealed && diff(input, answerOf(it)).ok;
    save();
  } else if (r.v === 'review') {
    S.reviewSession.fb = { input, revealed }; save();
  } else if (r.v === 'practice') {
    ui.practice.fb = { input, revealed };
  }
  render();
}
function continueLearn() {
  const ns = S.newSession;
  if (ns.step === 'apply') {
    ns.ai++; ns.fb = null;
    if (ns.ai >= ns.apply.length) endRound();
  } else {
    const id = ns.queue[0], it = ITEMS.get(id), fb = ns.fb;
    const ok = fb && !fb.revealed && diff(fb.input, answerOf(it)).ok;
    ns.fb = null;
    if (ok) { markLearned(id, !!ns.first[id]); ns.queue.shift(); }
    else { ns.again[id] = true; ns.queue.push(ns.queue.shift()); }
    if (!ns.queue.length) {
      ns.apply = pickApply(ns.rounds[ns.round]); ns.ai = 0;
      if (ns.apply.length) ns.step = 'apply'; else endRound();
    }
  }
  if (S.newSession) save();
  render(true);
}
function endRound() {
  const ns = S.newSession;
  if (ns.round + 1 < ns.rounds.length) ns.step = 'rounddone';
  else finishNew();
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-a],[data-go],[data-nav]');
  if (!el || el.disabled) return;
  if (el.dataset.confirm && !el.classList.contains('armed')) {
    el.classList.add('armed');
    el.dataset.label = el.textContent;
    el.textContent = el.dataset.confirm;
    setTimeout(() => { if (el.isConnected) { el.classList.remove('armed'); el.textContent = el.dataset.label; } }, 3500);
    return;
  }
  if (el.dataset.nav) {
    const v = el.dataset.nav;
    if (v === 'today') { ui.todaySel = ui.todaySel || null; }
    goRoot({ v }); return;
  }
  if (el.dataset.go) { go(parseRoute(el.dataset.go)); return; }
  const a = el.dataset.a, id = el.dataset.id;
  if (a && a.startsWith('t3') && t3click(a, el)) return;
  if (a && a.startsWith('d') && detailClick(a, el)) return;
  switch (a) {
    case 'back': back(); break;
    case 'hidehint': S.user.hintClosed = true; save(); render(); break;
    case 'mode': {
      S.items[id] = S.items[id] || { hist: [], wrong: 0 };
      S.items[id].mode = el.dataset.m; save(); render();
      break;
    }
    case 'fav': { const s = st(id); s.fav = !s.fav; save(); render(); toast(s.fav ? '已收藏' : '已取消收藏'); break; }
    case 'mem': { st(id).mode = modeOf(id) === 'memory' ? 'reference' : 'memory'; save(); render(); break; }
    case 'cat': ui.todayCat = el.dataset.c; ui.todayOld = false; render(); break;
    case 'pick': ui.todaySel = id; ui.todayOpen.add(id); render(); break;
    case 'expand': ui.todayOpen.has(id) ? ui.todayOpen.delete(id) : ui.todayOpen.add(id); render(); break;
    case 'startnew': if (ui.todaySel) startNew(ui.todaySel); break;
    case 'resumenew': go({ v: 'learn' }); break;
    case 'dropnew': S.newSession = null; save(); render(); toast('已放弃本次新学进度，已完成的条目保留'); break;
    case 'beginwrite': { const ns = S.newSession; ns.step = 'write'; ns.queue = ns.rounds[ns.round].filter(x => !studied(x)); ns.fb = null; if (!ns.queue.length) endRound(); if (S.newSession) save(); render(true); break; }
    case 'nextround': { const ns = S.newSession; ns.round++; ns.step = 'intro'; ns.fb = null; save(); render(true); break; }
    case 'reveal': setSessionFb('', true); break;
    case 'cont': {
      const r = cur();
      if (r.v === 'learn') continueLearn();
      else if (r.v === 'practice') { const p = ui.practice; p.i++; p.fb = null; if (p.i >= p.ids.length) { ui.lastReview.practiced = true; back(); toast('错题练习完成'); } else render(true); }
      break;
    }
    case 'donenew': ui.lastNew = null; back(); break;
    case 'startreview': startReview(); break;
    case 'startreview-replace': ui.lastNew = null; startReview(null, true); break;
    case 'reviewgroup': startReview(id); break;
    case 'resumereview': go({ v: 'review' }); break;
    case 'rate': {
      const rs = S.reviewSession, iid = rs.ids[rs.i];
      applyRating(iid, el.dataset.r, ITEMS.get(iid).type);
      if (el.dataset.r !== 'rem' && rs.fb && rs.fb.input && !rs.fb.revealed) { const w = st(iid); (w.wrongs = w.wrongs || []).push({ t: Date.now(), input: rs.fb.input, r: el.dataset.r }); if (w.wrongs.length > 20) w.wrongs.shift(); }
      rs.ratings[iid] = el.dataset.r; rs.i++; rs.fb = null;
      if (rs.i >= rs.ids.length) finishReview(); else save();
      render(true);
      break;
    }
    case 'practice': {
      const r = ui.lastReview;
      ui.practice = { ids: r.ids.filter(x => r.ratings[x] !== 'rem' && ITEMS.has(x)), i: 0, fb: null };
      go({ v: 'practice' }); break;
    }
    case 'donereview': ui.lastReview = null; back(); break;
    case 'checkin': checkin(); render(); break;
    case 'checkin-back': checkin(); ui.lastNew = null; ui.lastReview = null; back(); break;
    case 'exit': back(); toast('已保存进度，可以从首页继续'); break;
    case 'quick-replace': ui.lastNew = null; replaceRoute({ v: 'quick', id }); break;
    case 'qrmode': ui.qrMode = el.dataset.m; ui.qrShown = new Set(); render(); break;
    case 'qr': if (el.classList.contains('masked')) { ui.qrShown.add(el.dataset.k); el.classList.remove('masked'); } break;
    case 'qrreset': ui.qrShown = new Set(); render(); break;
    case 'nextitem': replaceRoute({ v: 'item', id }); break;
    case 'nfilter': ui.notesFilter = el.dataset.f; render(); break;
    case 'calprev': case 'calnext': { let [y, m] = ui.calMonth; m += a === 'calprev' ? -1 : 1; if (m < 0) { m = 11; y--; } if (m > 11) { m = 0; y++; } ui.calMonth = [y, m]; render(); break; }
    case 'seg': {
      const seg = el.closest('[data-seg]');
      seg.dataset.value = el.dataset.v;
      seg.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b === el)));
      if (seg.dataset.seg === 'type') seg.closest('form').querySelectorAll('[data-for]').forEach(f => { f.hidden = !f.dataset.for.split(' ').includes(el.dataset.v); });
      break;
    }
    case 'sample': { const ta = $('#import-text'); ta.value = SAMPLE_NOTE; $('[data-form="import"] [name="title"]').value = dayKey() + ' 示例笔记'; break; }
    case 'ttype': {
      const it = S.notes.items.find(x => x.id === id);
      if (it && it.type !== el.dataset.t) {
        it.type = el.dataset.t;
        const gid = 'ng:' + uid();
        S.notes.groups.push({ id: gid, setId: it.setId, kind: it.type, name: it.en });
        it.gid = gid; pruneNoteGroups(); assemble(); save(); render();
      }
      break;
    }
    case 'tdel': S.notes.items = S.notes.items.filter(x => x.id !== id); delete S.items[id]; pruneNoteGroups(); assemble(); save(); render(); break;
    case 'tconfirm': {
      const set = noteSet(id); set.confirmed = true;
      S.notes.items.filter(x => x.setId === id).forEach(x => { if (!(S.items[x.id] && S.items[x.id].mode)) st(x.id).mode = defMode(x); });
      assemble(); save(); toast('已确认，记忆内容进入“等待学习”'); replaceRoute({ v: 'notes' });
      break;
    }
    case 'tdiscard': case 'delset': {
      const gone = new Set(S.notes.items.filter(x => x.setId === id).map(x => x.id));
      S.notes.items = S.notes.items.filter(x => x.setId !== id);
      S.notes.groups = S.notes.groups.filter(g => g.setId !== id);
      S.notes.sets = S.notes.sets.filter(s => s.id !== id);
      gone.forEach(x => delete S.items[x]);
      if (S.newSession && !GROUPS.has(S.newSession.gid)) S.newSession = null;
      assemble();
      if (S.newSession && !GROUPS.has(S.newSession.gid)) S.newSession = null;
      if (S.reviewSession && !GROUPS.has(S.reviewSession.gid)) S.reviewSession = null;
      save();
      toast(a === 'tdiscard' ? '已放弃这次导入' : '已删除笔记组');
      if (a === 'tdiscard') replaceRoute({ v: 'notes' }); else render();
      break;
    }
    case 'delitem': {
      const it = ITEMS.get(id);
      if (it.lib === 'notes') { S.notes.items = S.notes.items.filter(x => x.id !== id); pruneNoteGroups(); }
      else { S.custom.items = S.custom.items.filter(x => x.id !== id); const used = new Set(S.custom.items.map(x => x.gid)); S.custom.groups = S.custom.groups.filter(g => used.has(g.id)); }
      delete S.items[id];
      assemble();
      if (S.newSession) { S.newSession.ids = S.newSession.ids.filter(x => x !== id); if (!S.newSession.ids.length) S.newSession = null; }
      save(); toast('已删除'); back();
      break;
    }
  }
});

document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target;
  const kind = f.dataset.form;
  if (kind && kind.startsWith('t3')) { t3submit(kind, f); return; }
  if (kind === 'answer') {
    const inp = f.querySelector('.answer');
    if (inp.readOnly) return;
    setSessionFb(inp.value, false);
  } else if (kind === 'drill') {
    const it = ITEMS.get(f.dataset.id);
    const d = diff($('#drill-in').value, answerOf(it));
    $('#drill-fb').innerHTML = fbHTML(d, it, d.empty);
  } else if (kind === 'add') {
    const G = GROUPS.get(f.dataset.id);
    const v = n => (f.querySelector(`[name="${n}"]`) || { value: '' }).value.trim();
    const seg = n => { const s = f.querySelector(`[data-seg="${n}"]`); return s ? s.dataset.value : ''; };
    const en = v('en'), zh = v('zh');
    if (!en || !zh) { $('#form-msg').textContent = '请填写英文表达和中文含义。'; return; }
    if (/[㐀-鿿]/.test(en)) { $('#form-msg').textContent = '英文表达里不要包含中文。'; return; }
    const id = (G.lib === 'notes' ? 'n:' : 'c:') + uid();
    let type = G.lib === 'function' ? 'fn' : seg('type');
    let gid = G.id;
    const solo = seg('target') === 'solo' || (G.lib === 'notes' && type !== G.kind);
    if (G.lib === 'notes') {
      if (type === 'grammar' && !v('wrong')) { $('#form-msg').textContent = '语法卡需要填写原来的错误写法。'; return; }
      if (solo) { gid = 'ng:' + uid(); S.notes.groups.push({ id: gid, setId: G.setId, kind: type, name: en }); }
      const rec = { id, setId: G.setId, gid, type, raw: '', line: 0, defMode: seg('mode') };
      for (const [k] of NOTE_FORM) rec[k] = v(k);
      S.notes.items.push(rec);
    } else {
      if (solo) {
        gid = 'cg:' + uid();
        S.custom.groups.push(G.lib === 'topic'
          ? { id: gid, lib: 'topic', topic: G.topic, sub: G.sub, name: en, scene: zh, independent: true, parent: G.id }
          : { id: gid, lib: 'function', fn: G.fn, name: en, scene: G.scene, independent: true, parent: G.id });
      }
      S.custom.items.push({ id, lib: G.lib, type, gid, en, zh, ex: v('ex'), col: '', usage: '', err: '', syntax: v('syntax'), tone: v('tone'), diff: v('diff'), defMode: seg('mode') });
    }
    st(id).mode = seg('mode');
    assemble(); save(); back(); toast(solo ? '已作为独立项保存' : '已加入「' + G.name + '」');
  } else if (kind === 'edit') {
    const it = S.notes.items.find(x => x.id === f.dataset.id);
    const v = n => f.querySelector(`[name="${n}"]`).value.trim();
    const type = f.querySelector('[data-seg="type"]').dataset.value;
    if (!v('en')) { $('#form-msg').textContent = '英文表达不能为空。'; return; }
    if (type === 'grammar' && !v('wrong')) { $('#form-msg').textContent = '语法卡需要填写原来的错误写法。'; return; }
    for (const [k] of NOTE_FORM) it[k] = v(k);
    if (type !== it.type) {
      it.type = type;
      const gid = 'ng:' + uid();
      S.notes.groups.push({ id: gid, setId: it.setId, kind: type, name: it.en });
      it.gid = gid; pruneNoteGroups();
    }
    assemble(); save(); back(); toast('已保存修改');
  } else if (kind === 'import') {
    const text = f.querySelector('[name="text"]').value;
    const title = f.querySelector('[name="title"]').value.trim() || dayKey() + ' 写作笔记';
    if (!text.trim()) { $('#form-msg').textContent = '请先粘贴笔记内容或导入 Markdown 文件。'; return; }
    const setId = createNoteSet(text, title, { source: importSource || '粘贴的文字' });
    importSource = '';
    if (!setId) { $('#form-msg').textContent = '没有识别到英文表达。每行写一条，英文在前、中文在后。'; return; }
    assemble(); save(); replaceRoute({ v: 'triage', id: setId });
  }
});

let importSource = '';
document.addEventListener('change', e => {
  const t = e.target;
  if (t3change(t)) return;
  if (t.id === 'md-file' && t.files && t.files[0]) {
    const file = t.files[0];
    const reader = new FileReader();
    reader.onload = () => {
      $('#import-text').value = String(reader.result || '');
      const title = $('[data-form="import"] [name="title"]');
      title.value = file.name.replace(/\.(md|markdown|txt)$/i, '') || title.value;
      importSource = 'Markdown 文件 · ' + file.name;
      toast('已读取 ' + file.name);
    };
    reader.onerror = () => toast('文件读取失败，请改为粘贴文字');
    reader.readAsText(file);
  }
  if (t.dataset.tmove) {
    const it = S.notes.items.find(x => x.id === t.dataset.tmove);
    if (t.value === 'solo' || t.value === 'new') {
      const gid = 'ng:' + uid();
      S.notes.groups.push({ id: gid, setId: it.setId, kind: it.type, name: t.value === 'new' ? '新的语义组' : it.en });
      it.gid = gid;
      if (t.value === 'new') toast('已新建语义组，再把相近的卡片移进来');
    } else it.gid = t.value;
    pruneNoteGroups(); assemble(); save(); render();
  }
});

let noteTimer;
document.addEventListener('input', e => {
  const t = e.target;
  if (recInput(t)) return;
  if (t.id === 'q') {
    const q = t.value;
    if (!q.trim()) { if (cur().v === 'search') back(); return; }
    if (cur().v === 'search') { cur().id = q; render(); } else go({ v: 'search', id: q });
    t.focus();
    return;
  }
  if (t.dataset.note) {
    const id = t.dataset.note;
    clearTimeout(noteTimer);
    noteTimer = setTimeout(() => { st(id).note = t.value; save(); }, 300);
  }
  if (t.dataset.tf) {
    const it = S.notes.items.find(x => x.id === t.dataset.id);
    if (it) { it[t.dataset.tf] = t.value; save(); assemble(); }
  }
  if (t.dataset.gname) {
    const g = S.notes.groups.find(x => x.id === t.dataset.gname);
    if (g) { g.name = t.value; save(); assemble(); }
  }
});

document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || e.isComposing) return;
  const t = e.target;
  if (t.matches('textarea') || (t.matches('input') && !t.readOnly)) return;
  if (t.matches('button') && !t.hasAttribute('data-enter')) return;
  const b = $('#view [data-enter]');
  if (b) { e.preventDefault(); b.click(); }
});

/* ============================================================
   启动
   ============================================================ */
function fillSampleDetails() {
  const detail = new Map();
  for (const sec of parseNotes(SAMPLE_NOTE)) for (const c of sec.cards) detail.set(c.en.toLowerCase(), c);
  let changed = false;
  for (const it of S.notes.items) {
    const set = noteSet(it.setId);
    if (!set || !/示例/.test(set.source || '')) continue;
    const c = detail.get(it.en.toLowerCase());
    if (!c || !c.fields) continue;
    const f = Object.assign({}, c.fields);
    if (it.type === 'pattern' && f.usage && !f.scene) { f.scene = f.usage; delete f.usage; }
    for (const [k, v] of Object.entries(f)) if (!it[k]) { it[k] = v; changed = true; }
  }
  if (changed) save();
}
if (!S.seeded) {
  createNoteSet(SAMPLE_NOTE, '示例 · 2026-10-06 写作笔记', { confirmed: true, source: '示例笔记，可删除' });
  S.seeded = true;
  save();
}
fillSampleDetails();
assemble();
t3init();
t3assemble();
// 测试台（test.html）用：正式版不设 __TEST__，这里不会执行
if (window.__TEST__) window.__app = { S: () => S, items: () => ITEMS, assemble, createNoteSet, save, render, go, goRoot, cur, ui, T, AR, IR, TR, t3plan, t3StartRev, dayStart, addDays, dayKey, fmtMD, STAGE_LABEL, RL3, TIER_LABEL, tierOf, ctxAnswer: () => { try { const c = t3ctx(); return c ? c.ans : null; } catch (e) { return null; } } };
const startHash = (location.hash || '').slice(1);
if (VIEWS[startHash] && ['home', 'today', 'topics', 'funcs', 'notes', 'favs', 'records', 'library', 'tsettings'].includes(startHash)) stack = [{ v: startHash }];
render(true);
})();
</script>
