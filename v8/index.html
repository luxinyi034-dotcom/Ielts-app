<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="写作表达 v8">
<meta name="theme-color" content="#EEEAE2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>雅思写作表达</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;1,8..60,400&display=swap">
<style>
/* Layout: iPad 学习桌面 —— 左侧导航落在亚麻底色上，主内容是一张圆角纸面；颜色只负责分组、状态和行动。 */
:root {
  --canvas: #EEEAE2;
  --paper: #FCFBF7;
  --paper-2: #F7F4EE;
  --linen: #EBE6DC;
  --beige: #DFD4C6;
  --sage: #A5B09B;
  --sage-deep: #72806D;
  --sage-soft: #E5E9DF;
  --blush: #EAD8D0;
  --blush-soft: #F5ECE7;
  --ink: #5B665C;
  --warm: #706D67;
  --muted: #96918A;
  --line: #DEDBD3;
  --wrong: #B06A5B;
  --wrong-soft: #F4E2DC;
  --gap: #B08A4E;
  --gap-soft: #F3EAD9;
  --on-accent: #FCFBF7;
  --shadow: 0 1px 2px rgba(91, 102, 92, .05), 0 18px 40px -24px rgba(91, 102, 92, .28);
  --shadow-sm: 0 1px 2px rgba(91, 102, 92, .07);
  --f-en: "Source Serif 4", "Iowan Old Style", Georgia, serif;
  --f-title: "Noto Serif SC", "Songti SC", "STSong", serif;
  --f-ui: "Noto Sans SC", -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --r-xl: 28px;
  --r-lg: 22px;
  --r-md: 17px;
  --r-sm: 12px;
  color-scheme: light;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--canvas); color: var(--ink); font-family: var(--f-ui); font-size: 16px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; }
button:disabled { cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--sage-deep); outline-offset: 2px; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; font-weight: 600; }
p { margin: 0; }
.en { font-family: var(--f-en); letter-spacing: -.003em; }
.muted { color: var(--muted); }
.warm { color: var(--warm); }
.num { font-variant-numeric: tabular-nums; }
.hidden { display: none !important; }

/* ---------- shell ---------- */
.shell { display: grid; grid-template-columns: 252px minmax(0, 1fr); min-height: 100vh; min-height: 100dvh; }
.side { position: sticky; top: 0; height: 100vh; height: 100dvh; padding: 30px 18px 24px 22px; display: flex; flex-direction: column; gap: 26px; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 12px; padding-left: 6px; }
.brand-mark { width: 38px; height: 38px; border-radius: 12px; background: var(--sage-deep); display: grid; grid-template-columns: 1fr 1fr; gap: 3px; padding: 8px; flex: none; }
.brand-mark i { border-radius: 3px; background: var(--paper); opacity: .92; }
.brand-mark i:nth-child(2), .brand-mark i:nth-child(3) { opacity: .55; }
.brand b { display: block; font-family: var(--f-title); font-size: 18px; line-height: 1.2; }
.brand small { display: block; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.nav { display: flex; flex-direction: column; gap: 4px; }
.nav-label { font-size: 11px; letter-spacing: .14em; color: var(--muted); padding: 14px 12px 4px; }
.nav-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 14px; border: 0; background: transparent; color: var(--warm); font-size: 15px; text-align: left; min-height: 44px; transition: background .15s, color .15s; }
.nav-item svg { width: 21px; height: 21px; flex: none; }
.nav-item:hover { background: rgba(252, 251, 247, .55); color: var(--ink); }
.nav-item[aria-current="page"] { background: var(--paper); color: var(--sage-deep); font-weight: 500; box-shadow: var(--shadow-sm); }
.nav-item .count { margin-left: auto; font-size: 12px; min-width: 22px; padding: 0 7px; border-radius: 999px; background: var(--blush); color: var(--ink); text-align: center; }
.nav-item.sub { padding-left: 22px; }
.side-foot { margin-top: auto; padding: 14px; border-radius: var(--r-md); background: var(--paper-2); display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--warm); }
.side-foot b { color: var(--ink); font-size: 15px; }
.week-dots { display: flex; gap: 6px; }
.week-dots i { width: 18px; height: 18px; border-radius: 50%; background: var(--linen); display: grid; place-items: center; font-style: normal; font-size: 10px; color: var(--muted); }
.week-dots i.on { background: var(--sage); color: var(--on-accent); }
.week-dots i.today { box-shadow: 0 0 0 1.5px var(--sage-deep); }

.main { padding: 18px 20px 20px 0; min-width: 0; }
.sheet { background: var(--paper); border-radius: var(--r-xl); min-height: calc(100vh - 38px); min-height: calc(100dvh - 38px); box-shadow: var(--shadow); padding: 26px clamp(20px, 3.4vw, 44px) 56px; display: flex; flex-direction: column; gap: 26px; min-width: 0; }

/* ---------- top bar ---------- */
.topbar { display: flex; align-items: center; gap: 14px; min-height: 48px; flex-wrap: wrap; }
.topbar .titles { display: flex; flex-direction: column; min-width: 0; flex: 1 1 260px; }
.crumb { font-size: 13px; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; }
.crumb span + span::before { content: "/"; margin-right: 6px; color: var(--line); }
.page-title { font-family: var(--f-title); font-size: clamp(24px, 2.6vw, 30px); line-height: 1.3; color: var(--ink); }
.search { display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 16px; border: 1px solid var(--line); border-radius: 999px; background: var(--paper); width: min(300px, 100%); }
.search svg { width: 18px; height: 18px; color: var(--muted); flex: none; }
.search input { border: 0; background: transparent; outline: none; min-width: 0; flex: 1; font-size: 16px; }
.icon-btn { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--paper); display: inline-grid; place-items: center; color: var(--warm); flex: none; transition: transform .15s, border-color .15s, color .15s; }
.icon-btn svg { width: 20px; height: 20px; }
.icon-btn:hover { transform: translateY(-1px); color: var(--sage-deep); border-color: var(--sage); }
.icon-btn.on { color: var(--sage-deep); background: var(--sage-soft); border-color: var(--sage-soft); }
.icon-btn.on svg { fill: currentColor; }

/* ---------- buttons (胶囊：primary / outline / soft / ghost) ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 22px; border-radius: 999px; border: 1px solid transparent; font-size: 15px; font-weight: 500; white-space: nowrap; transition: transform .15s, background .15s, border-color .15s, opacity .15s; }
.btn svg { width: 18px; height: 18px; }
.btn:hover:not(:disabled) { transform: translateY(-1px); }
.btn:disabled { opacity: .45; }
.btn-primary { background: var(--sage-deep); color: var(--on-accent); }
.btn-primary:hover:not(:disabled) { background: #67755F; }
.btn-outline { background: var(--paper); border-color: var(--line); color: var(--ink); }
.btn-outline:hover:not(:disabled) { border-color: var(--sage); }
.btn-soft { background: var(--blush); color: var(--ink); }
.btn-soft:hover:not(:disabled) { background: #E3CEC4; }
.btn-ghost { background: transparent; color: var(--warm); padding: 0 12px; }
.btn-ghost:hover:not(:disabled) { color: var(--ink); }
.btn-sm { min-height: 36px; padding: 0 15px; font-size: 14px; }
.btn-danger { color: var(--wrong); }
.btn-danger.armed { background: var(--wrong); color: var(--on-accent); border-color: var(--wrong); }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* ---------- tags & segmented ---------- */
.tag { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 10px; border-radius: 999px; font-size: 12px; background: var(--linen); color: var(--warm); white-space: nowrap; }
.tag.core { background: var(--sage-soft); color: var(--sage-deep); }
.tag.know { background: var(--blush-soft); color: #8A6C60; }
.tag.term { background: var(--linen); color: var(--warm); }
.tag.fn { background: var(--sage-soft); color: var(--sage-deep); }
.tag.pattern { background: var(--blush-soft); color: #8A6C60; }
.tag.grammar { background: #ECE7F0; color: #6E6478; }
.tag.expr { background: var(--sage-soft); color: var(--sage-deep); }
.status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--warm); white-space: nowrap; }
.status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--c, var(--line)); }
.s-wait { --c: var(--beige); }
.s-learn { --c: var(--blush); }
.s-first { --c: var(--sage); }
.s-due { --c: var(--gap); }
.s-stable { --c: var(--sage-deep); }
.s-ref { --c: transparent; }
.s-ref::before { box-shadow: inset 0 0 0 1.5px var(--line); }
.s-triage { --c: var(--wrong); }

.seg { display: inline-flex; padding: 4px; gap: 4px; border: 1px solid var(--line); border-radius: 999px; background: var(--paper); flex-wrap: wrap; }
.seg button { border: 0; background: transparent; min-height: 36px; padding: 0 16px; border-radius: 999px; font-size: 14px; color: var(--warm); transition: background .15s, color .15s; }
.seg button[aria-pressed="true"] { background: var(--sage-deep); color: var(--on-accent); font-weight: 500; }
.seg.small button { min-height: 30px; padding: 0 12px; font-size: 13px; }
.mode { display: inline-flex; padding: 3px; gap: 2px; border-radius: 999px; background: var(--paper-2); border: 1px solid var(--line); flex: none; }
.mode button { border: 0; background: transparent; min-height: 30px; min-width: 48px; padding: 0 11px; border-radius: 999px; font-size: 13px; color: var(--muted); }
.mode button[aria-pressed="true"] { background: var(--paper); color: var(--ink); box-shadow: var(--shadow-sm); font-weight: 500; }
.mode button[data-m="memory"][aria-pressed="true"] { background: var(--sage-deep); color: var(--on-accent); }

.check { width: 26px; height: 26px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--paper); display: inline-grid; place-items: center; flex: none; color: transparent; transition: background .15s, border-color .15s; padding: 0; }
.check svg { width: 15px; height: 15px; }
.check[aria-checked="true"] { background: var(--sage); border-color: var(--sage); color: var(--on-accent); }
.radio { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--paper); flex: none; display: grid; place-items: center; }
.radio[aria-checked="true"] { border-color: var(--sage-deep); }
.radio[aria-checked="true"]::after { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--sage-deep); }

/* ---------- surfaces ---------- */
.grid { display: grid; gap: 16px; grid-template-columns: repeat(12, minmax(0, 1fr)); }
.span-12 { grid-column: span 12; } .span-8 { grid-column: span 8; } .span-7 { grid-column: span 7; } .span-6 { grid-column: span 6; } .span-5 { grid-column: span 5; } .span-4 { grid-column: span 4; }
.panel { border-radius: var(--r-lg); background: var(--paper-2); padding: 22px 24px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.panel.sage { background: var(--sage-soft); }
.panel.sage-strong { background: var(--sage); color: var(--on-accent); }
.panel.blush { background: var(--blush); }
.panel.blush-soft { background: var(--blush-soft); }
.panel.linen { background: var(--linen); }
.panel.line { background: var(--paper); border: 1px solid var(--line); }
.panel-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.eyebrow { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--warm); font-weight: 500; }
.eyebrow small { display: block; letter-spacing: .06em; font-weight: 400; color: var(--muted); text-transform: none; font-size: 12px; }
.big-num { font-family: var(--f-en); font-size: 54px; line-height: 1; font-variant-numeric: tabular-nums; color: var(--ink); }
.big-num small { font-family: var(--f-ui); font-size: 15px; color: var(--warm); margin-left: 6px; }
.section { display: flex; flex-direction: column; gap: 12px; }
.section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.section-head h3 { font-size: 17px; font-family: var(--f-title); }
.section-head .hint { font-size: 13px; color: var(--muted); }
.note-line { font-size: 13px; color: var(--muted); }
.divider { height: 1px; background: var(--line); border: 0; margin: 0; }

/* ---------- list rows ---------- */
.rows { display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; align-items: center; gap: 14px; padding: 14px 18px; border-radius: var(--r-md); background: var(--paper-2); min-width: 0; }
.row.white { background: var(--paper); border: 1px solid var(--line); }
.row.tap { border: 0; width: 100%; text-align: left; transition: background .15s, transform .15s; }
.row.tap:hover { background: var(--linen); }
.row .body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.row .body.tap { border: 0; background: transparent; padding: 0; text-align: left; }
.row .title { font-size: 16px; font-weight: 500; overflow-wrap: anywhere; }
.row .en.title { font-size: 18px; font-weight: 500; line-height: 1.35; }
.row .sub { font-size: 14px; color: var(--warm); overflow-wrap: anywhere; }
.row .meta { font-size: 13px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row .side-ctl { display: flex; align-items: center; gap: 10px; flex: none; }
.row .chev { width: 18px; height: 18px; color: var(--muted); flex: none; }
.bar-left { position: relative; padding-left: 22px; }
.bar-left::before { content: ""; position: absolute; left: 10px; top: 16px; bottom: 16px; width: 3px; border-radius: 3px; background: var(--c, var(--sage)); }

.empty { padding: 30px 24px; border-radius: var(--r-lg); border: 1.5px dashed var(--line); color: var(--warm); display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
.empty h3 { font-family: var(--f-title); font-size: 18px; color: var(--ink); }

/* ---------- cards: topics / functions ---------- */
.tiles { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
.tile { border: 0; text-align: left; border-radius: var(--r-lg); padding: 20px 22px; background: var(--paper-2); display: flex; flex-direction: column; gap: 10px; min-height: 150px; transition: transform .15s, background .15s; }
.tile:hover { transform: translateY(-1px); background: var(--linen); }
.tile h3 { font-family: var(--f-title); font-size: 21px; }
.tile .sub { font-size: 14px; color: var(--warm); }
.tile .meta { margin-top: auto; font-size: 13px; color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap; }
.tile.c1 { background: var(--sage-soft); } .tile.c2 { background: var(--blush-soft); } .tile.c3 { background: var(--linen); }
.tile.c1:hover { background: #DCE2D4; } .tile.c2:hover { background: #F0E2DB; }

/* ---------- group detail ---------- */
.group-hero { display: flex; flex-direction: column; gap: 14px; padding: 24px 26px; border-radius: var(--r-lg); background: var(--sage-soft); }
.group-hero.fn { background: var(--blush-soft); }
.group-hero.notes { background: var(--linen); }
.group-hero p { color: var(--warm); max-width: 62ch; }
.stats-line { display: flex; gap: 22px; flex-wrap: wrap; font-size: 14px; color: var(--warm); }
.stats-line b { font-family: var(--f-en); font-size: 22px; color: var(--ink); font-weight: 500; margin-right: 4px; font-variant-numeric: tabular-nums; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; min-height: 34px; padding: 0 14px; border-radius: 999px; background: var(--paper); border: 1px solid var(--line); font-size: 14px; color: var(--warm); }
button.chip:hover { border-color: var(--sage); color: var(--ink); }
.paragraph { font-family: var(--f-en); font-size: 19px; line-height: 1.75; color: var(--ink); max-width: 70ch; padding: 22px 26px; border-radius: var(--r-lg); background: var(--paper-2); }
.paragraph mark { background: var(--sage-soft); color: inherit; padding: 1px 3px; border-radius: 5px; }
.paragraph mark.core { background: var(--blush); }

.cmp-wrap { overflow-x: auto; border-radius: var(--r-lg); border: 1px solid var(--line); }
.cmp { width: 100%; border-collapse: collapse; min-width: 720px; font-size: 14px; }
.cmp th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12px; letter-spacing: .08em; padding: 12px 16px; background: var(--paper-2); border-bottom: 1px solid var(--line); }
.cmp td { padding: 14px 16px; border-bottom: 1px solid var(--line); vertical-align: top; color: var(--warm); }
.cmp tr:last-child td { border-bottom: 0; }
.cmp td.expr { color: var(--ink); }
.cmp td.expr button { border: 0; background: none; padding: 0; text-align: left; font-family: var(--f-en); font-size: 17px; color: var(--ink); }
.cmp td.expr button:hover { color: var(--sage-deep); text-decoration: underline; text-underline-offset: 3px; }

/* ---------- item detail ---------- */
.detail { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 22px; align-items: start; }
.detail-main { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.detail-side { display: flex; flex-direction: column; gap: 14px; position: sticky; top: 18px; }
.expr-hero { padding: 26px 28px; border-radius: var(--r-lg); background: var(--paper-2); display: flex; flex-direction: column; gap: 12px; }
.expr-hero .en { font-size: clamp(26px, 3vw, 36px); line-height: 1.25; color: var(--ink); overflow-wrap: anywhere; }
.expr-hero .zh { font-size: 19px; color: var(--warm); }
.field-block { display: flex; flex-direction: column; gap: 6px; padding: 16px 20px; border-radius: var(--r-md); background: var(--paper); border: 1px solid var(--line); }
.field-block .label { font-size: 12px; letter-spacing: .1em; color: var(--muted); }
.field-block .val { font-size: 15px; overflow-wrap: anywhere; }
.field-block .val.en { font-size: 18px; }
.field-block.raw .val { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 14px; color: var(--warm); white-space: pre-wrap; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pair .wrongline { background: var(--wrong-soft); border-color: transparent; }
.pair .rightline { background: var(--sage-soft); border-color: transparent; }
textarea.note { width: 100%; min-height: 90px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--paper); padding: 10px 12px; resize: vertical; font-size: 15px; }
.kv { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; color: var(--warm); padding: 6px 0; border-bottom: 1px solid var(--line); }
.kv:last-child { border-bottom: 0; }
.kv b { color: var(--ink); font-weight: 500; }

/* ---------- forms ---------- */
.form { display: flex; flex-direction: column; gap: 14px; }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.fld { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--warm); min-width: 0; }
.fld.wide { grid-column: 1 / -1; }
.fld input, .fld textarea, .fld select { border: 1px solid var(--line); background: var(--paper); border-radius: var(--r-sm); padding: 11px 14px; font-size: 16px; color: var(--ink); min-width: 0; width: 100%; }
.fld textarea { min-height: 220px; resize: vertical; line-height: 1.6; }
.fld input:focus, .fld textarea:focus, .fld select:focus { outline: none; border-color: var(--sage); box-shadow: 0 0 0 3px var(--sage-soft); }
.form-msg { font-size: 14px; color: var(--wrong); }
.privacy { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; color: var(--warm); background: var(--paper-2); border-radius: var(--r-sm); padding: 12px 14px; }
.privacy svg { width: 18px; height: 18px; flex: none; margin-top: 2px; color: var(--sage-deep); }
.file-btn { position: relative; overflow: hidden; }
.file-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

/* ---------- today: new study chooser ---------- */
.chooser { display: flex; flex-direction: column; gap: 8px; }
.cgroup { border-radius: var(--r-md); background: var(--paper-2); border: 1.5px solid transparent; transition: border-color .15s, background .15s; }
.cgroup.selected { border-color: var(--sage); background: var(--paper); }
.cgroup.disabled { opacity: .62; }
.cgroup-head { display: flex; align-items: center; gap: 6px; padding: 6px 8px 6px 6px; }
.cgroup-pick { flex: 1; min-width: 0; display: flex; align-items: center; gap: 14px; border: 0; background: transparent; text-align: left; padding: 10px 12px; border-radius: 14px; min-height: 56px; }
.cgroup-pick:disabled { cursor: default; }
.cgroup-pick .body { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.cgroup-pick .title { font-weight: 500; font-size: 16px; }
.cgroup-pick .meta { font-size: 13px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; }
.expand { width: 44px; height: 44px; border-radius: 50%; border: 0; background: transparent; color: var(--warm); display: grid; place-items: center; flex: none; }
.expand:hover { background: var(--linen); }
.expand svg { width: 20px; height: 20px; transition: transform .2s; }
.expand[aria-expanded="true"] svg { transform: rotate(180deg); }
.cgroup-items { padding: 0 18px 14px 56px; display: flex; flex-direction: column; }
.citem { display: flex; align-items: center; gap: 14px; padding: 10px 0; border-top: 1px solid var(--line); }
.citem .body { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.citem .en { font-size: 16px; overflow-wrap: anywhere; }
.citem .zh { font-size: 13px; color: var(--warm); }
.sticky-bar { position: sticky; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); z-index: 5; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; justify-content: space-between; padding: 12px 12px 12px 22px; border-radius: 999px; background: var(--paper); border: 1px solid var(--line); box-shadow: var(--shadow); }
.sticky-bar .summary { font-size: 14px; color: var(--warm); min-width: 0; }
.sticky-bar .summary b { color: var(--ink); font-weight: 600; }

/* ---------- plan list ---------- */
.plan-row { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 14px 18px; border-radius: var(--r-md); background: var(--paper); }
.plan-row .ord { width: 30px; height: 30px; border-radius: 50%; background: var(--blush); display: grid; place-items: center; font-size: 13px; font-variant-numeric: tabular-nums; }
.plan-row.next .ord { background: var(--sage-deep); color: var(--on-accent); }
.plan-row .count { font-family: var(--f-en); font-size: 24px; font-variant-numeric: tabular-nums; }
.plan-row .count small { font-family: var(--f-ui); font-size: 12px; color: var(--muted); margin-left: 3px; }

/* ---------- session (新学 / 复习) ---------- */
.session { display: flex; flex-direction: column; gap: 20px; max-width: 880px; width: 100%; margin: 0 auto; }
.session-head { display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap; }
.steps { display: flex; gap: 6px; flex-wrap: wrap; }
.step { display: inline-flex; align-items: center; gap: 8px; min-height: 34px; padding: 0 14px 0 6px; border-radius: 999px; font-size: 13px; color: var(--muted); background: var(--paper-2); }
.step i { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-size: 12px; background: var(--linen); color: var(--warm); }
.step.on { color: var(--ink); background: var(--sage-soft); }
.step.on i { background: var(--sage-deep); color: var(--on-accent); }
.step.done i { background: var(--sage); color: var(--on-accent); }
.progress { display: flex; align-items: center; gap: 14px; font-size: 13px; color: var(--warm); font-variant-numeric: tabular-nums; }
.pbar { flex: 1; height: 6px; border-radius: 6px; background: var(--linen); overflow: hidden; }
.pbar i { display: block; height: 100%; background: var(--sage); border-radius: 6px; transition: width .35s ease; }
.qcard { border-radius: var(--r-lg); background: var(--paper-2); padding: 28px clamp(20px, 3vw, 36px); display: flex; flex-direction: column; gap: 18px; }
.qtype { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--warm); }
.prompt-zh { font-family: var(--f-title); font-size: clamp(22px, 2.6vw, 28px); line-height: 1.5; color: var(--ink); }
.prompt-hint { font-size: 15px; color: var(--warm); display: flex; flex-direction: column; gap: 4px; }
.prompt-hint .en { font-size: 18px; color: var(--ink); line-height: 1.6; }
.blank { display: inline-block; min-width: 120px; border-bottom: 2px solid var(--sage); margin: 0 4px; height: 1.2em; vertical-align: -0.15em; }
.answer { width: 100%; border: 1.5px solid var(--line); background: var(--paper); border-radius: var(--r-md); padding: 14px 18px; font-family: var(--f-en); font-size: 21px; color: var(--ink); }
.answer:focus { outline: none; border-color: var(--sage); box-shadow: 0 0 0 4px var(--sage-soft); }
.answer[readonly] { background: var(--paper-2); }
.fb { display: flex; flex-direction: column; gap: 10px; padding: 18px 20px; border-radius: var(--r-md); background: var(--paper); border: 1px solid var(--line); }
.fb.ok { border-color: var(--sage); }
.fb .verdict { font-size: 14px; font-weight: 500; }
.fb.ok .verdict { color: var(--sage-deep); }
.fb.bad .verdict { color: var(--wrong); }
.fb .line { font-family: var(--f-en); font-size: 19px; line-height: 1.9; overflow-wrap: anywhere; }
.fb .line .lbl { font-family: var(--f-ui); font-size: 12px; color: var(--muted); margin-right: 10px; letter-spacing: .06em; }
.tk-wrong { color: var(--wrong); background: var(--wrong-soft); border-radius: 4px; padding: 0 3px; text-decoration: line-through; text-decoration-thickness: 1.5px; }
.tk-extra { color: var(--wrong); border-radius: 4px; padding: 0 3px; text-decoration: line-through; text-decoration-style: wavy; text-decoration-thickness: 1px; }
.tk-miss { display: inline-block; color: var(--gap); background: var(--gap-soft); border-radius: 4px; padding: 0 5px; font-family: var(--f-ui); font-size: 13px; font-weight: 600; vertical-align: 2px; }
.tk-need { background: var(--sage-soft); color: var(--sage-deep); border-radius: 4px; padding: 0 3px; }
.rates { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.rate { border: 1.5px solid var(--line); background: var(--paper); border-radius: var(--r-md); padding: 12px 10px; display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 72px; transition: transform .15s, border-color .15s; }
.rate:hover { transform: translateY(-1px); border-color: var(--c); }
.rate b { font-size: 16px; color: var(--c); font-weight: 600; }
.rate span { font-size: 12px; color: var(--muted); }
.rate.suggest { border-color: var(--c); background: var(--paper-2); }
.rate.r-rem { --c: var(--sage-deep); } .rate.r-vag { --c: var(--gap); } .rate.r-fgt { --c: var(--wrong); }
.intro-list { display: flex; flex-direction: column; gap: 8px; }
.intro-item { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 4px 16px; padding: 14px 18px; border-radius: var(--r-md); background: var(--paper); align-items: baseline; }
.intro-item .en { font-size: 18px; overflow-wrap: anywhere; }
.intro-item .zh { grid-column: 2; font-size: 14px; color: var(--warm); }
.intro-item .ex { grid-column: 2; font-size: 14px; color: var(--muted); font-family: var(--f-en); font-style: italic; }
.result-tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.result-tiles .panel { align-items: flex-start; }

/* ---------- quick review ---------- */
.qr-row { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 18px; padding: 16px 20px; border-radius: var(--r-md); background: var(--paper-2); align-items: center; }
.qr-cell { min-width: 0; border: 0; background: transparent; text-align: left; padding: 0; border-radius: 10px; overflow-wrap: anywhere; }
.qr-cell.en { font-size: 18px; color: var(--ink); }
.qr-cell.zh { font-size: 15px; color: var(--warm); }
.qr-cell.masked { background: var(--linen); color: transparent; min-height: 28px; position: relative; }
.qr-cell.masked::after { content: "点按显示"; position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--f-ui); font-size: 12px; color: var(--muted); }

/* ---------- calendar ---------- */
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; text-align: center; }
.cal .dow { font-size: 12px; color: var(--warm); font-weight: 500; padding-bottom: 4px; }
.cal .d { aspect-ratio: 1; max-width: 100%; display: grid; place-items: center; border-radius: 50%; font-size: 15px; font-variant-numeric: tabular-nums; color: var(--ink); position: relative; }
.cal .d.out { color: transparent; }
.cal .d.act::after { content: ""; position: absolute; bottom: 12%; width: 5px; height: 5px; border-radius: 50%; background: var(--sage-deep); opacity: .6; }
.cal .d.on { background: var(--sage-deep); color: var(--on-accent); }
.cal .d.on::after { display: none; }
.cal .d.today { box-shadow: inset 0 0 0 2px var(--ink); }
.forecast { display: flex; flex-direction: column; gap: 6px; }
.fc-row { display: grid; grid-template-columns: 54px minmax(0, 1fr) 36px; gap: 10px; align-items: center; font-size: 13px; color: var(--warm); font-variant-numeric: tabular-nums; }
.fc-row .track { height: 10px; border-radius: 6px; background: var(--linen); overflow: hidden; }
.fc-row .track i { display: block; height: 100%; border-radius: 6px; background: var(--sage); }
.fc-row b { text-align: right; color: var(--ink); font-weight: 500; }

/* ---------- triage ---------- */
.tcard { display: flex; flex-direction: column; gap: 10px; padding: 16px 18px; border-radius: var(--r-md); background: var(--paper); border: 1px solid var(--line); }
.tcard-top { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: space-between; }
.tcard .fields { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 10px; }
.tcard input, .tcard select { border: 1px solid var(--line); background: var(--paper-2); border-radius: 10px; padding: 9px 12px; font-size: 16px; min-width: 0; width: 100%; }
.tcard input.en { font-family: var(--f-en); }
.tcard .raw { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.tgroup { display: flex; flex-direction: column; gap: 10px; padding: 18px; border-radius: var(--r-lg); background: var(--paper-2); }
.tgroup-head { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.tgroup-head input { flex: 1 1 220px; border: 0; border-bottom: 1px dashed var(--line); background: transparent; font-family: var(--f-title); font-size: 18px; padding: 4px 2px; min-width: 0; color: var(--ink); }

/* ---------- toast ---------- */
.toast { position: fixed; left: 50%; bottom: calc(26px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 16px); background: var(--ink); color: var(--paper); padding: 11px 22px; border-radius: 999px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 50; max-width: calc(100% - 32px); text-align: center; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }

/* ---------- iPad 竖屏：图标导航栏 ---------- */
@media (max-width: 1080px) {
  .shell { grid-template-columns: 92px minmax(0, 1fr); }
  .side { padding: 22px 10px; gap: 18px; align-items: stretch; }
  .brand { justify-content: center; padding: 0; }
  .brand > div, .nav-label, .side-foot { display: none; }
  .nav-item, .nav-item.sub { flex-direction: column; gap: 3px; padding: 9px 4px; font-size: 11px; text-align: center; min-height: 58px; justify-content: center; }
  .nav-item .count { position: absolute; margin: 0; transform: translate(14px, -14px); font-size: 10px; min-width: 18px; padding: 0 5px; }
  .nav-item { position: relative; }
  .detail { grid-template-columns: minmax(0, 1fr); }
  .detail-side { position: static; }
  .span-7, .span-5, .span-8, .span-4 { grid-column: span 12; }
  .span-6 { grid-column: span 6; }
}

/* ---------- 手机：底部标签栏 ---------- */
@media (max-width: 720px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .side { position: fixed; top: auto; bottom: 0; left: 0; right: 0; height: auto; z-index: 20; flex-direction: row; padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px)); background: rgba(247, 244, 238, .96); border-top: 1px solid var(--line); overflow: visible; }
  .brand { display: none; }
  .nav { flex-direction: row; width: 100%; justify-content: space-around; }
  .nav .nav-item.lib-sub, .nav .nav-item.optional { display: none; }
  .nav-item, .nav-item.sub { flex: 1; min-height: 52px; }
  .main { padding: 0 0 calc(80px + env(safe-area-inset-bottom, 0px)); }
  .sheet { border-radius: 0; min-height: 100vh; box-shadow: none; padding: 18px 16px 40px; gap: 20px; }
  .span-6 { grid-column: span 12; }
  .form-grid, .pair, .tcard .fields { grid-template-columns: minmax(0, 1fr); }
  .qr-row { grid-template-columns: minmax(0, 1fr); gap: 6px; }
  .intro-item { grid-template-columns: minmax(0, 1fr); }
  .intro-item .zh, .intro-item .ex { grid-column: 1; }
  .rates, .result-tiles { gap: 6px; }
  .sticky-bar { border-radius: var(--r-lg); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
  .search { width: 100%; }
  .big-num { font-size: 44px; }
}

[hidden] { display: none !important; }
.tb-left { display: flex; align-items: center; gap: 14px; flex: 1 1 320px; min-width: 0; flex-wrap: wrap; }
.nav-item.phone-only { display: none; }
@media (max-width: 720px) {
  .nav-label { display: none; }
  .nav-item.phone-only { display: flex; }
}
#view { display: flex; flex-direction: column; gap: 26px; min-width: 0; }
.row > svg, .tile > svg { width: 18px; height: 18px; flex: none; color: var(--muted); }
.toast { top: calc(18px + env(safe-area-inset-top, 0px)); bottom: auto; transform: translate(-50%, -12px); }
.tcard-top .btn-row { flex-wrap: nowrap; }
@media (max-width: 720px) { .tcard-top .btn-row { flex-wrap: wrap; } }

/* ---------- v2 首页：三个分区，每个区一块底板（方案 D） ---------- */
.zone { display: flex; flex-direction: column; gap: 14px; padding: 18px; border-radius: 26px; }
.zone-learn { background: var(--sage-soft); }
.zone-lib { background: var(--paper-2); }
.zone-rec { border: 1px solid var(--line); }
.zone-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 0 8px; min-height: 36px; }
.zone-head h2 { font-family: var(--f-title); font-size: 19px; color: var(--ink); }
.zone-head .hint { font-size: 13px; color: var(--warm); }
.zone-card { background: var(--paper); box-shadow: var(--shadow-sm); padding: 22px 24px; gap: 10px; }
.pill { align-self: flex-start; font-size: 12px; font-weight: 500; padding: 2px 10px; border-radius: 999px; }
.pill-review { background: var(--blush); color: var(--ink); }
.pill-new { background: var(--sage-soft); color: var(--sage-deep); }
.due-row { background: var(--paper-2); padding: 9px 14px; border-radius: 12px; gap: 10px; font-size: 14px; }
.due-row .title { font-size: 14px; font-weight: 500; }
.zone-tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.zone-tile { display: flex; flex-direction: column; gap: 6px; padding: 20px 22px; border: 0; border-radius: 20px; background: var(--paper); box-shadow: var(--shadow-sm); text-align: left; min-width: 0; transition: transform .15s; }
.zone-tile:hover { transform: translateY(-1px); }
.zone-tile .name { font-family: var(--f-title); font-size: 20px; font-weight: 600; color: var(--ink); }
.zone-tile .sub { font-size: 14px; color: var(--warm); overflow-wrap: anywhere; }
.zone-tile .meta { font-size: 13px; color: var(--muted); }
.rec-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.rec-col { padding: 4px 8px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.rec-title { font-size: 14px; color: var(--warm); }
.rec-title b { color: var(--ink); }
.week-row { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; text-align: center; font-size: 12px; color: var(--muted); }
.week-row .day i { display: block; margin: 0 auto 4px; width: 30px; height: 30px; border-radius: 50%; background: var(--linen); }
.week-row .day.on i { background: var(--sage); }
.week-row .day.today i { box-shadow: 0 0 0 2px var(--sage-deep); }
@media (max-width: 720px) {
  .zone { padding: 14px; }
  .zone-tiles, .rec-grid { grid-template-columns: minmax(0, 1fr); gap: 10px; }
}

/* ---------- v3：高亮颜色统一；笔记详情更紧凑 ---------- */
mark { background: var(--sage-soft); color: inherit; padding: 0 3px; border-radius: 4px; }
.detail-main.tight { gap: 12px; }
.expr-hero.compact { padding: 20px 24px; gap: 8px; }
.expr-hero.compact .en { font-size: clamp(22px, 2.4vw, 28px); }
.expr-hero.compact .zh { font-size: 16px; }
.kv-block, .field-block.drill { gap: 10px; padding: 14px 18px; }
.kv-line { display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 12px; align-items: baseline; }
.kv-line .label { font-size: 12px; letter-spacing: .1em; color: var(--muted); }
.kv-line .val { font-size: 15px; overflow-wrap: anywhere; }
.kv-line .val.muted { font-size: 13px; color: var(--muted); }
.wrong-text { color: var(--wrong); text-decoration: line-through; text-decoration-thickness: 1px; font-size: 17px; }
#drill-fb .fb { padding: 12px 16px; }
@media (max-width: 720px) { .kv-line { grid-template-columns: minmax(0, 1fr); gap: 2px; } }

/* ---------- v4：笔记卡片按类型展示专属内容 ---------- */
.info-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.info-grid:empty { display: none; }
.info-grid .wide { grid-column: 1 / -1; }
.info-grid .field-block { padding: 14px 18px; gap: 4px; }
.info-grid .field-block .val.en { font-size: 17px; line-height: 1.55; }
.info-grid .pair { gap: 12px; }
.fill-hint { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 10px 12px 10px 18px; border: 1.5px dashed var(--line); border-radius: var(--r-md); font-size: 13px; color: var(--muted); }
@media (max-width: 720px) { .info-grid { grid-template-columns: minmax(0, 1fr); } }

/* ============================================================
   主题表达 v3（v5）：话题页、范文、新学、复习、详情页、设置
   ============================================================ */
.session.wide { max-width: 1120px; }
.masked { color: transparent !important; background: var(--linen) !important; border-radius: 6px; cursor: pointer; }
.masked * { visibility: hidden; }
.t-concepts { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; }
.t-chip { padding: 3px 12px; border-radius: 999px; background: var(--paper-2); color: var(--warm); font-size: 13px; }
.t-concepts-end { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.t-cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; align-items: start; }
.t-col { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.t-stance { border-radius: var(--r-md); padding: 14px 18px; display: flex; flex-direction: column; gap: 4px; }
.t-stance.s0 { background: var(--sage-soft); } .t-stance.s1 { background: var(--blush-soft); }
.t-stance .top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.t-stance b { font-family: var(--f-title); font-size: 19px; font-weight: 500; }
.t-stance span, .t-stance p { font-size: 13px; color: var(--warm); }
.t-arg { border-radius: var(--r-lg); background: var(--paper-2); padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; }
.t-arg-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.t-mode { font-size: 12px; padding: 1px 10px; border-radius: 999px; background: var(--linen); color: var(--warm); white-space: nowrap; }
.t-mode.on { background: var(--sage-deep); color: var(--on-accent); }
.t-arg-en { border: 0; background: transparent; padding: 0; text-align: left; display: flex; flex-direction: column; gap: 4px; }
.t-arg-en .en { font-size: 19px; font-weight: 600; line-height: 1.45; color: var(--ink); }
.t-arg-en .zh, .t-exp .zh { font-size: 13px; color: var(--warm); }
.t-exps { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.t-exp { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 10px; align-items: baseline; border: 0; border-bottom: 1px solid var(--line); background: transparent; padding: 9px 0; text-align: left; width: 100%; border-radius: 0; }
.t-exp:last-child { border-bottom: 0; }
.t-exp .role { font-size: 12px; color: var(--muted); }
.t-exp .txt { display: flex; flex-direction: column; min-width: 0; }
.t-exp .en { font-size: 17px; color: var(--ink); overflow-wrap: anywhere; }
.t-exp.hl, .t-box.hl, .t-termchip.hl { background: var(--gap-soft); }
.t-grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.t-grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.t-term { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--paper); padding: 10px 12px 10px 16px; }
.t-term .body { flex: 1; min-width: 0; border: 0; background: transparent; padding: 0; text-align: left; display: flex; flex-direction: column; }
.t-term .en, .t-card .en { font-size: 17px; color: var(--ink); }
.t-term .zh, .t-card .zh { font-size: 13px; color: var(--warm); }
.check[aria-checked="true"] { background: var(--sage-deep); border-color: var(--sage-deep); color: var(--on-accent); }
.t-line { display: flex; align-items: center; gap: 14px; width: 100%; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--paper); padding: 12px 18px; text-align: left; }
.t-line .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }

/* 评分 */

.t-rots { display: flex; gap: 6px; flex-wrap: wrap; }
.t-rot { font-size: 12px; padding: 3px 12px; border-radius: 999px; background: var(--paper-2); color: var(--muted); }
.t-rot.on { background: var(--sage-deep); color: var(--on-accent); }
.t-ratebar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.t-revtop { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.t-pill { font-size: 12px; padding: 3px 12px; border-radius: 999px; background: var(--sage-soft); color: var(--sage-deep); white-space: nowrap; }
.t-bigprompt { border-radius: var(--r-lg); background: var(--paper-2); padding: 18px 22px; display: flex; flex-direction: column; gap: 6px; }

.t-recall { width: 100%; min-height: 200px; border: 1.5px solid var(--line); border-radius: var(--r-md); background: var(--paper); padding: 14px 18px; font-family: var(--f-en); font-size: 19px; line-height: 1.9; color: var(--ink); resize: vertical; }
.t-recall:focus { outline: none; border-color: var(--sage); box-shadow: 0 0 0 4px var(--sage-soft); }
.t-cmpcol { display: flex; flex-direction: column; gap: 8px; min-width: 0; }

.t-mine { border: 1.5px solid var(--line); border-radius: var(--r-md); background: var(--paper-2); padding: 14px 18px; font-size: 17px; line-height: 2; }

.t-cmp.rem { background: var(--sage-soft); } .t-cmp.rem .lab { color: var(--sage-deep); }
.t-cmp.vag { background: var(--gap-soft); } .t-cmp.vag .lab { color: var(--gap); }
.t-cmp.fgt { background: var(--wrong-soft); } .t-cmp.fgt .lab { color: var(--wrong); }
.t-cmp.miss { border: 1.5px dashed var(--line); } .t-cmp.miss .lab { color: var(--wrong); }
.t-result { border-radius: var(--r-lg); background: var(--paper-2); padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }

.t-two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.t-nextbox { border-radius: var(--r-lg); border: 1px solid var(--line); padding: 14px 18px; display: flex; flex-direction: column; gap: 6px; }

.t-panel { border-radius: var(--r-lg); background: var(--paper-2); padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }

.t-donerow { display: grid; grid-template-columns: minmax(0, 1fr) 64px 170px 90px; gap: 12px; align-items: center; padding: 10px 14px; border-radius: 14px; background: var(--paper); font-size: 13px; }

.t-mkcard .en { font-family: var(--f-en); font-size: 16px; } .t-mkcard small { font-size: 12px; color: var(--warm); }

.t-planrow { display: grid; grid-template-columns: minmax(0, 1fr) 80px auto; gap: 12px; align-items: center; padding: 9px 14px; border-radius: 14px; background: var(--paper); font-size: 13px; }
.t-planrow .txt { display: flex; flex-direction: column; font-size: 15px; } .t-planrow .txt small { font-size: 12px; }

/* 详情页 */

.t-dmain { display: flex; flex-direction: column; gap: 16px; min-width: 0; }

.t-chain { display: grid; grid-template-columns: 56px minmax(0, 1fr) 18px; gap: 12px; align-items: center; padding: 9px 14px; border-radius: 14px; background: var(--paper); border: 0; text-align: left; width: 100%; }
button.t-chain:hover { background: var(--paper-2); }
.t-chain.cur { background: var(--sage-soft); }

.t-chain .lead { font-family: var(--f-en); font-style: italic; } .t-chain .cur-note { color: var(--sage-deep); }
.t-chain svg { width: 16px; height: 16px; color: var(--muted); }
.t-card2 { border-radius: var(--r-md); background: var(--paper-2); padding: 12px 16px; display: flex; flex-direction: column; gap: 4px; }

.t-pat { font-size: 19px !important; line-height: 1.9; } .t-pat2 { color: var(--warm); }
mark.slot { background: var(--sage-soft); color: var(--sage-deep); border-bottom: 2px solid var(--sage); border-radius: 6px; padding: 0 5px; }
.t-other { border: 0; border-radius: 14px; padding: 10px 14px; display: flex; flex-direction: column; text-align: left; background: var(--paper-2); }
.t-other.s1 { background: var(--blush-soft); }

.t-preview { color: var(--warm); line-height: 1.8; }
.t-link-btn { border: 0; background: transparent; padding: 0; color: var(--sage-deep); font-size: 13px; text-align: left; }
.t-parts { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }

.t-okbox, .t-badbox { border-radius: 14px; padding: 10px 14px; display: flex; flex-direction: column; gap: 2px; }
.t-okbox { background: var(--sage-soft); } .t-okbox small { color: var(--sage-deep); }
.t-badbox { background: var(--wrong-soft); } .t-badbox small { color: var(--wrong); } .t-badbox s { color: var(--warm); }

.t-dside { border: 1px solid var(--line); border-radius: var(--r-lg); padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; font-size: 14px; position: sticky; top: 18px; }
.t-dside .blk { display: flex; flex-direction: column; gap: 6px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }

.t-stage { font-family: var(--f-title); font-size: 17px; font-weight: 600; }

/* 设置 */

/* ============================================================
   学习记录（v7）：概览 · 词条清单 · 复习日程 · 薄弱项
   薄弱用浅红：底 #FAF0EC，线 #E3B8AD，字 #B57A6C
   ============================================================ */
:root { --wk-bg: #FAF0EC; --wk-line: #E3B8AD; --wk-txt: #B57A6C; --wk-tag: #F3DFD8; }
.r-page { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.icon-btn.sm { width: 32px; height: 32px; } .icon-btn.sm svg { width: 15px; height: 15px; }
.r-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.r-stat { border: 0; border-radius: 18px; background: var(--paper-2); padding: 14px 18px; display: flex; flex-direction: column; gap: 2px; text-align: left; font: inherit; color: inherit; min-width: 0; }
.r-stat span { font-size: 12px; color: var(--warm); }

button.r-stat { cursor: pointer; }
.r-grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; align-items: stretch; }
.r-card { border-radius: 20px; background: var(--paper-2); padding: 16px 20px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.r-card.line { background: var(--paper); border: 1px solid var(--line); }
.r-card-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.r-card-head b { font-size: 15px; }
.r-cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px 0; text-align: center; font-size: 12px; }
.r-cal .dow, .r-scal .dow { color: var(--muted); padding-bottom: 2px; font-size: 12px; text-align: center; }
.r-day { display: grid; place-items: center; }
.r-day i { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-style: normal; color: var(--muted); }
.r-day i.on { background: var(--sage-deep); color: var(--on-accent); }
.r-day i.act { background: var(--sage-soft); color: var(--sage-deep); }
.r-day i.today { box-shadow: inset 0 0 0 1.5px var(--sage-deep); color: var(--sage-deep); }
.r-day i.on.today { color: var(--on-accent); box-shadow: 0 0 0 2px var(--paper-2), 0 0 0 3.5px var(--sage-deep); }
.r-legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--warm); }
.r-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; }
.r-legend i.on { background: var(--sage-deep); } .r-legend i.act { background: var(--sage-soft); } .r-legend i.today { box-shadow: inset 0 0 0 1.5px var(--sage-deep); }
.r-bars { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; align-items: end; height: 200px; }
.r-bars > div { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px; height: 100%; }
.r-bars .v { font-size: 12px; font-weight: 600; }
.r-bars i { width: 100%; max-width: 30px; border-radius: 6px; background: var(--sage); }
.r-bars i.today { background: var(--sage-deep); }
.r-bars small { font-size: 11px; color: var(--muted); }
.r-dist { display: flex; flex-direction: column; gap: 12px; }
.r-dist > div { display: grid; grid-template-columns: 44px minmax(0, 1fr) 80px; gap: 12px; align-items: center; font-size: 13px; }
.r-dist .track { height: 8px; border-radius: 4px; background: var(--linen); display: flex; overflow: hidden; }
.r-dist .track i { background: var(--sage-deep); } .r-dist .track i.w { background: var(--wk-line); }

.r-recent { display: flex; flex-direction: column; }
.r-recent > div, .r-toprow { display: grid; grid-template-columns: 1fr auto; gap: 10px; font-size: 13px; padding: 7px 0; border-bottom: 1px solid var(--linen); }
.r-recent small { color: var(--sage-deep); }

/* 词条清单 */
.r-filters { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

.r-search { margin-left: auto; min-width: 200px; height: 36px; border: 1px solid var(--line); border-radius: 999px; padding: 0 14px; font-size: 14px; background: var(--paper); }
.r-meta { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--warm); }
.r-weakkey i { display: inline-block; width: 14px; height: 14px; border-radius: 4px; background: var(--wk-tag); box-shadow: inset 3px 0 0 var(--wk-line); vertical-align: -3px; margin-right: 4px; }
.r-weakkey { color: var(--wk-txt); font-weight: 500; }
.r-sort { margin-left: auto; display: inline-flex; gap: 4px; align-items: center; }
.r-sort button { border: 0; background: transparent; padding: 2px 8px; border-radius: 999px; font-size: 12px; color: var(--warm); }
.r-sort button.on { background: var(--sage-soft); color: var(--sage-deep); font-weight: 500; }
.r-table { display: flex; flex-direction: column; gap: 4px; }
.r-row { display: grid; grid-template-columns: minmax(0, 1fr) 84px 200px 90px; gap: 14px; align-items: center; padding: 9px 14px; border-radius: 12px; background: var(--paper-2); border: 0; text-align: left; width: 100%; font: inherit; color: inherit; }

.r-row.head { background: transparent !important; font-size: 11px; color: var(--muted); padding-top: 0; padding-bottom: 0; }
.r-row.weak { background: var(--wk-bg) !important; box-shadow: inset 3px 0 0 var(--wk-line); }
.r-row .txt { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.r-row .en { font-family: var(--f-en); font-size: 16px; line-height: 1.35; overflow-wrap: anywhere; }
.r-row small { font-size: 12px; color: var(--muted); }
.r-weak { display: inline-flex; gap: 6px; align-items: center; font-size: 11px; color: var(--wk-txt); margin-top: 2px; }
.r-weak em { font-style: normal; font-weight: 600; background: var(--wk-tag); padding: 0 8px; border-radius: 999px; }
.r-ladhead { display: flex; justify-content: space-between; width: 176px; }
.r-lad { display: inline-flex; align-items: center; }
.r-lad i { width: 10px; height: 10px; border-radius: 50%; background: var(--paper); box-shadow: inset 0 0 0 1.5px var(--line); flex: none; }

.r-lad.sm i { width: 8px; height: 8px; } .r-lad.sm i.cur { width: 12px; height: 12px; } .r-lad.sm b { width: 12px; }

/* 复习日程 */
.r-sched { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.r-scal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.r-sday { height: 54px; border-radius: 12px; border: 0; background: var(--paper); padding: 4px 6px; display: flex; flex-direction: column; justify-content: space-between; font: inherit; font-size: 12px; color: var(--ink); text-align: left; }
.r-sday b { font-size: 14px; text-align: right; }
.r-sday.past { color: #C9C4BC; }
.r-sday.dark { color: var(--on-accent); }

.r-dtitle { font-family: var(--f-title); font-size: 19px !important; }

.r-dayrow .en { font-family: var(--f-en); font-size: 15px; } .r-dayrow small { font-size: 12px; color: var(--muted); }
.r-kind { font-size: 11px; color: var(--warm); } .r-kind em { font-style: normal; color: var(--wk-txt); font-weight: 600; }
/* 薄弱项 */
.r-weakhead { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
.r-weakhead .wk { color: var(--wk-txt); font-size: 18px; }
.r-weaklist { display: flex; flex-direction: column; gap: 8px; }
.r-wcard { border-radius: 16px; background: var(--wk-bg); box-shadow: inset 3px 0 0 var(--wk-line); padding: 12px 16px 12px 20px; display: grid; grid-template-columns: minmax(0, 1fr) 230px; grid-template-areas: "txt wside" "mid wside" "wr wside"; gap: 4px 16px; align-items: start; }
.r-wcard .txt { grid-area: txt; } .r-wcard .txt .en { font-family: var(--f-en); font-size: 17px; } .r-wcard .txt small { font-size: 12px; color: var(--muted); }

.r-dots { display: inline-flex; gap: 4px; } .r-dots i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.r-dots i.rem { background: var(--sage-deep); } .r-dots i.vag { background: var(--gap); } .r-dots i.fgt { background: var(--wk-line); }
@media (max-width: 1080px) {
  .r-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .r-sched { grid-template-columns: minmax(0, 1fr); }
  .r-row { grid-template-columns: minmax(0, 1fr) 176px 80px; }

}
@media (max-width: 720px) {

/* ---------- v8 详情页：功能表达 · 写作笔记（AM–AP）· 练一遍（AR） ---------- */
.d-slot { display: inline-block; margin: 0 4px; padding: 0 10px; border: 1.5px dashed var(--sage); border-radius: 8px; font-family: var(--f-ui); font-size: 14px; color: var(--muted); vertical-align: middle; line-height: 1.7; }

.d-pracbtn { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 11px 16px; border: 0; border-radius: 14px; background: var(--sage-deep); color: var(--paper); text-align: left; }

/* ---------- v8 改版：词典式详情页（BA–BD）+ 右边一栏（AT） ---------- */
.d-detail { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 28px; align-items: start; }

.d-dl { display: grid; grid-template-columns: 80px minmax(0, 1fr); gap: 10px 14px; font-size: 15px; align-items: baseline; line-height: 1.6; }

const SAMPLE_NOTE = `# 强调深远影响
- have a profound impact on 对……产生深远影响
  - 例句：Social media has had a profound impact on the way young people communicate.
  - 搭配：have a profound / significant / lasting impact on sth
  - 场景：强调影响深远且持久，比 affect 更正式，适合主体段的结果句
  - 常见错误：impact 后用 on，不写 have a profound impact to
- exert a considerable influence on 对……施加相当大的影响（更正式）
  - 例句：Parents exert a considerable influence on their children's career choices.
  - 搭配：exert influence / pressure / control on sb
  - 场景：语气最正式，主语通常是人、机构或社会因素
  - 常见错误：influence 后用 on，不写 exert influence to
- play a pivotal role in 在……中起关键作用
  - 例句：Teachers play a pivotal role in shaping students' values.
  - 搭配：play a key / crucial / pivotal role in doing sth
  - 场景：强调“关键作用”而不是“影响”，in 后接名词或动名词
  - 常见错误：不写 play a pivotal role to do sth
- shape the way people think 塑造人们的思维方式
  - 例句：The internet has shaped the way people think about privacy.
  - 搭配：shape the way + 主语 + 动词
  - 场景：比 change 更具体，强调长期、逐渐的塑造
  - 常见错误：the way 后直接接句子，不写 the way how people think

# 表达原因的句型
- One reason for this is that ... 其中一个原因是……
  - 可替换：this 可换成具体现象；that 后接完整的原因句
  - 例句：One reason for this is that housing in big cities is expensive.
  - 场景：主体段列举多个原因时，引出其中一个
  - 常见错误：不写 One reason is because ...（reason 与 because 重复）
- This is largely due to the fact that ... 这在很大程度上是因为……
  - 可替换：largely 可换成 partly / mainly；that 后接完整句子
  - 例句：This is largely due to the fact that more people now work from home.
  - 场景：解释上一句现象的主要原因，语气正式
  - 常见错误：只接名词时用 due to + 名词，不加 the fact that

# 我的语法错误
- ❌ have a great influence to → ✅ have a great influence on 介词搭配：influence on
  - 规则：influence 作名词表示“对……的影响”时，介词用 on
  - 例句：Advertising has a great influence on what children want to buy.
  - 限制：influence 作动词时直接接宾语（influence sb），不加 on
- ❌ The number of cars are increasing. → ✅ The number of cars is increasing. 主语是 the number，谓语用单数
  - 规则：the number of + 复数名词作主语时，真正的主语是 number，谓语用单数
  - 例句：The number of international students has doubled since 2010.
  - 限制：a number of（许多）+ 复数名词，谓语用复数：A number of cars are parked outside.
- ❌ It can help people to know more knowledge. → ✅ It can help people gain more knowledge. know 不与 knowledge 搭配
  - 规则：knowledge 常与 gain / acquire / broaden 搭配
  - 例句：Travelling helps young people broaden their knowledge of other cultures.
  - 限制：learn 可接 skills / a language，一般不说 learn knowledge

# 零散积累
- a double-edged sword 一把双刃剑
  - 例句：Technology is a double-edged sword: it connects people but can also isolate them.
  - 搭配：prove to be / be a double-edged sword
  - 场景：开头段或让步段引出利弊讨论
  - 常见错误：同一篇文章里不要反复使用，避免显得套用模板

function noteSet(id) { return S.notes.sets.find(s => s.id === id); }

  const s = S.items[id];
  if (!s || s.stage == null) return S.newSession && S.newSession.ids.includes(id) ? '学习中' : '等待学习';
  if (s.next <= dayStart()) return '待复习';

const statusHTML = label => `<span class="status ${STATUS_CLS[label] || ''}">${label}</span>`;

function gstats(G) {

  for (const id of G.ids) {
    if (!active(id)) continue;
    r.total++;
    const m = modeOf(id);
    if (m === 'reference') { r.ref++; continue; }
    if (m === 'paused') { r.paused++; continue; }
    r.mem++;
    if (!studied(id)) { r.fresh++; continue; }
    r.studied++;
    const s = S.items[id];
    r.last = Math.max(r.last, s.last || 0);
    r.next = Math.min(r.next, s.next);
    const lab = itemStatus(id);
    if (lab === '待复习') r.due++;

  if (G.lib === 'notes') { const set = noteSet(G.setId); if (set && !set.confirmed) { r.status = '待整理'; return r; } }

  else if (r.fresh === r.mem) r.status = '等待学习';
  else if (r.fresh) r.status = '学习中';
  else if (r.stable === r.mem) r.status = '近期稳定';
  else if (r.first === r.mem) r.status = '初次完成';

  return r;
}

function bumpLog(field, n = 1) { const k = dayKey(); const l = S.log[k] || (S.log[k] = {}); l[field] = (l[field] || 0) + n; }

function dueQueue() {

/* ============================================================
   默写判定：在用户答案里标出错误 / 缺失 / 多余
   ============================================================ */
function tok(s) {
  return String(s || '').replace(/[’‘`]/g, "'").replace(/[“”]/g, '"').trim().split(/\s+/).filter(Boolean)
    .map(raw => ({ raw, n: raw.toLowerCase().replace(/[^a-z0-9'\-]/g, '').replace(/^['-]+|['-]+$/g, '') }));
}
function diff(user, correct) {
  const Ua = tok(user), Ca = tok(correct);
  const U = Ua.map((t, i) => Object.assign({ i }, t)).filter(t => t.n);
  const C = Ca.map((t, i) => Object.assign({ i }, t)).filter(t => t.n);
  const m = U.length, n = C.length;
  const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
  for (let i = m - 1; i >= 0; i--) for (let j = n - 1; j >= 0; j--) dp[i][j] = U[i].n === C[j].n ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const ops = [];
  let i = 0, j = 0;
  while (i < m || j < n) {
    if (i < m && j < n && U[i].n === C[j].n) { ops.push({ t: 'eq', u: U[i], c: C[j] }); i++; j++; }
    else if (j < n && (i === m || dp[i][j + 1] >= dp[i + 1][j])) { ops.push({ t: 'del', c: C[j] }); j++; }
    else { ops.push({ t: 'ins', u: U[i] }); i++; }
  }
  const uCls = new Array(Ua.length).fill(''), cCls = new Array(Ca.length).fill(''), miss = {};
  let k = 0, eq = 0;
  while (k < ops.length) {
    if (ops[k].t === 'eq') { eq++; k++; continue; }
    const ins = [], del = [];
    while (k < ops.length && ops[k].t !== 'eq') { (ops[k].t === 'ins' ? ins : del).push(ops[k]); k++; }
    del.forEach(o => { cCls[o.c.i] = 'tk-need'; });
    if (ins.length && del.length) {
      ins.forEach(o => { uCls[o.u.i] = 'tk-wrong'; });
      if (del.length > ins.length) { const p = ins[ins.length - 1].u.i + 1; miss[p] = (miss[p] || 0) + del.length - ins.length; }
    } else if (ins.length) {
      ins.forEach(o => { uCls[o.u.i] = 'tk-extra'; });
    } else {
      const p = k < ops.length ? ops[k].u.i : Ua.length;
      miss[p] = (miss[p] || 0) + del.length;
    }
  }
  const missTag = c => `<span class="tk-miss" title="这里缺少 ${c} 个词">缺${c > 1 ? c : ''}</span>`;
  let userHTML = '';
  for (let x = 0; x <= Ua.length; x++) {
    if (miss[x]) userHTML += missTag(miss[x]) + ' ';
    if (x < Ua.length) userHTML += (uCls[x] ? `<span class="${uCls[x]}">${esc(Ua[x].raw)}</span>` : esc(Ua[x].raw)) + ' ';
  }
  const correctHTML = Ca.map((t, x) => cCls[x] ? `<span class="${cCls[x]}">${esc(t.raw)}</span>` : esc(t.raw)).join(' ');
  return { ok: m > 0 && ops.every(o => o.t === 'eq'), empty: m === 0, score: n ? eq / n : 0, userHTML: userHTML.trim(), correctHTML };
}

/* ============================================================
   笔记解析：粘贴文字 / Markdown → 表达卡、句型卡、语法卡
   ============================================================ */
const CJK = /[㐀-鿿　-〿（：，；]/;
function stripTail(s) { return String(s).trim().replace(/[\s\-–—:：|=,，;；]+$/, '').trim(); }
function splitEnZh(s) {
  const i = s.search(CJK);
  if (i < 0) return { en: stripTail(s), zh: '' };
  return { en: stripTail(s.slice(0, i)), zh: s.slice(i).trim() };
}
const isPattern = en => /\.\.\.|…|_{2,}|\bsb\b|\bsth\b|\[[^\]]+\]/i.test(en);
/* 卡片专属字段：导入时写在一条下面的“标签：内容” */
const NOTE_FIELDS = [
  ['ex', /^(?:例句|例子|示例|示例句|正确例句|example)$/i],
  ['col', /^(?:搭配|常用搭配|collocations?)$/i],
  ['usage', /^(?:场景|使用场景|适用场景|用法|使用提醒|usage)$/i],
  ['err', /^(?:常见错误|易错|易错点|个人错误)$/],
  ['slots', /^(?:可替换|可替换位置|替换)$/],
  ['rule', /^(?:规则|语法规则|rule)$/i],
  ['limit', /^(?:限制|使用限制)$/],
];
function fieldLine(line) {
  const m = line.match(/^([^:：\s]{1,8})\s*[:：]\s*(.+)$/);
  if (!m) return null;
  const f = NOTE_FIELDS.find(([, re]) => re.test(m[1].trim()));
  return f ? { key: f[0], val: m[2].trim() } : null;
}
function parseNotes(text) {
  const lines = String(text || '').replace(/\r/g, '').split('\n');
  const secs = []; let cur = { heading: '', cards: [] }; secs.push(cur);
  const wrongMark = /^(?:❌|✗|✘|×|错误\s*[:：]|wrong\s*[:：])\s*/i;
  const arrow = /\s*(?:→|->|=>|⇒)\s*|\s*(?:✅|✓|✔|√|正确\s*[:：])\s*/;
  lines.forEach((rawLine, idx) => {
    let line = rawLine.trim();
    if (!line) return;
    const h = line.match(/^#{1,6}\s+(.+)$/);
    if (h) { cur = { heading: h[1].trim(), cards: [] }; secs.push(cur); return; }
    line = line.replace(/^>\s*/, '').replace(/^(?:[-*+•·]|\d+[.)、])\s+/, '').replace(/^\[[ xX]\]\s+/, '').trim();
    if (!line) return;
    const fl = fieldLine(line);
    const last = cur.cards[cur.cards.length - 1];
    if (fl && last) { last.fields = last.fields || {}; last.fields[fl.key] = last.fields[fl.key] ? last.fields[fl.key] + '；' + fl.val : fl.val; return; }
    let card = null;
    if (wrongMark.test(line)) {
      const parts = line.replace(wrongMark, '').split(arrow).filter(s => s && s.trim());
      if (parts.length >= 2) {
        const { en, zh } = splitEnZh(parts.slice(1).join(' '));
        if (en) card = { kind: 'grammar', wrong: stripTail(parts[0]), en, zh };
      }
    } else {
      const { en, zh } = splitEnZh(line);
      if (en && /[A-Za-z]/.test(en)) card = { kind: isPattern(en) ? 'pattern' : 'expr', en, zh };
    }
    if (card) { card.raw = rawLine.trim(); card.line = idx + 1; card.flag = /[!！]|常错|易错/.test(line); cur.cards.push(card); }
  });

}
function addNoteItem(c, setId, gid, grouped) {
  const def = c.kind === 'expr' ? (grouped || c.flag ? 'memory' : 'reference') : 'memory';
  const f = c.fields || {};
  // 句型卡的“场景”存为适用场景
  if (c.kind === 'pattern' && f.usage && !f.scene) { f.scene = f.usage; delete f.usage; }
  S.notes.items.push(Object.assign({ id: 'n:' + uid(), setId, gid, type: c.kind, en: c.en, zh: c.zh, wrong: c.wrong || '', usage: '', err: '', raw: c.raw, line: c.line, defMode: def }, f));
}
function createNoteSet(text, title, opts = {}) {
  const secs = parseNotes(text);
  const setId = 'ns:' + uid();
  let count = 0;
  for (const sec of secs) {
    for (const kind of ['expr', 'pattern', 'grammar']) {
      const cards = sec.cards.filter(c => c.kind === kind);
      if (!cards.length) continue;
      if (sec.heading && cards.length >= 2) {
        const gid = 'ng:' + uid();
        S.notes.groups.push({ id: gid, setId, kind, name: sec.heading });
        cards.forEach(c => addNoteItem(c, setId, gid, true));
      } else {
        cards.forEach(c => { const gid = 'ng:' + uid(); S.notes.groups.push({ id: gid, setId, kind, name: c.en }); addNoteItem(c, setId, gid, false); });
      }
      count += cards.length;
    }
  }
  if (!count) return null;
  S.notes.sets.push({ id: setId, title, created: Date.now(), confirmed: !!opts.confirmed, source: opts.source || '粘贴的文字' });
  return setId;
}
function pruneNoteGroups() {
  const used = new Set(S.notes.items.map(i => i.gid));
  S.notes.groups = S.notes.groups.filter(g => used.has(g.id));
}

  const ios = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const standalone = navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
  let framed = false;
  try { framed = window.top !== window.self; } catch (e) { framed = true; }
  if (!ios || standalone || framed || location.protocol !== 'https:') return '';
  return `<section class="panel line" style="flex-direction:row;align-items:center;gap:16px;flex-wrap:wrap">
    <div style="flex:1 1 320px;min-width:0"><div class="eyebrow">装到主屏幕，全屏使用</div>
    <p class="warm" style="margin-top:4px">点 Safari 地址栏右侧的分享按钮，选择“添加到主屏幕”。之后从主屏幕图标打开，就是全屏 App，断网也能用。</p></div>
    <button class="btn btn-outline btn-sm" type="button" data-a="hidehint">知道了</button></section>`;
}

    if (P.terms.length) lines.push(['话题词汇', '每个词单独安排', P.terms.length + ' 个', 'today']);

      nw = `<div class="note-line">${esc(groupCrumb(rec).join(' / '))}</div>
        <h3 style="font-family:var(--f-title);font-size:22px">${esc(rec.name)}</h3>

        <div class="btn-row"><button class="btn btn-outline" type="button" data-nav="today">选择表达组</button></div>`;

  const topicGroups = [...GROUPS.values()].filter(G => G.lib === 'topic');
  const topics = new Set(topicGroups.map(G => G.topic));
  const fnItems = [...ITEMS.values()].filter(i => i.lib === 'function').length;

  const fmax = Math.max(1, ...fc.map(x => x[1]));
  const latest = sets.slice().sort((a, b) => b.created - a.created)[0];
  const tile = (nav, name, sub, meta) => `<button class="zone-tile" type="button" data-nav="${nav}"><span class="name">${name}</span><span class="sub">${sub}</span><span class="meta">${meta}</span></button>`;

        </div>
      </section>
      <section class="zone zone-lib">
        <div class="zone-head"><h2>表达库</h2><span class="hint">查阅、收藏，把需要的内容加入记忆</span></div>
        <div class="zone-tiles">
          ${tile('topics', '主题表达', '话题 → 立场 → 论点 → 展开表达', `${T.topics.length} 个话题 · 另有 ${topicGroups.length} 个旧版表达组`)}
          ${tile('funcs', '功能表达', '比较语气、句法和使用边界', `${FUNCTION_GROUPS.length} 个写作功能 · ${fnItems} 条`)}
          ${tile('notes', '我的写作笔记', latest ? '最近：' + esc(latest.title) : '表达组 · 句型组 · 语法组', `${sets.length} 个笔记组 · ${noteCards} 张卡片${pending ? ` · ${pending} 个待整理` : ''}`)}
        </div>
      </section>
      <section class="zone zone-rec">
        <div class="zone-head"><h2>打卡与记录</h2><button class="btn btn-ghost btn-sm" type="button" data-nav="records">查看学习记录</button></div>
        <div class="rec-grid">
          <div class="rec-col"><div class="rec-title">本周打卡 · 连续 <b>${streak()}</b> 天</div><div class="week-row">${week}</div></div>
          <div class="rec-col"><div class="rec-title">接下来的复习</div>
            <div class="forecast">${fc.map(([t, v]) => `<div class="fc-row"><span>${diffDays(t) === 1 ? '明天' : '周' + WD[new Date(t).getDay()]}</span><div class="track"><i style="width:${v / fmax * 100}%"></i></div><b>${v}</b></div>`).join('')}</div></div>
        </div>
      </section>`,

}

/* ============================================================
   今日学习：复习计划 + 今日新学
   ============================================================ */
function groupsForCat(cat) {
  const all = [...GROUPS.values()];
  if (cat === 'topic') return all.filter(G => G.lib === 'topic');
  if (cat === 'function') return all.filter(G => G.lib === 'function');
  return all.filter(G => G.lib === 'notes' && (noteSet(G.setId) || {}).confirmed);
}
function vToday(r) {
  if (r.id && !r.applied) {
    const G = GROUPS.get(r.id);
    if (G) { ui.todayCat = G.lib; ui.todaySel = G.id; ui.todayOpen.add(G.id); ui.todayOld = G.lib === 'topic'; }
    r.applied = true;
  }
  const q = dueQueue(), dueN = q.reduce((a, g) => a + g.ids.length, 0) + t3plan().n;
  const review = t3PlanHTML();

  let newPart;
  if (S.newSession) {
    const ns = S.newSession, G = GROUPS.get(ns.gid), done = ns.ids.filter(studied).length;
    newPart = `<div class="row" style="background:var(--paper)"><div class="body"><span class="title">「${esc(G.name)}」新学进行中</span><span class="meta">已完成 ${done} / ${ns.ids.length} 条${ns.rounds.length > 1 ? ` · 第 ${ns.round + 1} / ${ns.rounds.length} 轮` : ''}</span></div>
      <div class="btn-row"><button class="btn btn-ghost btn-sm btn-danger" type="button" data-a="dropnew" data-confirm="确认放弃">放弃本次进度</button><button class="btn btn-primary" type="button" data-a="resumenew">继续本组新学</button></div></div>`;
  } else if (ui.todayCat === 'topic' && !ui.todayOld) {
    newPart = `<div class="seg" role="group" aria-label="内容分类">${[['topic', '主题表达'], ['function', '功能表达'], ['notes', '我的写作笔记']].map(([k, t]) => `<button type="button" data-a="cat" data-c="${k}" aria-pressed="${ui.todayCat === k}">${t}</button>`).join('')}</div>${t3TodayNew()}`;
  } else {
    const cats = [['topic', '主题表达'], ['function', '功能表达'], ['notes', '我的写作笔记']];
    const groups = groupsForCat(ui.todayCat);
    const list = groups.map(G => {
      const s = gstats(G), sel = ui.todaySel === G.id, open = ui.todayOpen.has(G.id);
      const ids = stableIds(G);
      const items = open ? `<div class="cgroup-items">${ids.map(id => {
        const it = ITEMS.get(id), m = modeOf(id);
        return `<div class="citem"><button class="check" type="button" role="checkbox" aria-checked="${m === 'memory'}" data-a="mem" data-id="${esc(id)}" aria-label="加入记忆：${esc(it.en)}">${svg('check', 2.6)}</button>
          <div class="body" role="button" data-go="item:${esc(id)}" style="cursor:pointer"><span class="en">${esc(it.en)}</span><span class="zh">${esc(it.zh)}</span></div>${typeTag(it.type)}${studied(id) || m !== 'memory' ? statusHTML(itemStatus(id)) : ''}</div>`;
      }).join('')}</div>` : '';
      return `<div class="cgroup ${sel ? 'selected' : ''}">
        <div class="cgroup-head">
          <button class="cgroup-pick" type="button" data-a="pick" data-id="${esc(G.id)}" role="radio" aria-checked="${sel}">
            <span class="radio" aria-checked="${sel}"></span>
            <span class="body"><span class="title">${esc(G.lib === 'notes' && G.ids.length < 2 ? (ITEMS.get(G.ids[0]) || {}).en : G.name)}</span>
            <span class="meta"><span>${esc(groupCrumb(G).join(' / '))}</span><span>${s.fresh ? `待新学 ${s.fresh}` : '无待新学内容'} · 资料 ${s.ref}</span>${statusHTML(s.status)}</span></span>
          </button>
          <button class="expand" type="button" data-a="expand" data-id="${esc(G.id)}" aria-expanded="${open}" aria-label="展开组内内容">${svg('down')}</button>
        </div>${items}</div>`;
    }).join('');
    const G = ui.todaySel && GROUPS.get(ui.todaySel);
    const valid = G && G.lib === (ui.todayCat === 'function' ? 'function' : ui.todayCat);
    const s = valid ? gstats(G) : null;
    const summary = valid
      ? `已选「${esc(G.name)}」：<b>${s.fresh}</b> 条记忆、<b>${s.ref}</b> 条资料（资料不进入任务）${s.fresh > 20 ? ` · 将分 ${Math.ceil(s.fresh / 20)} 轮在今天完成` : ''}${!s.fresh ? ' · 展开后勾选要记忆的内容' : ''}`
      : '选择一个表达组；展开可以逐条决定记忆或资料';
    newPart = `<div class="seg" role="group" aria-label="内容分类">${cats.map(([k, t]) => `<button type="button" data-a="cat" data-c="${k}" aria-pressed="${ui.todayCat === k}">${t}</button>`).join('')}</div>
      ${ui.todayCat === 'function' ? '<p class="note-line">功能表达默认作为资料。勾选后才会进入新学和复习。</p>' : ui.todayCat === 'topic' ? '<p class="note-line">旧版主题表达组（v4 内容）。新结构的话题点上面的“主题表达”。</p>' : ''}
      ${groups.length ? `<div class="chooser" role="radiogroup" aria-label="表达组">${list}</div>` : `<div class="empty"><h3>还没有可学习的写作笔记</h3><p>导入并确认整理后，笔记组会出现在这里。</p><button class="btn btn-soft" type="button" data-go="import">导入笔记</button></div>`}
      <div class="sticky-bar"><span class="summary">${summary}</span><button class="btn btn-primary" type="button" data-a="startnew" ${valid && s.fresh ? '' : 'disabled'}>开始今日新学</button></div>`;
  }

  return {
    title: '今日学习', crumb: [fmtMD(Date.now())],
    body: `<section class="panel blush-soft"><div class="section-head"><h3>今日复习</h3><span class="hint">${dueN ? `共 ${dueN} 条到期 · 按到期时间和错误记录排序` : '由系统按到期日期生成'}</span></div>${review}</section>
      <section class="section"><div class="section-head"><h3>今日新学</h3><span class="hint">${ui.todayCat === 'topic' ? '一次学一个话题里的 3 个论点，约 12 条记忆内容' : '每次学习一个完整的表达组，建议 15–20 条记忆内容'}</span></div>${newPart}</section>`,
  };
}

/* ============================================================
   新学流程：理解场景 → 主动写出 → 句子应用
   ============================================================ */
function startNew(gid) {
  const G = GROUPS.get(gid); if (!G) return;
  const ids = stableIds(G).filter(id => modeOf(id) === 'memory' && !studied(id));
  if (!ids.length) { toast('这个组没有待新学的记忆内容'); return; }
  S.newSession = { gid, ids, rounds: chunk(ids, 20), round: 0, step: 'intro', queue: [], first: {}, again: {}, apply: [], ai: 0, fb: null };
  save();
  go({ v: 'learn' });
}
function pickApply(ids) {
  return shuffle(ids.filter(id => { const it = ITEMS.get(id); return it && it.type !== 'core' && it.type !== 'grammar' && it.ex && it.ex.toLowerCase().includes(it.en.toLowerCase()); })).slice(0, 3);
}
function finishNew() {
  const ns = S.newSession;
  ui.lastNew = { gid: ns.gid, ids: ns.ids.slice(), firstOk: ns.ids.filter(id => ns.first[id]).length };
  S.newSession = null;
  save();
}
function answerOf(it) { return it.en; }

function promptHTML(it, ctx) {
  const G = GROUPS.get(it.gid) || {};
  const zh = `<div class="prompt-zh">${esc(it.zh)}</div>`;
  if (ctx === 'apply') {
    return `<div class="prompt-hint"><span>把表达放进句子：${esc(it.zh)}</span><span class="en">${blankIn(it.ex, it.en)}</span></div>`;
  }
  switch (it.type) {
    case 'core':
      return `${zh}<div class="prompt-hint"><span>写出完整的英文中心句 · 表达组：${esc(G.name || '')}</span></div>`;
    case 'know': {
      const b = it.ex && blankIn(it.ex, it.en);
      return `${zh}${b ? `<div class="prompt-hint"><span>补全句子中的短语</span><span class="en">${b}</span></div>` : ''}`;
    }
    case 'term': {
      const col = it.col && it.col.toLowerCase() !== it.en.toLowerCase() ? (blankIn(it.col, it.en) || esc(it.col)) : '';
      return `${zh}<div class="prompt-hint"><span>场景：${esc(G.name || '')}</span>${col ? `<span>搭配提示：<span class="en">${col}</span></span>` : ''}</div>`;
    }
    case 'fn':
      return `<div class="prompt-hint"><span>写作功能：${esc(G.fn || '')}</span></div>${zh}<div class="prompt-hint"><span>语气：${esc(it.tone || '')}</span></div>`;
    case 'pattern':
      return `${zh}<div class="prompt-hint"><span>写出句型结构，可替换部分用 ... 表示</span></div>`;
    case 'grammar':
      return `<div class="prompt-hint"><span>改正下面的句子</span></div><div class="prompt-zh en" style="font-family:var(--f-en)">${esc(it.wrong)}</div>`;
    default:
      return `${zh}<div class="prompt-hint"><span>写出对应的英文表达</span></div>`;
  }
}
function fbHTML(d, it, revealed) {
  const verdict = revealed ? '正确答案' : d.ok ? '完全正确' : '有几处不同';
  const extra = [];
  if (it.type === 'grammar' && it.zh) extra.push(`<span class="warm" style="font-size:14px">${esc(it.zh)}</span>`);
  else if (it.type !== 'grammar' && it.zh && revealed) extra.push(`<span class="warm" style="font-size:14px">${esc(it.zh)}</span>`);
  return `<div class="fb ${d.ok && !revealed ? 'ok' : 'bad'}"><div class="verdict">${verdict}</div>
    ${revealed || d.empty ? '' : `<div class="line"><span class="lbl">你的答案</span>${d.userHTML}</div>`}
    <div class="line"><span class="lbl">正确表达</span>${d.correctHTML}</div>${extra.join('')}</div>`;
}
function answerForm(fb, multiline) {

    }

    body = `<div class="progress"><span>${roundTxt}${isApply ? '句子应用' : '主动写出'} ${doneN} / ${totalN}</span><div class="pbar"><i style="width:${totalN ? doneN / totalN * 100 : 0}%"></i></div></div>
