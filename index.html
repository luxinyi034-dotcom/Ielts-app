<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="写作表达">
<meta name="theme-color" content="#EEEAE2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>写作表达 · 版本目录</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500&family=Noto+Serif+SC:wght@500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&display=swap">
<style>
/* 版本目录：一列版本卡片，最新一版在最上面，与 App 共用同一套自然中性色。 */
:root {
  --canvas: #EEEAE2; --paper: #FCFBF7; --paper-2: #F7F4EE; --linen: #EBE6DC;
  --sage: #A5B09B; --sage-deep: #72806D; --sage-soft: #E5E9DF; --blush: #EAD8D0;
  --ink: #5B665C; --warm: #706D67; --muted: #96918A; --line: #DEDBD3;
  --f-en: "Source Serif 4", Georgia, serif; --f-title: "Noto Serif SC", "Songti SC", serif;
  --f-ui: "Noto Sans SC", -apple-system, "PingFang SC", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--canvas); color: var(--ink); font-family: var(--f-ui); font-size: 16px; line-height: 1.6; padding: max(28px, env(safe-area-inset-top)) 20px max(40px, env(safe-area-inset-bottom)); }
.wrap { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
header { display: flex; align-items: center; gap: 14px; }
.mark { width: 46px; height: 46px; border-radius: 14px; background: var(--sage-deep); display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 10px; flex: none; }
.mark i { border-radius: 3px; background: var(--paper); }
.mark i:nth-child(2), .mark i:nth-child(3) { opacity: .55; }
h1 { margin: 0; font-family: var(--f-title); font-size: 28px; font-weight: 600; line-height: 1.25; text-wrap: balance; }
.lede { margin: 2px 0 0; color: var(--warm); font-size: 14px; }
.note { background: var(--paper-2); border-radius: 16px; padding: 14px 18px; font-size: 14px; color: var(--warm); }
.list { display: flex; flex-direction: column; gap: 14px; }
.ver { background: var(--paper); border-radius: 22px; padding: 22px 26px; display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 6px 22px; box-shadow: 0 1px 2px rgba(91,102,92,.05), 0 18px 40px -26px rgba(91,102,92,.3); }
.ver.latest { outline: 2px solid var(--sage); }
.ver.tool { margin-top: 18px; background: var(--paper-2, #F7F4EE); }
.ver.tool .vno { font-family: var(--f-title); font-size: 34px; }
.vno { font-family: var(--f-en); font-size: 44px; line-height: 1; color: var(--sage-deep); grid-row: span 3; }
.vhead { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.vhead h2 { margin: 0; font-family: var(--f-title); font-size: 19px; font-weight: 600; }
.date { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.tag { font-size: 12px; padding: 2px 10px; border-radius: 999px; background: var(--sage-soft); color: var(--sage-deep); }
ul { margin: 0; padding-left: 1.2em; color: var(--warm); font-size: 14px; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
.btn { display: inline-flex; align-items: center; min-height: 44px; padding: 0 22px; border-radius: 999px; font-size: 15px; font-weight: 500; text-decoration: none; border: 1px solid transparent; transition: transform .15s; }
.btn:hover { transform: translateY(-1px); }
.btn-primary { background: var(--sage-deep); color: var(--paper); }
.btn-outline { background: var(--paper); border-color: var(--line); color: var(--ink); }
:focus-visible { outline: 2px solid var(--sage-deep); outline-offset: 2px; }
@media (max-width: 560px) { .ver { grid-template-columns: minmax(0, 1fr); padding: 20px; } .vno { grid-row: auto; font-size: 34px; } }
@media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header><div class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <div><h1>雅思写作表达 · 版本目录</h1><p class="lede">每一版单独保存，发布新版不会覆盖旧版，随时可以打开对比。</p></div>
    <button class="btn btn-outline" id="reload" type="button" style="margin-left:auto">刷新目录</button></header>
  <p class="note">同一台设备上，各版本共用一份学习进度。以后如果某一版改了数据格式，会改用自己的存储，旧版本的数据不受影响。每一版也可以单独“添加到主屏幕”。</p>
  <div class="list" id="list"></div>
  <article class="ver tool">
    <div class="vno">测</div>
    <div class="vhead"><h2>测试台 · 新学和复习验收</h2><span class="date">跟随最新版本</span></div>
    <ul><li>一键造出任意一种新学 / 复习情形：次日、3 天、7 天、14 / 30 天档，补练，话题词汇，忘记确认，完整的今日复习</li><li>可以前进或后退日期，看复习怎么排；可以一键填入正确、错一个词、只差单复数的答案</li><li>数据单独保存，不影响正式版本的学习进度</li></ul>
    <div class="actions"><a class="btn btn-primary" href="test/">打开测试台</a></div>
  </article>
</div>
<script>
var VERSIONS = [{"version": "v1", "title": "第一版：按 PRD v1.0 + v2.0 实现", "date": "2026-10-12", "notes": ["主题表达、功能表达、我的写作笔记三个表达库", "今日新学：理解场景 → 主动写出 → 句子应用", "按组复习：记得 / 模糊 / 忘记，复习完成后打卡", "快速复习遮挡、Markdown 笔记导入与整理、学习日历"], "commit": "70aca0d", "source": "https://github.com/luxinyi034-dotcom/-/tree/ielts-v1/ielts-writing"}, {"version": "v2", "title": "第二版：首页分区更清楚", "date": "2026-10-12", "notes": ["首页分成三个区：今天的学习、表达库、打卡与记录", "每个区一块底板：学习区浅绿、表达库米色、打卡区细线框", "复习和新学改成白色卡片，用小标签区分", "去掉首页的示例笔记面板，接下来的复习只显示 4 天"], "commit": "8796c53", "source": "https://github.com/luxinyi034-dotcom/-/tree/ielts-v2/ielts-writing"}, {"version": "v3", "title": "第三版：高亮更柔和，笔记详情更紧凑", "date": "2026-10-12", "notes": ["示例句里的黄色高亮换成和整体一致的浅绿色", "我的写作笔记详情页去掉原始笔记，页面更紧凑", "使用规则、个人错误合并成一块，受控练习改成一行输入"], "commit": "61943a6", "source": "https://github.com/luxinyi034-dotcom/-/tree/ielts-v3/ielts-writing"}, {"version": "v4", "title": "第四版：笔记卡片内容更完整", "date": "2026-10-12", "notes": ["表达卡：例句、常用搭配、使用场景、常见错误", "句型卡：可替换位置、适用场景、示例句、常见错误", "语法卡：错误例句与正确例句对照、语法规则、使用限制", "导入笔记时可以在一条下面写“例句：…”等，编辑卡片可逐项补充"], "commit": "3b6e4ee", "source": "https://github.com/luxinyi034-dotcom/-/tree/ielts-v4/ielts-writing"}, {"version": "v5", "title": "第五版（轻量）：主题表达按 PRD v3 重做", "date": "2026-10-12", "notes": ["先做 2 个话题：医疗科技与监管、线上学习的利与弊", "话题页（按论点 / 一览）、范文段落页", "新学：选 3 个论点 → 预览 → 逐条默写 → 范文填空 → 话题词汇 → 完成", "复习：按论点安排，次日 / 3 / 7 / 14 / 30 天各有题型；补练；论点结果页；忘记先确认再从头开始", "论点句、展开表达、话题词汇三种详情页", "复习设置：考试日期、按考试日期缩短间隔、延长到 60 天（默认关闭）"], "commit": "d64d989", "source": "https://github.com/luxinyi034-dotcom/-/tree/ielts-v5/ielts-writing"}, {"version": "v6", "title": "第六版：按验收反馈修改新学和复习", "date": "2026-10-13", "notes": ["改了某一条的评分，论点结果会跟着重新算", "写错后“照着写一遍”可以跳过；新学默写写错可以“稍后重写”或跳过", "范文填空：空格可以任意顺序点着填；新学里的填空可选，并有四种提示难度；写错可以再填或跳过", "7 天档改为范文填空（只给中文），14 / 30 天档改为只给中文论点、回忆全部", "复习完成页可以展开修改每条评分，复习日期重新计算", "范文段落页新增“默写练习（不记录）”", "更多地方可以点进详情页，返回回到原来的页面"], "commit": "6dd7a93", "source": "https://github.com/luxinyi034-dotcom/-/tree/ielts-v6/ielts-writing"}, {"version": "v7", "title": "第七版：学习记录重做", "date": "2026-10-13", "notes": ["学习记录分成 4 页：概览、词条清单、复习日程、薄弱项", "词条清单：每一条的档位进度条和下次复习日期；可按来源筛选、只看薄弱、搜索；按档位、下次复习、学习时间、写错次数排序，并可切换方向", "薄弱默认只加小标签和原因，点“薄弱标浅红”才整行标出；判断规则默认“上次忘记，或最近 3 次里 2 次模糊 / 忘记”，可在复习设置里改", "复习日程：月历显示每天到期多少条，点某一天看具体内容", "薄弱项：可以练一遍（不记录），列出写错最多的", "概览保留打卡日历，加上档位分布和未来 7 天复习量"], "commit": "73f6fb8", "source": "https://github.com/luxinyi034-dotcom/-/tree/ielts-v7/ielts-writing"}, {"version": "v8", "title": "第八版：功能表达和写作笔记的详情页", "date": "2026-10-14", "notes": ["功能表达和写作笔记（表达卡、句型卡、语法卡）的新详情页：词典式排版，和主题表达统一用绿色", "每种卡的重点字最大：功能表达看例句，表达卡看例句和搭配，句型卡看结构和例句，语法卡看错误和正确对照", "功能表达的近义比较默认收起，点开是比较表；表达卡的搭配里可以互换的词自动标绿", "右边一栏精简：复习状态（“记忆 ▾”下拉切换记忆 / 资料 / 暂缓）、可展开的写错记录 / 备注 / 原始笔记，下面是练一遍和“下一条”", "详情页上不放输入框：点“练一遍”进入单独的练习页，可看提示 / 答案，不记录", "测试台新增“笔记卡详情页”场景：一键导入示例笔记"], "commit": "120f943", "source": "https://github.com/luxinyi034-dotcom/-/tree/ielts-v8/ielts-writing"}];
var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
function renderList(VERSIONS) {
document.getElementById('list').innerHTML = VERSIONS.slice().reverse().map(function (v, i) {
  return '<article class="ver' + (i === 0 ? ' latest' : '') + '">' +
    '<div class="vno">' + esc(v.version) + '</div>' +
    '<div class="vhead"><h2>' + esc(v.title) + '</h2>' + (i === 0 ? '<span class="tag">最新</span>' : '') + '<span class="date">' + esc(v.date) + '</span></div>' +
    (v.notes && v.notes.length ? '<ul>' + v.notes.map(function (n) { return '<li>' + esc(n) + '</li>'; }).join('') + '</ul>' : '<span></span>') +
    '<div class="actions"><a class="btn btn-primary" href="' + encodeURIComponent(v.version) + '/?b=' + encodeURIComponent(v.commit || '') + '">打开 ' + esc(v.version) + '</a>' +
    '<a class="btn btn-outline" href="' + esc(v.source) + '" target="_blank" rel="noopener">查看这一版的源码</a></div>' +
    '</article>';
}).join('');
}
renderList(VERSIONS);
/* 主屏幕上的网页可能是缓存的旧页面：每次打开都重新读一次版本清单，有新版本就直接显示 */
fetch('versions.json?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (v) {
  if (v && v.length && v.length !== VERSIONS.length) { VERSIONS = v; renderList(v); }
}).catch(function () {});
document.getElementById('reload').addEventListener('click', function () { location.replace('./?t=' + Date.now()); });
</script>
</body>
</html>
