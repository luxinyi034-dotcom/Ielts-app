<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="写作表达 v1">
<meta name="theme-color" content="#EEEAE2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>雅思写作表达</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;1,8..60,400&display=swap">
<style>
/* Layout: iPad 学习桌面 —— 左侧导航落在亚麻底色上，主内容是一张圆角纸面；颜色只负责分组、状态和行动。 */
:root {
  --canvas: #EEEAE2;
  --paper: #FCFBF7;
  --paper-2: #F7F4EE;
  --linen: #EBE6DC;
  --beige: #DFD4C6;
  --sage: #A5B09B;
  --sage-deep: #72806D;
  --sage-soft: #E5E9DF;
  --blush: #EAD8D0;
  --blush-soft: #F5ECE7;
  --ink: #5B665C;
  --warm: #706D67;
  --muted: #96918A;
  --line: #DEDBD3;
  --wrong: #B06A5B;
  --wrong-soft: #F4E2DC;
  --gap: #B08A4E;
  --gap-soft: #F3EAD9;
  --on-accent: #FCFBF7;
  --shadow: 0 1px 2px rgba(91, 102, 92, .05), 0 18px 40px -24px rgba(91, 102, 92, .28);
  --shadow-sm: 0 1px 2px rgba(91, 102, 92, .07);
  --f-en: "Source Serif 4", "Iowan Old Style", Georgia, serif;
  --f-title: "Noto Serif SC", "Songti SC", "STSong", serif;
  --f-ui: "Noto Sans SC", -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --r-xl: 28px;
  --r-lg: 22px;
  --r-md: 17px;
  --r-sm: 12px;
  color-scheme: light;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--canvas); color: var(--ink); font-family: var(--f-ui); font-size: 16px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; }
button:disabled { cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--sage-deep); outline-offset: 2px; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; font-weight: 600; }
p { margin: 0; }
.en { font-family: var(--f-en); letter-spacing: -.003em; }
.muted { color: var(--muted); }
.warm { color: var(--warm); }
.num { font-variant-numeric: tabular-nums; }
.hidden { display: none !important; }

/* ---------- shell ---------- */
.shell { display: grid; grid-template-columns: 252px minmax(0, 1fr); min-height: 100vh; min-height: 100dvh; }
.side { position: sticky; top: 0; height: 100vh; height: 100dvh; padding: 30px 18px 24px 22px; display: flex; flex-direction: column; gap: 26px; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 12px; padding-left: 6px; }
.brand-mark { width: 38px; height: 38px; border-radius: 12px; background: var(--sage-deep); display: grid; grid-template-columns: 1fr 1fr; gap: 3px; padding: 8px; flex: none; }
.brand-mark i { border-radius: 3px; background: var(--paper); opacity: .92; }
.brand-mark i:nth-child(2), .brand-mark i:nth-child(3) { opacity: .55; }
.brand b { display: block; font-family: var(--f-title); font-size: 18px; line-height: 1.2; }
.brand small { display: block; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.nav { display: flex; flex-direction: column; gap: 4px; }
.nav-label { font-size: 11px; letter-spacing: .14em; color: var(--muted); padding: 14px 12px 4px; }
.nav-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 14px; border: 0; background: transparent; color: var(--warm); font-size: 15px; text-align: left; min-height: 44px; transition: background .15s, color .15s; }
.nav-item svg { width: 21px; height: 21px; flex: none; }
.nav-item:hover { background: rgba(252, 251, 247, .55); color: var(--ink); }
.nav-item[aria-current="page"] { background: var(--paper); color: var(--sage-deep); font-weight: 500; box-shadow: var(--shadow-sm); }
.nav-item .count { margin-left: auto; font-size: 12px; min-width: 22px; padding: 0 7px; border-radius: 999px; background: var(--blush); color: var(--ink); text-align: center; }
.nav-item.sub { padding-left: 22px; }
.side-foot { margin-top: auto; padding: 14px; border-radius: var(--r-md); background: var(--paper-2); display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--warm); }
.side-foot b { color: var(--ink); font-size: 15px; }
.week-dots { display: flex; gap: 6px; }
.week-dots i { width: 18px; height: 18px; border-radius: 50%; background: var(--linen); display: grid; place-items: center; font-style: normal; font-size: 10px; color: var(--muted); }
.week-dots i.on { background: var(--sage); color: var(--on-accent); }
.week-dots i.today { box-shadow: 0 0 0 1.5px var(--sage-deep); }

.main { padding: 18px 20px 20px 0; min-width: 0; }
.sheet { background: var(--paper); border-radius: var(--r-xl); min-height: calc(100vh - 38px); min-height: calc(100dvh - 38px); box-shadow: var(--shadow); padding: 26px clamp(20px, 3.4vw, 44px) 56px; display: flex; flex-direction: column; gap: 26px; min-width: 0; }

/* ---------- top bar ---------- */
.topbar { display: flex; align-items: center; gap: 14px; min-height: 48px; flex-wrap: wrap; }
.topbar .titles { display: flex; flex-direction: column; min-width: 0; flex: 1 1 260px; }
.crumb { font-size: 13px; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; }
.crumb span + span::before { content: "/"; margin-right: 6px; color: var(--line); }
.page-title { font-family: var(--f-title); font-size: clamp(24px, 2.6vw, 30px); line-height: 1.3; color: var(--ink); }
.search { display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 16px; border: 1px solid var(--line); border-radius: 999px; background: var(--paper); width: min(300px, 100%); }
.search svg { width: 18px; height: 18px; color: var(--muted); flex: none; }
.search input { border: 0; background: transparent; outline: none; min-width: 0; flex: 1; font-size: 16px; }
.icon-btn { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--paper); display: inline-grid; place-items: center; color: var(--warm); flex: none; transition: transform .15s, border-color .15s, color .15s; }
.icon-btn svg { width: 20px; height: 20px; }
.icon-btn:hover { transform: translateY(-1px); color: var(--sage-deep); border-color: var(--sage); }
.icon-btn.on { color: var(--sage-deep); background: var(--sage-soft); border-color: var(--sage-soft); }
.icon-btn.on svg { fill: currentColor; }

/* ---------- buttons (胶囊：primary / outline / soft / ghost) ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 22px; border-radius: 999px; border: 1px solid transparent; font-size: 15px; font-weight: 500; white-space: nowrap; transition: transform .15s, background .15s, border-color .15s, opacity .15s; }
.btn svg { width: 18px; height: 18px; }
.btn:hover:not(:disabled) { transform: translateY(-1px); }
.btn:disabled { opacity: .45; }
.btn-primary { background: var(--sage-deep); color: var(--on-accent); }
.btn-primary:hover:not(:disabled) { background: #67755F; }
.btn-outline { background: var(--paper); border-color: var(--line); color: var(--ink); }
.btn-outline:hover:not(:disabled) { border-color: var(--sage); }
.btn-soft { background: var(--blush); color: var(--ink); }
.btn-soft:hover:not(:disabled) { background: #E3CEC4; }
.btn-ghost { background: transparent; color: var(--warm); padding: 0 12px; }
.btn-ghost:hover:not(:disabled) { color: var(--ink); }
.btn-sm { min-height: 36px; padding: 0 15px; font-size: 14px; }
.btn-danger { color: var(--wrong); }
.btn-danger.armed { background: var(--wrong); color: var(--on-accent); border-color: var(--wrong); }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* ---------- tags & segmented ---------- */
.tag { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 10px; border-radius: 999px; font-size: 12px; background: var(--linen); color: var(--warm); white-space: nowrap; }
.tag.core { background: var(--sage-soft); color: var(--sage-deep); }
.tag.know { background: var(--blush-soft); color: #8A6C60; }
.tag.term { background: var(--linen); color: var(--warm); }
.tag.fn { background: var(--sage-soft); color: var(--sage-deep); }
.tag.pattern { background: var(--blush-soft); color: #8A6C60; }
.tag.grammar { background: #ECE7F0; color: #6E6478; }
.tag.expr { background: var(--sage-soft); color: var(--sage-deep); }
.status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--warm); white-space: nowrap; }
.status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--c, var(--line)); }
.s-wait { --c: var(--beige); }
.s-learn { --c: var(--blush); }
.s-first { --c: var(--sage); }
.s-due { --c: var(--gap); }
.s-stable { --c: var(--sage-deep); }
.s-ref { --c: transparent; }
.s-ref::before { box-shadow: inset 0 0 0 1.5px var(--line); }
.s-triage { --c: var(--wrong); }

.seg { display: inline-flex; padding: 4px; gap: 4px; border: 1px solid var(--line); border-radius: 999px; background: var(--paper); flex-wrap: wrap; }
.seg button { border: 0; background: transparent; min-height: 36px; padding: 0 16px; border-radius: 999px; font-size: 14px; color: var(--warm); transition: background .15s, color .15s; }
.seg button[aria-pressed="true"] { background: var(--sage-deep); color: var(--on-accent); font-weight: 500; }
.seg.small button { min-height: 30px; padding: 0 12px; font-size: 13px; }
.mode { display: inline-flex; padding: 3px; gap: 2px; border-radius: 999px; background: var(--paper-2); border: 1px solid var(--line); flex: none; }
.mode button { border: 0; background: transparent; min-height: 30px; min-width: 48px; padding: 0 11px; border-radius: 999px; font-size: 13px; color: var(--muted); }
.mode button[aria-pressed="true"] { background: var(--paper); color: var(--ink); box-shadow: var(--shadow-sm); font-weight: 500; }
.mode button[data-m="memory"][aria-pressed="true"] { background: var(--sage-deep); color: var(--on-accent); }

.check { width: 26px; height: 26px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--paper); display: inline-grid; place-items: center; flex: none; color: transparent; transition: background .15s, border-color .15s; padding: 0; }
.check svg { width: 15px; height: 15px; }
.check[aria-checked="true"] { background: var(--sage); border-color: var(--sage); color: var(--on-accent); }
.radio { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--paper); flex: none; display: grid; place-items: center; }
.radio[aria-checked="true"] { border-color: var(--sage-deep); }
.radio[aria-checked="true"]::after { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--sage-deep); }

/* ---------- surfaces ---------- */
.grid { display: grid; gap: 16px; grid-template-columns: repeat(12, minmax(0, 1fr)); }
.span-12 { grid-column: span 12; } .span-8 { grid-column: span 8; } .span-7 { grid-column: span 7; } .span-6 { grid-column: span 6; } .span-5 { grid-column: span 5; } .span-4 { grid-column: span 4; }
.panel { border-radius: var(--r-lg); background: var(--paper-2); padding: 22px 24px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.panel.sage { background: var(--sage-soft); }
.panel.sage-strong { background: var(--sage); color: var(--on-accent); }
.panel.blush { background: var(--blush); }
.panel.blush-soft { background: var(--blush-soft); }
.panel.linen { background: var(--linen); }
.panel.line { background: var(--paper); border: 1px solid var(--line); }
.panel-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.eyebrow { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--warm); font-weight: 500; }
.eyebrow small { display: block; letter-spacing: .06em; font-weight: 400; color: var(--muted); text-transform: none; font-size: 12px; }
.big-num { font-family: var(--f-en); font-size: 54px; line-height: 1; font-variant-numeric: tabular-nums; color: var(--ink); }
.big-num small { font-family: var(--f-ui); font-size: 15px; color: var(--warm); margin-left: 6px; }
.section { display: flex; flex-direction: column; gap: 12px; }
.section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.section-head h3 { font-size: 17px; font-family: var(--f-title); }
.section-head .hint { font-size: 13px; color: var(--muted); }
.note-line { font-size: 13px; color: var(--muted); }
.divider { height: 1px; background: var(--line); border: 0; margin: 0; }

/* ---------- list rows ---------- */
.rows { display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; align-items: center; gap: 14px; padding: 14px 18px; border-radius: var(--r-md); background: var(--paper-2); min-width: 0; }
.row.white { background: var(--paper); border: 1px solid var(--line); }
.row.tap { border: 0; width: 100%; text-align: left; transition: background .15s, transform .15s; }
.row.tap:hover { background: var(--linen); }
.row .body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.row .body.tap { border: 0; background: transparent; padding: 0; text-align: left; }
.row .title { font-size: 16px; font-weight: 500; overflow-wrap: anywhere; }
.row .en.title { font-size: 18px; font-weight: 500; line-height: 1.35; }
.row .sub { font-size: 14px; color: var(--warm); overflow-wrap: anywhere; }
.row .meta { font-size: 13px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row .side-ctl { display: flex; align-items: center; gap: 10px; flex: none; }
.row .chev { width: 18px; height: 18px; color: var(--muted); flex: none; }
.bar-left { position: relative; padding-left: 22px; }
.bar-left::before { content: ""; position: absolute; left: 10px; top: 16px; bottom: 16px; width: 3px; border-radius: 3px; background: var(--c, var(--sage)); }

.empty { padding: 30px 24px; border-radius: var(--r-lg); border: 1.5px dashed var(--line); color: var(--warm); display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
.empty h3 { font-family: var(--f-title); font-size: 18px; color: var(--ink); }

/* ---------- cards: topics / functions ---------- */
.tiles { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
.tile { border: 0; text-align: left; border-radius: var(--r-lg); padding: 20px 22px; background: var(--paper-2); display: flex; flex-direction: column; gap: 10px; min-height: 150px; transition: transform .15s, background .15s; }
.tile:hover { transform: translateY(-1px); background: var(--linen); }
.tile h3 { font-family: var(--f-title); font-size: 21px; }
.tile .sub { font-size: 14px; color: var(--warm); }
.tile .meta { margin-top: auto; font-size: 13px; color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap; }
.tile.c1 { background: var(--sage-soft); } .tile.c2 { background: var(--blush-soft); } .tile.c3 { background: var(--linen); }
.tile.c1:hover { background: #DCE2D4; } .tile.c2:hover { background: #F0E2DB; }

/* ---------- group detail ---------- */
.group-hero { display: flex; flex-direction: column; gap: 14px; padding: 24px 26px; border-radius: var(--r-lg); background: var(--sage-soft); }
.group-hero.fn { background: var(--blush-soft); }
.group-hero.notes { background: var(--linen); }
.group-hero p { color: var(--warm); max-width: 62ch; }
.stats-line { display: flex; gap: 22px; flex-wrap: wrap; font-size: 14px; color: var(--warm); }
.stats-line b { font-family: var(--f-en); font-size: 22px; color: var(--ink); font-weight: 500; margin-right: 4px; font-variant-numeric: tabular-nums; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; min-height: 34px; padding: 0 14px; border-radius: 999px; background: var(--paper); border: 1px solid var(--line); font-size: 14px; color: var(--warm); }
button.chip:hover { border-color: var(--sage); color: var(--ink); }
.paragraph { font-family: var(--f-en); font-size: 19px; line-height: 1.75; color: var(--ink); max-width: 70ch; padding: 22px 26px; border-radius: var(--r-lg); background: var(--paper-2); }
.paragraph mark { background: var(--sage-soft); color: inherit; padding: 1px 3px; border-radius: 5px; }
.paragraph mark.core { background: var(--blush); }

.cmp-wrap { overflow-x: auto; border-radius: var(--r-lg); border: 1px solid var(--line); }
.cmp { width: 100%; border-collapse: collapse; min-width: 720px; font-size: 14px; }
.cmp th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12px; letter-spacing: .08em; padding: 12px 16px; background: var(--paper-2); border-bottom: 1px solid var(--line); }
.cmp td { padding: 14px 16px; border-bottom: 1px solid var(--line); vertical-align: top; color: var(--warm); }
.cmp tr:last-child td { border-bottom: 0; }
.cmp td.expr { color: var(--ink); }
.cmp td.expr button { border: 0; background: none; padding: 0; text-align: left; font-family: var(--f-en); font-size: 17px; color: var(--ink); }
.cmp td.expr button:hover { color: var(--sage-deep); text-decoration: underline; text-underline-offset: 3px; }

/* ---------- item detail ---------- */
.detail { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 22px; align-items: start; }
.detail-main { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.detail-side { display: flex; flex-direction: column; gap: 14px; position: sticky; top: 18px; }
.expr-hero { padding: 26px 28px; border-radius: var(--r-lg); background: var(--paper-2); display: flex; flex-direction: column; gap: 12px; }
.expr-hero .en { font-size: clamp(26px, 3vw, 36px); line-height: 1.25; color: var(--ink); overflow-wrap: anywhere; }
.expr-hero .zh { font-size: 19px; color: var(--warm); }
.field-block { display: flex; flex-direction: column; gap: 6px; padding: 16px 20px; border-radius: var(--r-md); background: var(--paper); border: 1px solid var(--line); }
.field-block .label { font-size: 12px; letter-spacing: .1em; color: var(--muted); }
.field-block .val { font-size: 15px; overflow-wrap: anywhere; }
.field-block .val.en { font-size: 18px; }
.field-block.raw .val { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 14px; color: var(--warm); white-space: pre-wrap; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pair .wrongline { background: var(--wrong-soft); border-color: transparent; }
.pair .rightline { background: var(--sage-soft); border-color: transparent; }
textarea.note { width: 100%; min-height: 90px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--paper); padding: 10px 12px; resize: vertical; font-size: 15px; }
.kv { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; color: var(--warm); padding: 6px 0; border-bottom: 1px solid var(--line); }
.kv:last-child { border-bottom: 0; }
.kv b { color: var(--ink); font-weight: 500; }

/* ---------- forms ---------- */
.form { display: flex; flex-direction: column; gap: 14px; }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.fld { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--warm); min-width: 0; }
.fld.wide { grid-column: 1 / -1; }
.fld input, .fld textarea, .fld select { border: 1px solid var(--line); background: var(--paper); border-radius: var(--r-sm); padding: 11px 14px; font-size: 16px; color: var(--ink); min-width: 0; width: 100%; }
.fld textarea { min-height: 220px; resize: vertical; line-height: 1.6; }
.fld input:focus, .fld textarea:focus, .fld select:focus { outline: none; border-color: var(--sage); box-shadow: 0 0 0 3px var(--sage-soft); }
.form-msg { font-size: 14px; color: var(--wrong); }
.privacy { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; color: var(--warm); background: var(--paper-2); border-radius: var(--r-sm); padding: 12px 14px; }
.privacy svg { width: 18px; height: 18px; flex: none; margin-top: 2px; color: var(--sage-deep); }
.file-btn { position: relative; overflow: hidden; }
.file-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

/* ---------- today: new study chooser ---------- */
.chooser { display: flex; flex-direction: column; gap: 8px; }
.cgroup { border-radius: var(--r-md); background: var(--paper-2); border: 1.5px solid transparent; transition: border-color .15s, background .15s; }
.cgroup.selected { border-color: var(--sage); background: var(--paper); }
.cgroup.disabled { opacity: .62; }
.cgroup-head { display: flex; align-items: center; gap: 6px; padding: 6px 8px 6px 6px; }
.cgroup-pick { flex: 1; min-width: 0; display: flex; align-items: center; gap: 14px; border: 0; background: transparent; text-align: left; padding: 10px 12px; border-radius: 14px; min-height: 56px; }
.cgroup-pick:disabled { cursor: default; }
.cgroup-pick .body { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.cgroup-pick .title { font-weight: 500; font-size: 16px; }

function dayKey(t = Date.now()) { const d = new Date(t); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function diffDays(t) { return Math.round((dayStart(t) - dayStart()) / DAY); }
function relDay(t) {

/* ============================================================
   内容组装：系统预设 + 自己添加 + 写作笔记
   ============================================================ */
const TYPE_LABEL = { core: '核心论点', know: '知识表达', term: '专业词汇', fn: '功能表达', expr: '表达卡', pattern: '句型卡', grammar: '语法卡' };
const PROMPT_LABEL = { core: '中文观点 → 完整英文句子', know: '中文含义 / 句子填空 → 短语', term: '中文场景 → 术语和搭配', fn: '写作功能 → 表达', expr: '中文提示 → 英文写出', pattern: '结构提示 → 写出句型', grammar: '错误句 → 改正' };
const KIND_LABEL = { expr: '表达组', pattern: '句型组', grammar: '语法组' };
const STATUS_CLS = { '待整理': 's-triage', '等待学习': 's-wait', '学习中': 's-learn', '初次完成': 's-first', '待复习': 's-due', '近期稳定': 's-stable', '资料': 's-ref', '暂缓': 's-ref' };
const LADDER = [1, 3, 7, 14, 30];

let ITEMS = new Map(), GROUPS = new Map();
function assemble() {
  ITEMS = new Map(); GROUPS = new Map();
  for (const g of TOPIC_GROUPS) {
    const G = { id: g.id, lib: 'topic', topic: g.topic, sub: g.sub, name: g.name, scene: g.scene, directions: g.directions, paragraph: g.paragraph, related: g.related, ids: [] };
    GROUPS.set(G.id, G);
    for (const [type, en, zh, x] of g.items) {
      const id = 't:' + g.id + ':' + slug(en);
      ITEMS.set(id, { id, lib: 'topic', type, gid: g.id, en, zh, ex: x.ex || '', col: x.col || '', usage: x.usage || '', err: x.err || '', src: '系统预设 · ' + g.topic + ' / ' + g.sub, builtin: true });
      G.ids.push(id);
    }
  }
  for (const g of FUNCTION_GROUPS) {
    const G = { id: g.id, lib: 'function', fn: g.fn, name: g.fn, scene: g.scene, ids: [] };
    GROUPS.set(G.id, G);
    for (const [en, zh, syntax, tone, diffNote, ex, err] of g.items) {
      const id = 'f:' + slug(en);
      ITEMS.set(id, { id, lib: 'function', type: 'fn', gid: g.id, en, zh, syntax, tone, diff: diffNote, ex, err, src: '系统预设 · 功能表达', builtin: true });
      G.ids.push(id);
    }
  }
  for (const g of S.custom.groups) GROUPS.set(g.id, Object.assign({}, g, { ids: [] }));
  for (const it of S.custom.items) {
    const G = GROUPS.get(it.gid); if (!G) continue;
    ITEMS.set(it.id, Object.assign({}, it, { custom: true })); G.ids.push(it.id);
  }
  for (const g of S.notes.groups) GROUPS.set(g.id, Object.assign({}, g, { lib: 'notes', ids: [] }));
  for (const it of S.notes.items) {
    const G = GROUPS.get(it.gid); if (!G) continue;
    ITEMS.set(it.id, Object.assign({}, it, { lib: 'notes' })); G.ids.push(it.id);
  }
}

function noteSet(id) { return S.notes.sets.find(s => s.id === id); }
function defMode(it) { if (!it) return 'reference'; if (it.defMode) return it.defMode; return it.type === 'core' ? 'memory' : 'reference'; }
function st(id) { return S.items[id] || (S.items[id] = { hist: [], wrong: 0 }); }
function modeOf(id) { const s = S.items[id]; return (s && s.mode) || defMode(ITEMS.get(id)); }
function studied(id) { const s = S.items[id]; return !!(s && s.stage != null); }
function confirmedItem(it) { if (!it) return false; if (it.lib !== 'notes') return true; const set = noteSet(it.setId); return !set || set.confirmed; }
function active(id) { return confirmedItem(ITEMS.get(id)); }
function isDue(id) { const s = S.items[id]; return active(id) && modeOf(id) === 'memory' && studied(id) && s.next <= dayStart(); }

function itemStatus(id) {
  const it = ITEMS.get(id);
  if (!confirmedItem(it)) return '待整理';
  const m = modeOf(id);
  if (m === 'reference') return '资料';
  if (m === 'paused') return '暂缓';
  const s = S.items[id];
  if (!s || s.stage == null) return S.newSession && S.newSession.ids.includes(id) ? '学习中' : '等待学习';
  if (s.next <= dayStart()) return '待复习';
  const reviews = s.hist.filter(h => h.p !== 'new');
  if (!reviews.length) return '初次完成';
  const last2 = reviews.slice(-2);
  if (s.stage >= 3 && last2.length === 2 && last2.every(h => h.r === 'rem')) return '近期稳定';
  return '学习中';
}
const statusHTML = label => `<span class="status ${STATUS_CLS[label] || ''}">${label}</span>`;

function gstats(G) {
  const r = { total: 0, mem: 0, ref: 0, paused: 0, fresh: 0, due: 0, stable: 0, first: 0, studied: 0, last: 0, next: Infinity };
  for (const id of G.ids) {
    if (!active(id)) continue;
    r.total++;
    const m = modeOf(id);
    if (m === 'reference') { r.ref++; continue; }
    if (m === 'paused') { r.paused++; continue; }
    r.mem++;
    if (!studied(id)) { r.fresh++; continue; }
    r.studied++;
    const s = S.items[id];
    r.last = Math.max(r.last, s.last || 0);
    r.next = Math.min(r.next, s.next);
    const lab = itemStatus(id);
    if (lab === '待复习') r.due++;
    if (lab === '近期稳定') r.stable++;
    if (lab === '初次完成') r.first++;
  }
  if (G.lib === 'notes') { const set = noteSet(G.setId); if (set && !set.confirmed) { r.status = '待整理'; return r; } }
  if (r.due) r.status = '待复习';
  else if (!r.mem) r.status = '资料';
  else if (r.fresh === r.mem) r.status = '等待学习';
  else if (r.fresh) r.status = '学习中';
  else if (r.stable === r.mem) r.status = '近期稳定';
  else if (r.first === r.mem) r.status = '初次完成';
  else r.status = '学习中';
  return r;
}

function groupCrumb(G) {
  if (G.lib === 'topic') return [G.topic, G.sub];
  if (G.lib === 'function') return ['功能表达', G.fn];
  const set = noteSet(G.setId);
  return ['我的写作笔记', set ? set.title : ''];
}
function typeTag(type) { return `<span class="tag ${type}">${TYPE_LABEL[type] || ''}</span>`; }

/* ============================================================
   间隔复习
   ============================================================ */
function bumpLog(field, n = 1) { const k = dayKey(); const l = S.log[k] || (S.log[k] = {}); l[field] = (l[field] || 0) + n; }
function markLearned(id, firstOk) {
  const s = st(id);
  s.stage = 0; s.next = addDays(Date.now(), LADDER[0]); s.last = Date.now();
  s.hist.push({ r: firstOk ? 'rem' : 'fgt', t: Date.now(), p: 'new' });
  if (!firstOk) s.wrong = (s.wrong || 0) + 1;
  bumpLog('learned');
}
function nextIntervalLabel(id, r) {
  const s = S.items[id] || { stage: 0 };
  if (r === 'rem') return '约 ' + LADDER[Math.min((s.stage || 0) + 1, LADDER.length - 1)] + ' 天后';
  if (r === 'vag') return ((s.stage || 0) >= 2 ? 2 : 1) + ' 天后再现';
  return '明天优先复习';
}
function applyRating(id, r, prompt) {
  const s = st(id), now = Date.now();
  if (r === 'rem') { s.stage = Math.min((s.stage || 0) + 1, LADDER.length - 1); s.next = addDays(now, LADDER[s.stage]); }
  else if (r === 'vag') { const d = (s.stage || 0) >= 2 ? 2 : 1; s.stage = Math.max(0, (s.stage || 0) - 1); s.next = addDays(now, d); }
  else { s.stage = 0; s.next = addDays(now, 1); s.wrong = (s.wrong || 0) + 1; }
  s.last = now;
  s.hist.push({ r, t: now, p: prompt });
  bumpLog(r);
}
function dueQueue() {
  const map = new Map();
  for (const [id, it] of ITEMS) {
    if (!isDue(id)) continue;
    if (!map.has(it.gid)) map.set(it.gid, []);
    map.get(it.gid).push(id);
  }
  const arr = [];
  for (const [gid, ids] of map) {
    if (!GROUPS.has(gid)) continue;
    ids.sort((a, b) => (S.items[b].wrong || 0) - (S.items[a].wrong || 0) || S.items[a].next - S.items[b].next);
    arr.push({ gid, ids, minNext: Math.min(...ids.map(i => S.items[i].next)), wrong: ids.reduce((a, i) => a + (S.items[i].wrong || 0), 0) });
  }
  arr.sort((a, b) => a.minNext - b.minNext || b.wrong - a.wrong);
  return arr;
}
const dueCount = () => dueQueue().reduce((a, g) => a + g.ids.length, 0);
function todayLog() { return S.log[dayKey()] || {}; }
function canCheckin() {
  const l = todayLog();
  const did = (l.rem || 0) + (l.vag || 0) + (l.fgt || 0) + (l.learned || 0);
  return !l.checked && did > 0 && dueCount() === 0;
}
function checkin() {
  const k = dayKey(); const l = S.log[k] || (S.log[k] = {});
  l.checked = true; l.checkedAt = Date.now(); save();
  toast('已打卡，写入 ' + fmtMD(Date.now()) + ' 的学习记录');
}
function streak() {
  let n = 0, t = Date.now();
  if (!(S.log[dayKey(t)] || {}).checked) t = addDays(t, -1);
  while ((S.log[dayKey(t)] || {}).checked) { n++; t = addDays(t, -1); }
  return n;
}

/* ============================================================
   默写判定：在用户答案里标出错误 / 缺失 / 多余
   ============================================================ */
function tok(s) {
  return String(s || '').replace(/[’‘`]/g, "'").replace(/[“”]/g, '"').trim().split(/\s+/).filter(Boolean)
    .map(raw => ({ raw, n: raw.toLowerCase().replace(/[^a-z0-9'\-]/g, '').replace(/^['-]+|['-]+$/g, '') }));
}
function diff(user, correct) {
  const Ua = tok(user), Ca = tok(correct);
  const U = Ua.map((t, i) => Object.assign({ i }, t)).filter(t => t.n);
  const C = Ca.map((t, i) => Object.assign({ i }, t)).filter(t => t.n);
  const m = U.length, n = C.length;
  const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
  for (let i = m - 1; i >= 0; i--) for (let j = n - 1; j >= 0; j--) dp[i][j] = U[i].n === C[j].n ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const ops = [];
  let i = 0, j = 0;
  while (i < m || j < n) {
    if (i < m && j < n && U[i].n === C[j].n) { ops.push({ t: 'eq', u: U[i], c: C[j] }); i++; j++; }
    else if (j < n && (i === m || dp[i][j + 1] >= dp[i + 1][j])) { ops.push({ t: 'del', c: C[j] }); j++; }
    else { ops.push({ t: 'ins', u: U[i] }); i++; }
  }
  const uCls = new Array(Ua.length).fill(''), cCls = new Array(Ca.length).fill(''), miss = {};
  let k = 0, eq = 0;
  while (k < ops.length) {
    if (ops[k].t === 'eq') { eq++; k++; continue; }
    const ins = [], del = [];
    while (k < ops.length && ops[k].t !== 'eq') { (ops[k].t === 'ins' ? ins : del).push(ops[k]); k++; }
    del.forEach(o => { cCls[o.c.i] = 'tk-need'; });
    if (ins.length && del.length) {
      ins.forEach(o => { uCls[o.u.i] = 'tk-wrong'; });
      if (del.length > ins.length) { const p = ins[ins.length - 1].u.i + 1; miss[p] = (miss[p] || 0) + del.length - ins.length; }
    } else if (ins.length) {
      ins.forEach(o => { uCls[o.u.i] = 'tk-extra'; });
    } else {
      const p = k < ops.length ? ops[k].u.i : Ua.length;
      miss[p] = (miss[p] || 0) + del.length;
    }
  }
  const missTag = c => `<span class="tk-miss" title="这里缺少 ${c} 个词">缺${c > 1 ? c : ''}</span>`;
  let userHTML = '';
  for (let x = 0; x <= Ua.length; x++) {
    if (miss[x]) userHTML += missTag(miss[x]) + ' ';
    if (x < Ua.length) userHTML += (uCls[x] ? `<span class="${uCls[x]}">${esc(Ua[x].raw)}</span>` : esc(Ua[x].raw)) + ' ';
  }
  const correctHTML = Ca.map((t, x) => cCls[x] ? `<span class="${cCls[x]}">${esc(t.raw)}</span>` : esc(t.raw)).join(' ');
  return { ok: m > 0 && ops.every(o => o.t === 'eq'), empty: m === 0, score: n ? eq / n : 0, userHTML: userHTML.trim(), correctHTML };
}

/* ============================================================
   笔记解析：粘贴文字 / Markdown → 表达卡、句型卡、语法卡
   ============================================================ */
const CJK = /[㐀-鿿　-〿（：，；]/;
function stripTail(s) { return String(s).trim().replace(/[\s\-–—:：|=,，;；]+$/, '').trim(); }
function splitEnZh(s) {
  const i = s.search(CJK);
  if (i < 0) return { en: stripTail(s), zh: '' };
  return { en: stripTail(s.slice(0, i)), zh: s.slice(i).trim() };
}
const isPattern = en => /\.\.\.|…|_{2,}|\bsb\b|\bsth\b|\[[^\]]+\]/i.test(en);
function parseNotes(text) {
  const lines = String(text || '').replace(/\r/g, '').split('\n');
  const secs = []; let cur = { heading: '', cards: [] }; secs.push(cur);
  const wrongMark = /^(?:❌|✗|✘|×|错误\s*[:：]|wrong\s*[:：])\s*/i;
  const arrow = /\s*(?:→|->|=>|⇒)\s*|\s*(?:✅|✓|✔|√|正确\s*[:：])\s*/;
  lines.forEach((rawLine, idx) => {
    let line = rawLine.trim();
    if (!line) return;
    const h = line.match(/^#{1,6}\s+(.+)$/);
    if (h) { cur = { heading: h[1].trim(), cards: [] }; secs.push(cur); return; }
    line = line.replace(/^>\s*/, '').replace(/^(?:[-*+•·]|\d+[.)、])\s+/, '').replace(/^\[[ xX]\]\s+/, '').trim();
    if (!line) return;
    let card = null;
    if (wrongMark.test(line)) {
      const parts = line.replace(wrongMark, '').split(arrow).filter(s => s && s.trim());
      if (parts.length >= 2) {
        const { en, zh } = splitEnZh(parts.slice(1).join(' '));
        if (en) card = { kind: 'grammar', wrong: stripTail(parts[0]), en, zh };
      }
    } else {
      const { en, zh } = splitEnZh(line);
      if (en && /[A-Za-z]/.test(en)) card = { kind: isPattern(en) ? 'pattern' : 'expr', en, zh };
    }
    if (card) { card.raw = rawLine.trim(); card.line = idx + 1; card.flag = /[!！]|常错|易错/.test(line); cur.cards.push(card); }
  });
  return secs.filter(s => s.cards.length);
}
function addNoteItem(c, setId, gid, grouped) {
  const def = c.kind === 'expr' ? (grouped || c.flag ? 'memory' : 'reference') : 'memory';
  S.notes.items.push({ id: 'n:' + uid(), setId, gid, type: c.kind, en: c.en, zh: c.zh, wrong: c.wrong || '', usage: '', err: '', raw: c.raw, line: c.line, defMode: def });
}
function createNoteSet(text, title, opts = {}) {
  const secs = parseNotes(text);
  const setId = 'ns:' + uid();
  let count = 0;
  for (const sec of secs) {
    for (const kind of ['expr', 'pattern', 'grammar']) {
      const cards = sec.cards.filter(c => c.kind === kind);
      if (!cards.length) continue;
      if (sec.heading && cards.length >= 2) {
        const gid = 'ng:' + uid();
        S.notes.groups.push({ id: gid, setId, kind, name: sec.heading });
        cards.forEach(c => addNoteItem(c, setId, gid, true));
      } else {
        cards.forEach(c => { const gid = 'ng:' + uid(); S.notes.groups.push({ id: gid, setId, kind, name: c.en }); addNoteItem(c, setId, gid, false); });
      }
      count += cards.length;
    }
  }
  if (!count) return null;
  S.notes.sets.push({ id: setId, title, created: Date.now(), confirmed: !!opts.confirmed, source: opts.source || '粘贴的文字' });
  return setId;
}
function pruneNoteGroups() {
  const used = new Set(S.notes.items.map(i => i.gid));
  S.notes.groups = S.notes.groups.filter(g => used.has(g.id));
}

function render(scroll) {
  const r = cur();
  const fn = VIEWS[r.v] || VIEWS.home;
  let out;
  try { out = fn(r); } catch (e) { console.error(e); stack = [{ v: 'home' }]; out = VIEWS.home({ v: 'home' }); }
  if (out && out.redirect) { stack[stack.length - 1] = out.redirect; return render(scroll); }
  renderSide();
  const backBtn = stack.length > 1 ? `<button class="icon-btn" type="button" data-a="back" aria-label="返回">${svg('back', 2)}</button>` : '';
  const crumb = (out.crumb || []).filter(Boolean).map(c => `<span>${esc(c)}</span>`).join('');

}

function modeToggle(id, three) {

}
function favBtn(id) {

}
function itemRow(id, opts = {}) {
  const it = ITEMS.get(id);
  const sub = it.type === 'grammar' ? `<span class="sub">原句：<span class="en">${esc(it.wrong)}</span></span>` : '';
  const ex = opts.ex && it.ex ? `<span class="meta en" style="font-style:italic">${esc(it.ex)}</span>` : '';
  return `<div class="row white">

    </button>
    <div class="side-ctl">${opts.noMode ? '' : modeToggle(id)}${favBtn(id)}</div>
  </div>`;
}
function markText(text, specs) {
  const lower = String(text || '').toLowerCase(), ranges = [];
  for (const sp of specs) {
    if (!sp.p) continue;
    const i = lower.indexOf(sp.p.toLowerCase());
    if (i < 0 || ranges.some(r => i < r.e && i + sp.p.length > r.s)) continue;
    ranges.push({ s: i, e: i + sp.p.length, cls: sp.cls || '' });
  }
  ranges.sort((a, b) => a.s - b.s);
  let out = '', pos = 0;
  for (const r of ranges) { out += esc(text.slice(pos, r.s)) + `<mark class="${r.cls}">` + esc(text.slice(r.s, r.e)) + '</mark>'; pos = r.e; }
  return out + esc(String(text || '').slice(pos));
}
const highlightIn = (text, phrases) => markText(text, phrases.map(p => ({ p })));
const fixedPart = en => en.split(/\s*(?:\.\.\.|…)\s*/).map(x => x.replace(/^[,.\s]+|[,.\s]+$/g, '')).filter(Boolean)[0] || en;
function blankIn(sentence, phrase) {
  const i = sentence.toLowerCase().indexOf(phrase.toLowerCase());
  if (i < 0) return null;
  return esc(sentence.slice(0, i)) + '<span class="blank"></span>' + esc(sentence.slice(i + phrase.length));
}
function stableIds(G) { return G.ids.filter(active); }
function groupStatusLine(G, s) {
  const parts = [`${s.total} 条`, `记忆 ${s.mem}`, `资料 ${s.ref}`];
  if (s.paused) parts.push(`暂缓 ${s.paused}`);
  return parts.join(' · ');
}

  if (cat === 'function') return all.filter(G => G.lib === 'function');
  return all.filter(G => G.lib === 'notes' && (noteSet(G.setId) || {}).confirmed);

    const groups = groupsForCat(ui.todayCat);

    const valid = G && G.lib === (ui.todayCat === 'function' ? 'function' : ui.todayCat);
    const s = valid ? gstats(G) : null;
    const summary = valid
      ? `已选「${esc(G.name)}」：<b>${s.fresh}</b> 条记忆、<b>${s.ref}</b> 条资料（资料不进入任务）${s.fresh > 20 ? ` · 将分 ${Math.ceil(s.fresh / 20)} 轮在今天完成` : ''}${!s.fresh ? ' · 展开后勾选要记忆的内容' : ''}`
      : '选择一个表达组；展开可以逐条决定记忆或资料';
    newPart = `<div class="seg" role="group" aria-label="内容分类">${cats.map(([k, t]) => `<button type="button" data-a="cat" data-c="${k}" aria-pressed="${ui.todayCat === k}">${t}</button>`).join('')}</div>
      ${ui.todayCat === 'function' ? '<p class="note-line">功能表达默认作为资料。勾选后才会进入新学和复习。</p>' : ''}
      ${groups.length ? `<div class="chooser" role="radiogroup" aria-label="表达组">${list}</div>` : `<div class="empty"><h3>还没有可学习的写作笔记</h3><p>导入并确认整理后，笔记组会出现在这里。</p><button class="btn btn-soft" type="button" data-go="import">导入笔记</button></div>`}
      <div class="sticky-bar"><span class="summary">${summary}</span><button class="btn btn-primary" type="button" data-a="startnew" ${valid && s.fresh ? '' : 'disabled'}>开始今日新学</button></div>`;
  }

  return {
    title: '今日学习', crumb: [fmtMD(Date.now())],
    body: `<section class="panel blush-soft"><div class="section-head"><h3>今日复习</h3><span class="hint">${dueN ? `${q.length} 组 · ${dueN} 条到期，按到期时间和错误记录排序` : '由系统按到期日期生成'}</span></div>${review}</section>
      <section class="section"><div class="section-head"><h3>今日新学</h3><span class="hint">每次学习一个完整的表达组，建议 15–20 条记忆内容</span></div>${newPart}</section>`,
  };
}

/* ============================================================
   新学流程：理解场景 → 主动写出 → 句子应用
   ============================================================ */
function startNew(gid) {
  const G = GROUPS.get(gid); if (!G) return;
  const ids = stableIds(G).filter(id => modeOf(id) === 'memory' && !studied(id));
  if (!ids.length) { toast('这个组没有待新学的记忆内容'); return; }
  S.newSession = { gid, ids, rounds: chunk(ids, 20), round: 0, step: 'intro', queue: [], first: {}, again: {}, apply: [], ai: 0, fb: null };
  save();
  go({ v: 'learn' });
}
function pickApply(ids) {
  return shuffle(ids.filter(id => { const it = ITEMS.get(id); return it && it.type !== 'core' && it.type !== 'grammar' && it.ex && it.ex.toLowerCase().includes(it.en.toLowerCase()); })).slice(0, 3);
}
function finishNew() {
  const ns = S.newSession;
  ui.lastNew = { gid: ns.gid, ids: ns.ids.slice(), firstOk: ns.ids.filter(id => ns.first[id]).length };
  S.newSession = null;
  save();
}
function answerOf(it) { return it.en; }

function promptHTML(it, ctx) {
  const G = GROUPS.get(it.gid) || {};
  const zh = `<div class="prompt-zh">${esc(it.zh)}</div>`;
  if (ctx === 'apply') {
    return `<div class="prompt-hint"><span>把表达放进句子：${esc(it.zh)}</span><span class="en">${blankIn(it.ex, it.en)}</span></div>`;
  }
  switch (it.type) {
    case 'core':
      return `${zh}<div class="prompt-hint"><span>写出完整的英文中心句 · 表达组：${esc(G.name || '')}</span></div>`;
    case 'know': {
      const b = it.ex && blankIn(it.ex, it.en);
      return `${zh}${b ? `<div class="prompt-hint"><span>补全句子中的短语</span><span class="en">${b}</span></div>` : ''}`;
    }
    case 'term': {
      const col = it.col && it.col.toLowerCase() !== it.en.toLowerCase() ? (blankIn(it.col, it.en) || esc(it.col)) : '';
      return `${zh}<div class="prompt-hint"><span>场景：${esc(G.name || '')}</span>${col ? `<span>搭配提示：<span class="en">${col}</span></span>` : ''}</div>`;
    }
    case 'fn':
      return `<div class="prompt-hint"><span>写作功能：${esc(G.fn || '')}</span></div>${zh}<div class="prompt-hint"><span>语气：${esc(it.tone || '')}</span></div>`;
    case 'pattern':
      return `${zh}<div class="prompt-hint"><span>写出句型结构，可替换部分用 ... 表示</span></div>`;
    case 'grammar':
      return `<div class="prompt-hint"><span>改正下面的句子</span></div><div class="prompt-zh en" style="font-family:var(--f-en)">${esc(it.wrong)}</div>`;
    default:
      return `${zh}<div class="prompt-hint"><span>写出对应的英文表达</span></div>`;
  }
}
function fbHTML(d, it, revealed) {
  const verdict = revealed ? '正确答案' : d.ok ? '完全正确' : '有几处不同';
  const extra = [];
  if (it.type === 'grammar' && it.zh) extra.push(`<span class="warm" style="font-size:14px">${esc(it.zh)}</span>`);
  else if (it.type !== 'grammar' && it.zh && revealed) extra.push(`<span class="warm" style="font-size:14px">${esc(it.zh)}</span>`);
  return `<div class="fb ${d.ok && !revealed ? 'ok' : 'bad'}"><div class="verdict">${verdict}</div>
    ${revealed || d.empty ? '' : `<div class="line"><span class="lbl">你的答案</span>${d.userHTML}</div>`}
    <div class="line"><span class="lbl">正确表达</span>${d.correctHTML}</div>${extra.join('')}</div>`;
}
function answerForm(fb, multiline) {
  return `<form data-form="answer" class="form" autocomplete="off">
    <input class="answer" id="answer" name="answer" type="text" value="${fb ? esc(fb.input) : ''}" ${fb ? 'readonly' : ''} placeholder="${multiline ? '写出完整句子' : '写出英文'}" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" aria-label="输入答案">
    ${fb ? '' : `<div class="btn-row"><button class="btn btn-primary" type="submit">提交答案</button><button class="btn btn-ghost" type="button" data-a="reveal">直接看答案</button></div>`}
  </form>`;
}

function vLearn() {
  const ns = S.newSession;
  if (!ns) return ui.lastNew ? vLearnDone() : { redirect: { v: 'today' } };
  const G = GROUPS.get(ns.gid);
  if (!G) { S.newSession = null; save(); return { redirect: { v: 'today' } }; }
  const roundIds = ns.rounds[ns.round];
  const stepIdx = { intro: 0, write: 1, apply: 2, rounddone: 3 }[ns.step];
  const steps = ['理解场景', '主动写出', '句子应用'].map((t, i) => `<span class="step ${i === stepIdx ? 'on' : i < stepIdx ? 'done' : ''}"><i>${i < stepIdx ? '✓' : i + 1}</i>${t}</span>`).join('');
  const roundTxt = ns.rounds.length > 1 ? `第 ${ns.round + 1} / ${ns.rounds.length} 轮 · ` : '';
  const head = `<div class="session-head"><div class="steps">${steps}</div><button class="btn btn-outline btn-sm" type="button" data-a="exit">退出并保存</button></div>`;
  let body = '';

  if (ns.step === 'intro') {
    const intro = roundIds.map(id => { const it = ITEMS.get(id); return it ? `<div class="intro-item">${typeTag(it.type)}<span class="en">${esc(it.en)}</span><span class="zh">${esc(it.zh)}</span>${it.ex ? `<span class="ex">${esc(it.ex)}</span>` : it.type === 'grammar' ? `<span class="ex">原句：${esc(it.wrong)}</span>` : ''}</div>` : ''; }).join('');
    body = `<div class="qcard"><div class="eyebrow">${roundTxt}先理解这个组<small>${esc(groupCrumb(G).join(' / '))}</small></div>
      <p class="prompt-zh" style="font-size:20px">${esc(G.scene || G.name)}</p>
      ${G.directions ? `<div class="chips">${G.directions.map(d => `<span class="chip">${esc(d)}</span>`).join('')}</div>` : ''}
      <div class="intro-list">${intro}</div>
      <div class="btn-row"><button class="btn btn-primary" type="button" data-a="beginwrite" data-enter>开始主动写出</button><span class="note-line">本轮 ${roundIds.length} 条记忆内容；资料不进入任务</span></div></div>`;
  } else if (ns.step === 'write' || ns.step === 'apply') {
    const isApply = ns.step === 'apply';
    const id = isApply ? ns.apply[ns.ai] : ns.queue[0];
    const it = ITEMS.get(id);
    if (!it) {
      if (isApply) { ns.ai++; if (ns.ai >= ns.apply.length) endRound(); }
      else { ns.queue.shift(); if (!ns.queue.length) { ns.apply = pickApply(roundIds); ns.ai = 0; if (ns.apply.length) ns.step = 'apply'; else endRound(); } }
      save(); return vLearn();
    }
    const doneN = isApply ? ns.ai : roundIds.filter(x => studied(x)).length;
    const totalN = isApply ? ns.apply.length : roundIds.length;
    const fb = ns.fb;
    const d = fb ? diff(fb.input, answerOf(it)) : null;
    const contLabel = !fb ? '' : isApply ? (ns.ai + 1 < ns.apply.length ? '下一句' : '完成句子应用') : (d.ok && !fb.revealed ? '下一条' : '本轮稍后重写');
    body = `<div class="progress"><span>${roundTxt}${isApply ? '句子应用' : '主动写出'} ${doneN} / ${totalN}</span><div class="pbar"><i style="width:${totalN ? doneN / totalN * 100 : 0}%"></i></div></div>
      <div class="qcard">
        <div class="qtype">${typeTag(it.type)}<span>${isApply ? '受控句子 → 填入表达' : PROMPT_LABEL[it.type]}</span>${!isApply && ns.again[id] ? '<span class="tag" style="background:var(--wrong-soft);color:var(--wrong)">重写</span>' : ''}</div>
        ${promptHTML(it, isApply ? 'apply' : 'learn')}
        ${answerForm(fb, it.type === 'core' || it.type === 'grammar')}
        ${fb ? fbHTML(d, it, fb.revealed) + `<div class="btn-row"><button class="btn btn-primary" type="button" data-a="cont" data-enter>${contLabel}</button>${!isApply && !(d.ok && !fb.revealed) ? '<span class="note-line">写错的内容会留在本轮，稍后重新默写</span>' : ''}</div>` : ''}
      </div>`;
  } else if (ns.step === 'rounddone') {
    body = `<div class="qcard"><div class="eyebrow">第 ${ns.round + 1} 轮完成</div><p class="prompt-zh" style="font-size:20px">本组还有 ${ns.rounds.length - ns.round - 1} 轮，保持同一组的语境，在今天内完成。</p>
      <div class="btn-row"><button class="btn btn-primary" type="button" data-a="nextround" data-enter>开始第 ${ns.round + 2} 轮</button><button class="btn btn-outline" type="button" data-a="exit">稍后继续</button></div></div>`;
  }
  return { title: G.name, crumb: ['今日新学', ...groupCrumb(G)], focus: true, body: `<div class="session">${head}${body}</div>` };
}
function vLearnDone() {
  const r = ui.lastNew, G = GROUPS.get(r.gid);
  const dueN = dueCount();
  const ck = canCheckin();
  return {
    title: '本组新学完成', crumb: ['今日新学', G ? G.name : ''], focus: true,
    body: `<div class="session">
      <div class="result-tiles">
        <div class="panel sage"><span class="eyebrow">本组记忆</span><span class="big-num">${r.ids.length}<small>条</small></span></div>
        <div class="panel"><span class="eyebrow">第一次就写对</span><span class="big-num">${r.firstOk}<small>条</small></span></div>
        <div class="panel blush-soft"><span class="eyebrow">首次复习</span><span class="big-num" style="font-size:32px;line-height:1.6">${fmtMD(addDays(Date.now(), 1))}</span></div>
      </div>
      <div class="qcard"><p class="prompt-zh" style="font-size:20px">「${esc(G ? G.name : '')}」已完成新学。</p>
        <p class="warm">明天会第一次复习这 ${r.ids.length} 条内容，之后按约 3 天、7 天、14 天和 30 天继续安排。写错过的内容会在复习中优先出现。</p>
        ${dueN ? `<p class="note-line">今天还有 ${dueN} 条复习到期，完成后可以打卡。</p>` : ''}
        <div class="btn-row">
          ${ck ? '<button class="btn btn-primary" type="button" data-a="checkin-back">完成学习并打卡</button>' : dueN ? '<button class="btn btn-primary" type="button" data-a="startreview-replace">开始今日复习</button>' : ''}
          <button class="btn btn-outline" type="button" data-a="quick-replace" data-id="${esc(r.gid)}">快速复习本组</button>
          <button class="btn btn-ghost" type="button" data-a="donenew">返回</button>
        </div></div></div>`,
  };
}

/* ============================================================
   复习流程：按组进行，记得 / 模糊 / 忘记
   ============================================================ */
function startReview(gid, replace) {
  const q = dueQueue();
  const g = gid ? q.find(x => x.gid === gid) : q[0];
  if (!g) { toast('今天没有到期的复习'); return; }
  const order = q.findIndex(x => x.gid === g.gid);
  S.reviewSession = { gid: g.gid, ids: g.ids.slice(0, 20), i: 0, fb: null, ratings: {}, groupNo: order + 1, groupTotal: q.length, more: g.ids.length > 20 };
  save();
  (replace ? replaceRoute : go)({ v: 'review' });
}
function vReview() {
  const rs = S.reviewSession;
  if (!rs) return ui.lastReview ? vReviewDone() : { redirect: { v: 'today' } };
  const G = GROUPS.get(rs.gid);
  let id = rs.ids[rs.i], it = ITEMS.get(id);
  while (rs.i < rs.ids.length && !it) { rs.i++; id = rs.ids[rs.i]; it = ITEMS.get(id); }
  if (!it || !G) { finishReview(); return vReviewDone(); }
  const fb = rs.fb;
  const d = fb ? diff(fb.input, answerOf(it)) : null;
  let rates = '';
  if (fb) {
    const sug = fb.revealed ? 'fgt' : d.ok ? 'rem' : d.score >= 0.6 ? 'vag' : 'fgt';
    rates = `<div class="rates">${[['rem', '记得', 'r-rem'], ['vag', '模糊', 'r-vag'], ['fgt', '忘记', 'r-fgt']].map(([k, t, c], i) => `<button class="rate ${c} ${sug === k ? 'suggest' : ''}" type="button" data-a="rate" data-r="${k}" ${sug === k ? 'data-enter' : ''}><b>${t}</b><span>${nextIntervalLabel(id, k)}</span></button>`).join('')}</div>
      <p class="note-line">评分只记录这一次的表现，不会直接把内容改成永久掌握。</p>`;
  }
  const s = S.items[id] || {};
  return {
    title: G.name, crumb: ['今日复习', `第 ${rs.groupNo} / ${rs.groupTotal} 组`, ...groupCrumb(G)], focus: true,
    body: `<div class="session">
      <div class="session-head"><div class="progress" style="flex:1"><span>${rs.i + 1} / ${rs.ids.length}${rs.more ? ' · 本组分轮' : ''}</span><div class="pbar"><i style="width:${rs.i / rs.ids.length * 100}%"></i></div></div><button class="btn btn-outline btn-sm" type="button" data-a="exit">退出并保存</button></div>
      <div class="qcard">
        <div class="qtype">${typeTag(it.type)}<span>${PROMPT_LABEL[it.type]}</span>${s.wrong ? `<span class="tag" style="background:var(--wrong-soft);color:var(--wrong)">曾写错 ${s.wrong} 次</span>` : ''}</div>
        ${promptHTML(it, 'review')}
        ${answerForm(fb, it.type === 'core' || it.type === 'grammar')}
        ${fb ? fbHTML(d, it, fb.revealed) + rates : ''}
      </div></div>`,
  };
}
function finishReview() {
  const rs = S.reviewSession;
  const ratings = rs.ratings;
  const ids = Object.keys(ratings);
  const fgt = ids.filter(id => ratings[id] === 'fgt').length;
  let pulled = false;
  if (ids.length >= 4 && fgt / ids.length >= 0.5) {
    const cap = addDays(Date.now(), 3);
    ids.filter(id => ratings[id] === 'rem').forEach(id => { const s = st(id); if (s.next > cap) { s.next = cap; pulled = true; } });
  }
  ui.lastReview = { gid: rs.gid, ratings, ids, pulled, practiced: false };
  S.reviewSession = null;
  save();
}
function vReviewDone() {
  const r = ui.lastReview, G = GROUPS.get(r.gid);
  const c = { rem: 0, vag: 0, fgt: 0 };
  r.ids.forEach(id => c[r.ratings[id]]++);
  const wrongIds = r.ids.filter(id => r.ratings[id] !== 'rem' && ITEMS.has(id));
  const q = dueQueue();
  const ck = canCheckin();
  const l = todayLog();
  let main;
  if (q.length) main = `<button class="btn btn-primary" type="button" data-a="startreview-replace">继续下一组（还剩 ${q.length} 组）</button>`;
  else if (ck) main = `<button class="btn btn-primary" type="button" data-a="checkin-back">完成复习并打卡</button>`;
  else if (l.checked) main = `<span class="tag core">今天已打卡</span>`;
  else main = '';
  return {
    title: '本组复习完成', crumb: ['今日复习', G ? G.name : ''], focus: true,
    body: `<div class="session">
      <div class="result-tiles">
        <div class="panel sage"><span class="eyebrow">记得</span><span class="big-num">${c.rem}</span></div>
        <div class="panel linen"><span class="eyebrow">模糊</span><span class="big-num">${c.vag}</span></div>
        <div class="panel blush"><span class="eyebrow">忘记</span><span class="big-num">${c.fgt}</span></div>
      </div>
      ${r.pulled ? '<p class="note-line">本组错误较多，记得的内容也提前到 3 天内复习。</p>' : ''}
      ${wrongIds.length ? `<section class="section"><div class="section-head"><h3>需要再看一眼</h3><span class="hint">忘记的内容明天优先复习</span></div><div class="rows">${wrongIds.map(id => { const it = ITEMS.get(id); return `<div class="row"><div class="body"><span class="en title">${esc(it.en)}</span><span class="sub">${esc(it.zh)}</span></div><span class="tag ${r.ratings[id] === 'fgt' ? 'know' : 'term'}">${r.ratings[id] === 'fgt' ? '忘记' : '模糊'}</span></div>`; }).join('')}</div></section>` : ''}
      <div class="qcard"><p class="warm">${q.length ? '今天还有其他到期的表达组。每组单独完成，保持各自的语境。' : ck ? '今天到期的复习已经全部完成。确认后写入学习记录和月度日历。' : '今天到期的复习已经全部完成。'}</p>
        <div class="btn-row">${main}${wrongIds.length && !r.practiced ? '<button class="btn btn-soft" type="button" data-a="practice">再练一次错题</button>' : ''}<button class="btn btn-ghost" type="button" data-a="donereview">返回</button></div></div>
    </div>`,
  };
}
function vPractice() {
  const p = ui.practice;
  if (!p) return { redirect: { v: 'home' } };
  const id = p.ids[p.i], it = ITEMS.get(id);
  if (!it) { back(); return vReviewDone(); }

      <div class="qcard"><div class="qtype">${typeTag(it.type)}<span>${PROMPT_LABEL[it.type]}</span></div>
        ${promptHTML(it, 'review')}${answerForm(fb, it.type === 'core' || it.type === 'grammar')}
        ${fb ? fbHTML(d, it, fb.revealed) + `<div class="btn-row"><button class="btn btn-primary" type="button" data-a="cont" data-enter>${p.i + 1 < p.ids.length ? '下一条' : '完成练习'}</button></div>` : ''}
      </div></div>`,

}

/* ============================================================
   快速复习：遮挡中文 / 遮挡英文 / 显示全部（不改变学习状态）

      <button class="qr-cell zh ${hideZh ? 'masked' : ''}" type="button" data-a="qr" data-k="${esc(id)}:zh" ${hideZh ? '' : 'tabindex="-1"'}>${typeTag(it.type)} ${esc(it.zh)}${it.type === 'grammar' ? `<br><span class="muted">原句：${esc(it.wrong)}</span>` : ''}</button>
    </div>`;

  return {

}

/* ============================================================

function vLibrary() {
  const topicGroups = [...GROUPS.values()].filter(G => G.lib === 'topic');
  return {

function groupActions(G, s) {
  const btns = [];
  if (s.due) btns.push(`<button class="btn btn-primary" type="button" data-a="reviewgroup" data-id="${esc(G.id)}">复习本组（${s.due} 条到期）</button>`);
  if (s.fresh) btns.push(`<button class="btn ${s.due ? 'btn-outline' : 'btn-primary'}" type="button" data-go="today:${esc(G.id)}">开始本组新学</button>`);
  if (S.newSession && S.newSession.gid === G.id) btns.unshift(`<button class="btn btn-primary" type="button" data-a="resumenew">继续本组新学</button>`);
  btns.push(`<button class="btn btn-outline" type="button" data-go="quick:${esc(G.id)}">快速复习</button>`);
  btns.push(`<button class="btn btn-soft" type="button" data-go="add:${esc(G.id)}">${svg('plus', 2)}${G.lib === 'notes' ? '添加卡片' : '添加表达'}</button>`);
  return `<div class="btn-row">${btns.join('')}</div>`;
}
function groupHero(G, s, cls, desc) {
  return `<section class="group-hero ${cls}">
    ${desc ? `<p>${esc(desc)}</p>` : ''}
    <div class="stats-line"><span><b>${s.total}</b>条</span><span><b>${s.mem}</b>记忆</span><span><b>${s.ref}</b>资料</span>${s.last ? `<span>上次学习 ${agoDay(s.last)}</span>` : ''}${s.next < Infinity ? `<span>下次复习 ${relDay(s.next)}</span>` : ''}<span>${statusHTML(s.status)}</span></div>
    ${groupActions(G, s)}</section>`;
}
function vGroup(r) {
  const G = GROUPS.get(r.id);
  if (!G) return { redirect: { v: 'home' } };
  const s = gstats(G);
  const ids = stableIds(G);
  let body;
  if (G.lib === 'topic') {
    const by = t => ids.filter(id => ITEMS.get(id).type === t);
    const sec = (title, hint, list, opts) => list.length ? `<section class="section"><div class="section-head"><h3>${title}</h3><span class="hint">${hint}</span></div><div class="rows">${list.map(id => itemRow(id, opts)).join('')}</div></section>` : '';
    const phr = ids.map(id => ITEMS.get(id)).filter(it => it.type !== 'core').map(it => it.en);
    const cores = ids.map(id => ITEMS.get(id)).filter(it => it.type === 'core').map(it => it.en.replace(/\.$/, ''));
    body = groupHero(G, s, '', G.scene) +
      sec('核心论点', '可作为主体段中心句 · 默认记忆', by('core'), {}) +
      (G.directions ? `<section class="section"><div class="section-head"><h3>可展开方向</h3><span class="hint">这一条观点可以写什么</span></div><div class="chips">${G.directions.map(d => `<span class="chip">${esc(d)}</span>`).join('')}</div></section>` : '') +
      sec('知识表达', '解释论点的作用、机制和结果 · 默认资料', by('know'), { ex: true }) +
      sec('专业词汇 / 固定搭配', '具体场景中的术语和搭配 · 默认资料', by('term'), { ex: true }) +
      (G.paragraph ? `<section class="section"><div class="section-head"><h3>示例段落</h3><span class="hint">浅绿为组内表达，浅粉为核心论点</span></div><div class="paragraph">${markText(G.paragraph, cores.map(p => ({ p, cls: 'core' })).concat(phr.map(p => ({ p }))))}</div></section>` : '') +
      (G.related && G.related.length ? `<section class="section"><div class="section-head"><h3>相关表达</h3></div><div class="chips">${G.related.map(x => GROUPS.get(x)).filter(Boolean).map(X => `<button class="chip" type="button" data-go="group:${esc(X.id)}">${esc(X.topic)} · ${esc(X.name)}</button>`).join('')}</div></section>` : '');
  } else if (G.lib === 'function') {
    const rows = ids.map(id => {
      const it = ITEMS.get(id);
      return `<tr><td class="expr"><button type="button" data-go="item:${esc(id)}">${esc(it.en)}</button><div class="muted" style="font-size:13px">${esc(it.zh)}</div></td><td>${esc(it.syntax || '')}</td><td>${esc(it.tone || '')}</td><td>${esc(it.diff || '')}</td><td>${modeToggle(id)}</td></tr>`;
    }).join('');
    body = groupHero(G, s, 'fn', G.scene + ' 功能表达默认作为资料，切换为记忆后才进入新学和复习。') +
      `<section class="section"><div class="section-head"><h3>近义表达比较</h3><span class="hint">横向滑动查看完整表格</span></div><div class="cmp-wrap"><table class="cmp"><thead><tr><th>表达</th><th>句法</th><th>语气和边界</th><th>近义区别</th><th>学习方式</th></tr></thead><tbody>${rows}</tbody></table></div></section>
      <section class="section"><div class="section-head"><h3>示例句与常见错误</h3></div><div class="rows">${ids.map(id => { const it = ITEMS.get(id); return `<div class="row white"><div class="body"><span class="en" style="font-size:17px">${highlightIn(it.ex || '', [fixedPart(it.en)])}</span>${it.err ? `<span class="meta">常见错误：${esc(it.err)}</span>` : ''}</div>${favBtn(id)}</div>`; }).join('')}</div></section>`;
  } else {
    const set = noteSet(G.setId);
    body = groupHero(G, s, 'notes', (set ? set.title : '') + ' · ' + KIND_LABEL[G.kind]) +
      `<section class="section"><div class="section-head"><h3>组内卡片</h3><span class="hint">${G.ids.length} 张${KIND_LABEL[G.kind].replace('组', '卡')}</span></div><div class="rows">${ids.map(id => itemRow(id, { tag: true })).join('')}</div></section>`;
  }

}

  const s = S.items[it.id] || {};
  const block = (label, val, cls = '') => val ? `<div class="field-block ${cls}"><span class="label">${label}</span><div class="val ${cls.includes('en') ? 'en' : ''}">${val}</div></div>` : '';
  let main = `<div class="expr-hero"><div class="qtype">${typeTag(it.type)}${it.lib === 'function' ? `<span class="tag">${esc(G.fn)}</span>` : ''}${statusHTML(itemStatus(it.id))}</div>
    <div class="en">${esc(it.en)}</div><div class="zh">${esc(it.zh)}</div></div>`;
  if (it.lib === 'topic') {
    main += block('例句', it.ex ? highlightIn(it.ex, [it.en]) : '', 'en') +
      block('常用搭配', esc(it.col)) + block('使用提醒', esc(it.usage)) + block('常见错误', esc(it.err)) +
      block('来源', esc(it.src || (it.custom ? '自己添加 · ' + G.topic + ' / ' + G.sub : '')));
  } else if (it.lib === 'function') {
    const others = G.ids.filter(x => x !== it.id).map(x => ITEMS.get(x));
    main += block('写作功能', esc(G.fn) + ' · ' + esc(G.scene || '')) +
      block('句法结构', esc(it.syntax)) + block('语气和使用边界', esc(it.tone)) +

      block('示例句', it.ex ? highlightIn(it.ex, [fixedPart(it.en)]) : '', 'en') + block('常见错误', esc(it.err));
  } else {
    const set = noteSet(it.setId);

      `<p class="note-line" style="margin-top:-10px">来源：${esc(set ? set.title : '')}${it.line ? ` · 第 ${it.line} 行` : ''}</p>` +
      (it.type === 'grammar'
        ? `<div class="pair"><div class="field-block wrongline"><span class="label">原来的写法</span><div class="val en">${esc(it.wrong)}</div></div><div class="field-block rightline"><span class="label">整理后的写法</span><div class="val en">${esc(it.en)}</div></div></div>`
        : block('整理后的' + (it.type === 'pattern' ? '句型' : '表达'), esc(it.en) + (it.zh ? `<div class="warm" style="font-family:var(--f-ui);font-size:15px">${esc(it.zh)}</div>` : ''), 'en')) +
      block(it.type === 'grammar' ? '修改原因' : '个人错误', esc(it.type === 'grammar' ? it.zh : it.err)) +
      block('使用规则', esc(it.usage)) +
      `<div class="field-block"><span class="label">受控练习 · ${PROMPT_LABEL[it.type]}</span>
        <div class="val" style="display:flex;flex-direction:column;gap:10px;margin-top:4px">${promptHTML(it, 'drill')}
        <form data-form="drill" data-id="${esc(it.id)}" class="btn-row" style="align-items:stretch"><input class="answer" id="drill-in" style="flex:1 1 260px;font-size:18px" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="在这里练习，不影响学习记录"><button class="btn btn-outline" type="submit">检查</button></form>
        <div id="drill-fb"></div></div></div>`;
  }
  const idx = G.ids.indexOf(it.id), nextId = G.ids[(idx + 1) % G.ids.length];

      <div class="kv"><span>写错次数</span><b class="num">${s.wrong || 0}</b></div></div>
      ${hist.length ? `<div class="chips">${hist.map(h => `<span class="tag ${h.r === 'rem' ? 'core' : h.r === 'fgt' ? 'know' : ''}">${agoDay(h.t)} · ${h.p === 'new' ? '新学' : RL[h.r]}</span>`).join('')}</div>` : ''}
    </section>
    <section class="panel line"><div class="panel-head"><div class="eyebrow">个人备注</div>${favBtn(it.id)}</div>
      <textarea class="note" id="note-${esc(it.id)}" data-note="${esc(it.id)}" placeholder="记录自己的用法、易错点或出处">${esc(s.note || '')}</textarea></section>
    <div class="btn-row">${G.ids.length > 1 ? `<button class="btn btn-outline" type="button" data-a="nextitem" data-id="${esc(nextId)}">组内下一条</button>` : ''}
      ${it.lib === 'notes' ? `<button class="btn btn-soft" type="button" data-go="edit:${esc(it.id)}">编辑卡片</button>` : ''}
      ${it.custom || it.lib === 'notes' ? `<button class="btn btn-ghost btn-danger" type="button" data-a="delitem" data-id="${esc(it.id)}" data-confirm="确认删除">删除</button>` : ''}</div>`;
  return { title: G.lib === 'notes' && G.ids.length < 2 ? '独立卡片' : G.name, crumb: groupCrumb(G), body: `<div class="detail"><div class="detail-main">${main}</div><aside class="detail-side">${side}</aside></div>` };
}

function setSessionFb(input, revealed) {
  const r = cur();
  if (r.v === 'learn') {
    const ns = S.newSession;
    const id = ns.step === 'apply' ? ns.apply[ns.ai] : ns.queue[0];
    const it = ITEMS.get(id);
    ns.fb = { input, revealed };
    if (ns.step === 'write' && ns.first[id] === undefined) ns.first[id] = !revealed && diff(input, answerOf(it)).ok;
    save();
  } else if (r.v === 'review') {
    S.reviewSession.fb = { input, revealed }; save();
  } else if (r.v === 'practice') {
    ui.practice.fb = { input, revealed };
  }
  render();
}
function continueLearn() {
  const ns = S.newSession;
  if (ns.step === 'apply') {
    ns.ai++; ns.fb = null;
    if (ns.ai >= ns.apply.length) endRound();
  } else {
    const id = ns.queue[0], it = ITEMS.get(id), fb = ns.fb;
    const ok = fb && !fb.revealed && diff(fb.input, answerOf(it)).ok;
    ns.fb = null;
    if (ok) { markLearned(id, !!ns.first[id]); ns.queue.shift(); }
    else { ns.again[id] = true; ns.queue.push(ns.queue.shift()); }
    if (!ns.queue.length) {
      ns.apply = pickApply(ns.rounds[ns.round]); ns.ai = 0;
      if (ns.apply.length) ns.step = 'apply'; else endRound();
    }
  }
  if (S.newSession) save();
  render(true);
}
function endRound() {
  const ns = S.newSession;
  if (ns.round + 1 < ns.rounds.length) ns.step = 'rounddone';
  else finishNew();
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-a],[data-go],[data-nav]');
  if (!el || el.disabled) return;
  if (el.dataset.confirm && !el.classList.contains('armed')) {
    el.classList.add('armed');
    el.dataset.label = el.textContent;
    el.textContent = el.dataset.confirm;
    setTimeout(() => { if (el.isConnected) { el.classList.remove('armed'); el.textContent = el.dataset.label; } }, 3500);
    return;
  }
  if (el.dataset.nav) {
    const v = el.dataset.nav;
    if (v === 'today') { ui.todaySel = ui.todaySel || null; }
    goRoot({ v }); return;
  }
  if (el.dataset.go) { go(parseRoute(el.dataset.go)); return; }
  const a = el.dataset.a, id = el.dataset.id;
  switch (a) {
    case 'back': back(); break;
    case 'hidehint': S.user.hintClosed = true; save(); render(); break;
    case 'mode': {
      S.items[id] = S.items[id] || { hist: [], wrong: 0 };
      S.items[id].mode = el.dataset.m; save(); render();
      break;
    }
    case 'fav': { const s = st(id); s.fav = !s.fav; save(); render(); toast(s.fav ? '已收藏' : '已取消收藏'); break; }
    case 'mem': { st(id).mode = modeOf(id) === 'memory' ? 'reference' : 'memory'; save(); render(); break; }
    case 'cat': ui.todayCat = el.dataset.c; render(); break;
    case 'pick': ui.todaySel = id; ui.todayOpen.add(id); render(); break;
    case 'expand': ui.todayOpen.has(id) ? ui.todayOpen.delete(id) : ui.todayOpen.add(id); render(); break;
    case 'startnew': if (ui.todaySel) startNew(ui.todaySel); break;
    case 'resumenew': go({ v: 'learn' }); break;
    case 'dropnew': S.newSession = null; save(); render(); toast('已放弃本次新学进度，已完成的条目保留'); break;
    case 'beginwrite': { const ns = S.newSession; ns.step = 'write'; ns.queue = ns.rounds[ns.round].filter(x => !studied(x)); ns.fb = null; if (!ns.queue.length) endRound(); if (S.newSession) save(); render(true); break; }
    case 'nextround': { const ns = S.newSession; ns.round++; ns.step = 'intro'; ns.fb = null; save(); render(true); break; }
    case 'reveal': setSessionFb('', true); break;
    case 'cont': {
      const r = cur();
      if (r.v === 'learn') continueLearn();
      else if (r.v === 'practice') { const p = ui.practice; p.i++; p.fb = null; if (p.i >= p.ids.length) { ui.lastReview.practiced = true; back(); toast('错题练习完成'); } else render(true); }
      break;
    }
    case 'donenew': ui.lastNew = null; back(); break;
    case 'startreview': startReview(); break;
    case 'startreview-replace': ui.lastNew = null; startReview(null, true); break;
    case 'reviewgroup': startReview(id); break;
    case 'resumereview': go({ v: 'review' }); break;
    case 'rate': {
      const rs = S.reviewSession, iid = rs.ids[rs.i];
      applyRating(iid, el.dataset.r, ITEMS.get(iid).type);
      rs.ratings[iid] = el.dataset.r; rs.i++; rs.fb = null;
      if (rs.i >= rs.ids.length) finishReview(); else save();
      render(true);
      break;
    }
    case 'practice': {
      const r = ui.lastReview;
      ui.practice = { ids: r.ids.filter(x => r.ratings[x] !== 'rem' && ITEMS.has(x)), i: 0, fb: null };
      go({ v: 'practice' }); break;
    }
    case 'donereview': ui.lastReview = null; back(); break;
    case 'checkin': checkin(); render(); break;
    case 'checkin-back': checkin(); ui.lastNew = null; ui.lastReview = null; back(); break;
    case 'exit': back(); toast('已保存进度，可以从首页继续'); break;
    case 'quick-replace': ui.lastNew = null; replaceRoute({ v: 'quick', id }); break;
    case 'qrmode': ui.qrMode = el.dataset.m; ui.qrShown = new Set(); render(); break;
    case 'qr': if (el.classList.contains('masked')) { ui.qrShown.add(el.dataset.k); el.classList.remove('masked'); } break;
    case 'qrreset': ui.qrShown = new Set(); render(); break;
    case 'nextitem': replaceRoute({ v: 'item', id }); break;
    case 'nfilter': ui.notesFilter = el.dataset.f; render(); break;
    case 'calprev': case 'calnext': { let [y, m] = ui.calMonth; m += a === 'calprev' ? -1 : 1; if (m < 0) { m = 11; y--; } if (m > 11) { m = 0; y++; } ui.calMonth = [y, m]; render(); break; }
    case 'seg': {
      const seg = el.closest('[data-seg]');
      seg.dataset.value = el.dataset.v;
      seg.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b === el)));
      break;
    }
    case 'sample': { const ta = $('#import-text'); ta.value = SAMPLE_NOTE; $('[data-form="import"] [name="title"]').value = dayKey() + ' 示例笔记'; break; }
    case 'ttype': {
      const it = S.notes.items.find(x => x.id === id);
      if (it && it.type !== el.dataset.t) {
        it.type = el.dataset.t;
        const gid = 'ng:' + uid();
        S.notes.groups.push({ id: gid, setId: it.setId, kind: it.type, name: it.en });
        it.gid = gid; pruneNoteGroups(); assemble(); save(); render();
      }
      break;
    }
    case 'tdel': S.notes.items = S.notes.items.filter(x => x.id !== id); delete S.items[id]; pruneNoteGroups(); assemble(); save(); render(); break;
    case 'tconfirm': {
      const set = noteSet(id); set.confirmed = true;
      S.notes.items.filter(x => x.setId === id).forEach(x => { if (!(S.items[x.id] && S.items[x.id].mode)) st(x.id).mode = defMode(x); });
      assemble(); save(); toast('已确认，记忆内容进入“等待学习”'); replaceRoute({ v: 'notes' });
      break;
    }
    case 'tdiscard': case 'delset': {
      const gone = new Set(S.notes.items.filter(x => x.setId === id).map(x => x.id));
      S.notes.items = S.notes.items.filter(x => x.setId !== id);
      S.notes.groups = S.notes.groups.filter(g => g.setId !== id);
      S.notes.sets = S.notes.sets.filter(s => s.id !== id);
      gone.forEach(x => delete S.items[x]);
      if (S.newSession && !GROUPS.has(S.newSession.gid)) S.newSession = null;
      assemble();
      if (S.newSession && !GROUPS.has(S.newSession.gid)) S.newSession = null;
      if (S.reviewSession && !GROUPS.has(S.reviewSession.gid)) S.reviewSession = null;
      save();
      toast(a === 'tdiscard' ? '已放弃这次导入' : '已删除笔记组');
      if (a === 'tdiscard') replaceRoute({ v: 'notes' }); else render();
      break;
    }
    case 'delitem': {
      const it = ITEMS.get(id);
      if (it.lib === 'notes') { S.notes.items = S.notes.items.filter(x => x.id !== id); pruneNoteGroups(); }
      else { S.custom.items = S.custom.items.filter(x => x.id !== id); const used = new Set(S.custom.items.map(x => x.gid)); S.custom.groups = S.custom.groups.filter(g => used.has(g.id)); }
      delete S.items[id];
      assemble();
      if (S.newSession) { S.newSession.ids = S.newSession.ids.filter(x => x !== id); if (!S.newSession.ids.length) S.newSession = null; }
      save(); toast('已删除'); back();
      break;
    }
  }
});

document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target;
  const kind = f.dataset.form;
  if (kind === 'answer') {
    const inp = f.querySelector('.answer');
    if (inp.readOnly) return;
    setSessionFb(inp.value, false);
  } else if (kind === 'drill') {
    const it = ITEMS.get(f.dataset.id);
    const d = diff($('#drill-in').value, answerOf(it));
    $('#drill-fb').innerHTML = fbHTML(d, it, d.empty);
  } else if (kind === 'add') {
    const G = GROUPS.get(f.dataset.id);
    const v = n => (f.querySelector(`[name="${n}"]`) || { value: '' }).value.trim();
    const seg = n => { const s = f.querySelector(`[data-seg="${n}"]`); return s ? s.dataset.value : ''; };
    const en = v('en'), zh = v('zh');
    if (!en || !zh) { $('#form-msg').textContent = '请填写英文表达和中文含义。'; return; }
    if (/[㐀-鿿]/.test(en)) { $('#form-msg').textContent = '英文表达里不要包含中文。'; return; }
    const id = (G.lib === 'notes' ? 'n:' : 'c:') + uid();
    let type = G.lib === 'function' ? 'fn' : seg('type');
    let gid = G.id;
    const solo = seg('target') === 'solo' || (G.lib === 'notes' && type !== G.kind);
    if (G.lib === 'notes') {
      if (type === 'grammar' && !v('wrong')) { $('#form-msg').textContent = '语法卡需要填写原来的错误写法。'; return; }
      if (solo) { gid = 'ng:' + uid(); S.notes.groups.push({ id: gid, setId: G.setId, kind: type, name: en }); }
      S.notes.items.push({ id, setId: G.setId, gid, type, en, zh, wrong: v('wrong'), usage: v('ex'), err: '', raw: '', line: 0, defMode: seg('mode') });
    } else {
      if (solo) {
        gid = 'cg:' + uid();
        S.custom.groups.push(G.lib === 'topic'
          ? { id: gid, lib: 'topic', topic: G.topic, sub: G.sub, name: en, scene: zh, independent: true, parent: G.id }
          : { id: gid, lib: 'function', fn: G.fn, name: en, scene: G.scene, independent: true, parent: G.id });
      }
      S.custom.items.push({ id, lib: G.lib, type, gid, en, zh, ex: v('ex'), col: '', usage: '', err: '', syntax: v('syntax'), tone: v('tone'), diff: v('diff'), defMode: seg('mode') });
    }
    st(id).mode = seg('mode');
    assemble(); save(); back(); toast(solo ? '已作为独立项保存' : '已加入「' + G.name + '」');
  } else if (kind === 'edit') {
    const it = S.notes.items.find(x => x.id === f.dataset.id);
    const v = n => f.querySelector(`[name="${n}"]`).value.trim();
    const type = f.querySelector('[data-seg="type"]').dataset.value;
    if (!v('en')) { $('#form-msg').textContent = '英文表达不能为空。'; return; }
    if (type === 'grammar' && !v('wrong')) { $('#form-msg').textContent = '语法卡需要填写原来的错误写法。'; return; }
    Object.assign(it, { en: v('en'), zh: v('zh'), wrong: v('wrong'), err: v('err'), usage: v('usage') });
    if (type !== it.type) {
      it.type = type;
      const gid = 'ng:' + uid();
      S.notes.groups.push({ id: gid, setId: it.setId, kind: type, name: it.en });
      it.gid = gid; pruneNoteGroups();
    }
    assemble(); save(); back(); toast('已保存修改');
  } else if (kind === 'import') {
    const text = f.querySelector('[name="text"]').value;
    const title = f.querySelector('[name="title"]').value.trim() || dayKey() + ' 写作笔记';
    if (!text.trim()) { $('#form-msg').textContent = '请先粘贴笔记内容或导入 Markdown 文件。'; return; }
    const setId = createNoteSet(text, title, { source: importSource || '粘贴的文字' });
    importSource = '';
    if (!setId) { $('#form-msg').textContent = '没有识别到英文表达。每行写一条，英文在前、中文在后。'; return; }
    assemble(); save(); replaceRoute({ v: 'triage', id: setId });
  }
});

let importSource = '';
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'md-file' && t.files && t.files[0]) {
    const file = t.files[0];
    const reader = new FileReader();
    reader.onload = () => {
      $('#import-text').value = String(reader.result || '');
      const title = $('[data-form="import"] [name="title"]');
      title.value = file.name.replace(/\.(md|markdown|txt)$/i, '') || title.value;
      importSource = 'Markdown 文件 · ' + file.name;
      toast('已读取 ' + file.name);
    };
    reader.onerror = () => toast('文件读取失败，请改为粘贴文字');
    reader.readAsText(file);
  }
  if (t.dataset.tmove) {
    const it = S.notes.items.find(x => x.id === t.dataset.tmove);
    if (t.value === 'solo' || t.value === 'new') {
      const gid = 'ng:' + uid();
      S.notes.groups.push({ id: gid, setId: it.setId, kind: it.type, name: t.value === 'new' ? '新的语义组' : it.en });
      it.gid = gid;
      if (t.value === 'new') toast('已新建语义组，再把相近的卡片移进来');
    } else it.gid = t.value;
    pruneNoteGroups(); assemble(); save(); render();
  }
});

let noteTimer;
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'q') {
    const q = t.value;
    if (!q.trim()) { if (cur().v === 'search') back(); return; }
    if (cur().v === 'search') { cur().id = q; render(); } else go({ v: 'search', id: q });
    t.focus();
    return;
  }
  if (t.dataset.note) {
    const id = t.dataset.note;
    clearTimeout(noteTimer);
    noteTimer = setTimeout(() => { st(id).note = t.value; save(); }, 300);
  }
  if (t.dataset.tf) {
    const it = S.notes.items.find(x => x.id === t.dataset.id);
    if (it) { it[t.dataset.tf] = t.value; save(); assemble(); }
  }
  if (t.dataset.gname) {
    const g = S.notes.groups.find(x => x.id === t.dataset.gname);
    if (g) { g.name = t.value; save(); assemble(); }
  }
});

document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || e.isComposing) return;
  const t = e.target;
  if (t.matches('textarea') || (t.matches('input') && !t.readOnly)) return;
  if (t.matches('button') && !t.hasAttribute('data-enter')) return;
  const b = $('#view [data-enter]');
  if (b) { e.preventDefault(); b.click(); }
});

/* ============================================================
   启动
   ============================================================ */
if (!S.seeded) {
  createNoteSet(SAMPLE_NOTE, '示例 · 2026-10-06 写作笔记', { confirmed: true, source: '示例笔记，可删除' });
  S.seeded = true;
  save();
}
assemble();
const startHash = (location.hash || '').slice(1);
if (VIEWS[startHash] && ['home', 'today', 'topics', 'funcs', 'notes', 'favs', 'records', 'library'].includes(startHash)) stack = [{ v: startHash }];
render(true);
})();
</script>
